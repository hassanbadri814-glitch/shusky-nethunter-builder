name: Audit Pixel 8 installed kernel source pin
# audit-only: extend exact GKI and Native FIPS dependency inspection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-pin-audit.yml"
      - ".github/workflows/build-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pin-audit:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'audit-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout builder workflow for static validation
        uses: actions/checkout@v4

      - name: Validate GKI prebuilt and Native FIPS workflow wiring
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/build-kernel.yml", aliases: true); puts "Workflow YAML syntax: PASS"'
          python3 <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/build-kernel.yml").read_text()
          required = {
              "exact Pixel device source commit":
                  "8769cc47188c3bdca2a34d39ba0f39a945b85465",
              "installed GKI build ID":
                  "--use_prebuilt_gki=14691759",
              "Kleaf GKI repository build-number map":
                  "--action_env=KLEAF_DOWNLOAD_BUILD_NUMBER_MAP=gki_prebuilts=14691759",
              "Native FIPS kernel label override":
                  "--//private/devices/google/common:kernel=//common:kernel_aarch64_download_or_build",
              "native FIPS compilation (not prebuilt module)":
                  "--no//private/devices/google/common:download_prebuilt_gki_fips140",
              "GKI kernel target alias":
                  "//common:kernel_aarch64_download_or_build",
              "GKI images target alias":
                  "//common:kernel_aarch64_images_download_or_build",
              "GKI artifacts target alias":
                  "//common:kernel_aarch64_gki_artifacts_download_or_build",
              "GKI headers target alias":
                  "//common:kernel_aarch64_headers_download_or_build",
              "build authorization guard":
                  "contains(github.event.head_commit.message, 'build-authorized')",
          }
          for label, value in required.items():
              if value not in workflow:
                  raise SystemExit(f"FAIL: missing {label}: {value}")
              print(f"PASS: {label}")

          forbidden = {
              "incorrect installed-kernel source pin": "164ae0b804dd",
              "explicit source-build GKI setting": "--//build/kernel/kleaf:use_prebuilt_gki=false",
          }
          for label, value in forbidden.items():
              if value in workflow:
                  raise SystemExit(f"FAIL: forbidden {label}: {value}")
              print(f"PASS: absent {label}")

          if "build-authorized" in Path(".git/COMMIT_EDITMSG").read_text() if Path(".git/COMMIT_EDITMSG").exists() else False:
              raise SystemExit("FAIL: authorization marker found in commit edit message")
          print("Static workflow wiring: PASS")
          PY

      - name: Reconstruct exact GKI build manifest and compare Pixel source pin (audit only)
        shell: bash
        run: |
          set -euo pipefail

          # Exact output read from the Pixel 8 on 2026-11-16.
          KERNEL_RELEASE="6.1.145-android14-11-gfa1d6308d1fe-ab14691759"
          INSTALLED_PREFIX="fa1d6308d1fe"
          EXPECTED_FULL_SHA="fa1d6308d1fe803c3fdebcd3ee6f7a1155fc3462"
          EXPECTED_BUILD_ID="14691759"
          GKI_TAG="android14-6.1-2025-09_r22"
          CI_BASE="https://ci.android.com/builds/submitted/$EXPECTED_BUILD_ID/kernel_aarch64/latest"

          echo "=== 1. Verify exact device uname tuple ==="
          echo "$KERNEL_RELEASE"
          case "$KERNEL_RELEASE" in
            *"g${INSTALLED_PREFIX}-ab${EXPECTED_BUILD_ID}") ;;
            *) echo "ERROR: device release, commit prefix and build ID disagree"; exit 1 ;;
          esac

          echo
          echo "=== 2. Resolve the exact manifest artifact URL from Google's CI artifact page ==="
          echo "Build ID: $EXPECTED_BUILD_ID"
          echo "Expected tag: $GKI_TAG"
          curl --fail --location --silent --show-error \
            --retry 2 --retry-all-errors --connect-timeout 15 --max-time 90 \
            "$CI_BASE/manifest_$EXPECTED_BUILD_ID.xml" -o artifact_viewer.html
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          html = Path("artifact_viewer.html").read_text()
          match = re.search(r"var JSVariables = (\{.*?\});", html, re.S)
          if not match:
              raise SystemExit("ERROR: Google CI artifact page did not expose JSVariables")
          data = json.loads(match.group(1))
          expected = {
              "artifact": "manifest_14691759.xml",
              "buildId": "14691759",
              "target": "kernel_aarch64",
              "branch": "aosp_kernel-common-android14-6.1-2025-09",
          }
          for key, value in expected.items():
              actual = data.get(key)
              print(f"CI {key}: {actual}")
              if actual != value:
                  raise SystemExit(f"ERROR: CI artifact metadata mismatch for {key}: {actual!r}")
          url = data.get("artifactUrl")
          if not url or not url.startswith("https://storage.googleapis.com/"):
              raise SystemExit("ERROR: CI did not provide a valid Google Storage artifact URL")
          Path("manifest-artifact-url.txt").write_text(url)
          print("CI artifact metadata: PASS; signed URL intentionally not printed")
          PY

          MANIFEST_URL="$(cat manifest-artifact-url.txt)"
          curl --fail --location --silent --show-error \
            --retry 2 --retry-all-errors --connect-timeout 15 --max-time 120 \
            "$MANIFEST_URL" -o gki_manifest.xml
          test -s gki_manifest.xml
          sha256sum gki_manifest.xml
          echo "Downloaded pinned manifest size: $(wc -c < gki_manifest.xml) bytes"

          echo
          echo "=== 3. Parse and verify exact project pins from the GKI manifest ==="
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          expected = "fa1d6308d1fe803c3fdebcd3ee6f7a1155fc3462"
          root = ET.parse("gki_manifest.xml").getroot()
          default = root.find("default")
          projects = root.findall("project")
          if not projects:
              raise SystemExit("ERROR: downloaded GKI manifest contains no project entries")

          def revision(p):
              return p.get("revision") or (default.get("revision") if default is not None else None)

          matches = [p for p in projects if p.get("name") == "kernel/common" or p.get("path") == "common"]
          if len(matches) != 1:
              raise SystemExit(f"ERROR: expected exactly one kernel/common project, found {len(matches)}")

          common = matches[0]
          common_revision = revision(common)
          print("GKI manifest kernel/common name:", common.get("name"))
          print("GKI manifest kernel/common path:", common.get("path"))
          print("GKI manifest kernel/common revision:", common_revision)
          if common_revision != expected:
              raise SystemExit("ERROR: GKI manifest kernel/common pin does not equal the device uname full SHA")

          print("\nOther build-critical manifest pins:")
          for p in projects:
              name = p.get("name", "")
              path = p.get("path", "")
              if any(x in name.lower() or x in path.lower() for x in ("kernel/build", "kernel/config", "prebuilts/clang", "build-tools")):
                  print(f"{name} | path={path} | revision={revision(p)}")
          print("\nGKI manifest parse and kernel/common pin: PASS")
          PY

          echo
          echo "=== 4. Independently resolve the Pixel 8 device-source manifest ==="
          PIXEL_MANIFEST_COMMIT="e33231175e227ee733489d45e3aae3fb9cf159aa"
          PIXEL_MANIFEST_URL="https://android.googlesource.com/kernel/manifest/+/$PIXEL_MANIFEST_COMMIT/default.xml?format=TEXT"
          curl --fail --location --silent --show-error \
            --retry 2 --retry-all-errors --connect-timeout 15 --max-time 90 \
            "$PIXEL_MANIFEST_URL" -o pixel-default.xml.b64
          base64 -d pixel-default.xml.b64 > pixel-default.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("pixel-default.xml").getroot()
          default = root.find("default")
          projects = [p for p in root.findall("project") if p.get("name") == "kernel/common"]
          if default is None or len(projects) != 1:
              raise SystemExit("ERROR: cannot resolve kernel/common in Pixel manifest")
          p = projects[0]
          revision = p.get("revision") or default.get("revision")
          print("Pixel device manifest commit: e33231175e227ee733489d45e3aae3fb9cf159aa")
          print("Pixel kernel/common project path:", p.get("path"))
          print("Pixel kernel/common branch:", revision)
          print("This branch is a separate device-source layer; do not substitute it for the pinned GKI release manifest.")
          PY

          echo
          echo
          echo "=== 5. Inspect the exact Pixel Shusky BUILD graph and its pinned Kleaf rules ==="
          SHUSKY_BUILD_COMMIT="a88953f657282d6e52c6c0b3669ca3a890907518"
          PIXEL_KLEAF_COMMIT="6483b5a6b74251440b266536c2dbc902a4fa3cf2"
          curl --fail --location --silent --show-error \
            --retry 2 --retry-all-errors --connect-timeout 15 --max-time 90 \
            "https://android.googlesource.com/kernel/devices/google/shusky/+/$SHUSKY_BUILD_COMMIT/BUILD.bazel?format=TEXT" \
            -o shusky-build.bazel.b64
          base64 -d shusky-build.bazel.b64 > shusky-BUILD.bazel
          curl --fail --location --silent --show-error \
            --retry 2 --retry-all-errors --connect-timeout 15 --max-time 90 \
            "https://android.googlesource.com/kernel/build/+/$PIXEL_KLEAF_COMMIT/kleaf/common_kernels.bzl?format=TEXT" \
            -o pixel-kleaf-common-kernels.bzl.b64
          base64 -d pixel-kleaf-common-kernels.bzl.b64 > pixel-kleaf-common-kernels.bzl
          echo "Official Shusky BUILD references:"
          grep -nE 'base_kernel[[:space:]]*=|base_kernel_images[[:space:]]*=|kernel_aarch64(_images|_gki_boot_image|_headers)?' shusky-BUILD.bazel | head -80
          echo
          echo "Pinned Pixel Kleaf prebuilt target definitions:"
          grep -n -C 3 -E 'download_or_build|kernel_aarch64_images|additional_artifacts' pixel-kleaf-common-kernels.bzl | head -160
          echo
          echo "Exact Kleaf target-generation block:"
          sed -n '1030,1090p' pixel-kleaf-common-kernels.bzl
          echo
          echo "Exact Shusky base-kernel and dist references:"
          sed -n '70,95p;180,235p' shusky-BUILD.bazel
          PIXEL_COMMON_COMMIT="8769cc47188c3bdca2a34d39ba0f39a945b85465"
          curl --fail --location --silent --show-error \
            --retry 2 --retry-all-errors --connect-timeout 15 --max-time 90 \
            "https://android.googlesource.com/kernel/common/+/$PIXEL_COMMON_COMMIT/BUILD.bazel?format=TEXT" \
            -o pixel-common-build.bazel.b64
          base64 -d pixel-common-build.bazel.b64 > pixel-common-BUILD.bazel
          echo
          echo "Pixel common BUILD target declarations:"
          grep -n -C 2 -E 'kernel_aarch64_gki_boot_image|kernel_aarch64_images|kernel_aarch64_headers|define_common_kernels' pixel-common-BUILD.bazel | head -140
          echo
          echo "Kleaf GKI download config and generated target suffixes:"
          grep -n -A90 -B8 'GKI_DOWNLOAD_CONFIGS' pixel-kleaf-common-kernels.bzl | head -150
          echo
          echo "Kleaf GKI boot-image target declarations:"
          grep -n -C 4 -E 'gki_boot_image|boot_img_archive|gki_artifacts' pixel-kleaf-common-kernels.bzl | head -180

          echo
          echo "=== 6. Inspect the exact Kleaf prebuilt configuration and GKI artifact implementation ==="
          KLEAF_COMMIT="6483b5a6b74251440b266536c2dbc902a4fa3cf2"
          for SPEC in \
            "kleaf/constants.bzl:kleaf-constants" \
            "kleaf/impl/gki_artifacts.bzl:kleaf-gki-artifacts"; do
            FILE="${SPEC%%:*}"
            OUT="${SPEC##*:}"
            curl --fail --location --silent --show-error \
              --retry 2 --retry-all-errors --connect-timeout 15 --max-time 90 \
              "https://android.googlesource.com/kernel/build/+/$KLEAF_COMMIT/$FILE?format=TEXT" \
              -o "$OUT.b64"
            base64 -d "$OUT.b64" > "$OUT"
          done
          echo "--- GKI_DOWNLOAD_CONFIGS definition ---"
          grep -n -A100 -B8 'GKI_DOWNLOAD_CONFIGS' kleaf-constants | head -150
          echo
          echo "--- GKI artifact prebuilt/download rule implementation ---"
          grep -n -A12 -B8 -E 'gki_artifacts_prebuilts|use_prebuilt_gki|artifact|boot' kleaf-gki-artifacts | head -240
          echo
          echo "=== 7. Resolve exact kernel/devices/google/common project and inspect Native FIPS ==="
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("pixel-default.xml").getroot()
          default = root.find("default")
          matches = []
          for p in root.findall("project"):
              if p.get("name") == "kernel/devices/google/common":
                  rev = p.get("revision") or (default.get("revision") if default is not None else "")
                  matches.append((p.get("name"), p.get("path"), rev))
          if len(matches) != 1 or not matches[0][2]:
              raise SystemExit(f"Expected exactly one pinned kernel/devices/google/common project; got {matches}")
          name, path, rev = matches[0]
          print(f"DEVICE_COMMON_PROJECT={name} PATH={path} REVISION={rev}")
          with open("device_common_revision", "w") as out: out.write(rev)
          PY
          DEVICE_COMMON_REV="$(cat device_common_revision)"
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            "https://android.googlesource.com/kernel/devices/google/common/+/$DEVICE_COMMON_REV/BUILD.bazel?format=TEXT" \
            -o device-common-BUILD.bazel.b64
          base64 -d device-common-BUILD.bazel.b64 > device-common-BUILD.bazel
          echo "--- Native FIPS rule and dependency references ---"
          grep -n -A24 -B12 -E 'fips140|FIPS|kernel_gki_modules|download_prebuilt_gki_fips140|name = "kernel"|base_kernel' device-common-BUILD.bazel | head -320
          echo
          echo "--- All FIPS-related labels and file references ---"
          grep -n -i -E 'fips|kernel_aarch64|Module.symvers|abi|symvers' device-common-BUILD.bazel | head -240
          echo
          echo "=== 8. Check all Shusky dist GKI references against the generated artifact targets ==="
          grep -n -A8 -B8 -E 'kernel_aarch64_(gki_boot_image|gki_artifacts|headers|images|download_or_build)' shusky-BUILD.bazel pixel-common-BUILD.bazel kleaf-constants kleaf-gki-artifacts | head -220
          echo "Source dependency inspection complete; no build or image generation was invoked."

          echo "RESULT: GKI manifest kernel/common pin matches the exact full SHA in the device uname."
          echo "No compilation, image generation, flashing, or phone changes were performed."

  bazel-dependency-audit:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'audit-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Install Repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize and sync exact Pixel kernel source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace
          cd workspace
          repo init -u https://android.googlesource.com/kernel/manifest -b android-gs-shusky-6.1-android16 --depth=1
          repo sync -c -j"$(nproc)" --no-clone-bundle --no-tags

      - name: Pin Pixel common source and apply the exact proposed BUILD edits
        shell: bash
        run: |
          set -euo pipefail
          cd workspace
          git -C aosp cat-file -e 8769cc47188c3bdca2a34d39ba0f39a945b85465^{commit}
          git -C aosp checkout --detach 8769cc47188c3bdca2a34d39ba0f39a945b85465
          python3 <<'PY'
          from pathlib import Path

          shusky = Path("private/devices/google/shusky/BUILD.bazel")
          common = Path("private/devices/google/common/BUILD.bazel")
          s = shusky.read_text()
          c = common.read_text()
          replacements = {
              '"//common:kernel_aarch64"': '"//common:kernel_aarch64_download_or_build"',
              '"//common:kernel_aarch64_images"': '"//common:kernel_aarch64_images_download_or_build"',
              '"//common:kernel_aarch64_gki_boot_image"': '"//common:kernel_aarch64_gki_artifacts_download_or_build"',
              '"//common:kernel_aarch64_headers"': '"//common:kernel_aarch64_headers_download_or_build"',
          }
          for old, new in replacements.items():
              n = s.count(old)
              if not n:
                  raise SystemExit(f"Missing expected Shusky reference: {old}")
              s = s.replace(old, new)
              print(f"Patched Shusky {old} -> {new}: {n}")
          old = 'images = "//common:kernel_aarch64_images"'
          new = 'images = "//common:kernel_aarch64_images_download_or_build"'
          if c.count(old) != 1:
              raise SystemExit("Expected exactly one Google common extracted_system_dlkm images reference")
          c = c.replace(old, new, 1)

          abi = Path("aosp/android/abi_gki_aarch64_fips140")
          if not abi.is_file():
              raise SystemExit(f"Missing Native FIPS ABI list: {abi}")
          abi_name = "abi_gki_aarch64_fips140"
          candidates = [
              (Path("aosp/android/BUILD.bazel"), "//aosp/android:", abi_name),
              (Path("aosp/android/BUILD"), "//aosp/android:", abi_name),
              (Path("aosp/BUILD.bazel"), "//aosp:", "android/" + abi_name),
              (Path("aosp/BUILD"), "//aosp:", "android/" + abi_name),
          ]
          found = next((item for item in candidates if item[0].is_file()), None)
          if found is None:
              raise SystemExit("No AOSP Bazel package found at android/ or aosp/ root")
          abi_build, abi_prefix, abi_relative = found
          abi_label = abi_prefix + abi_name if abi_prefix == "//aosp/android:" else abi_prefix + abi_relative
          abi_text = abi_build.read_text()
          if abi_relative not in abi_text:
              abi_text += f'\\n# Export Google native FIPS ABI for Shusky.\\nexports_files(["{abi_relative}"])\\n'
              abi_build.write_text(abi_text)
          print(f"Native FIPS ABI BUILD package: {abi_build}")
          print(f"Native FIPS ABI label: {abi_label}")

          if "additional_kmi_symbol_lists" not in s:
              anchor = 'kmi_symbol_list = "//common:android/abi_gki_aarch64_pixel",'
              if s.count(anchor) != 1:
                  raise SystemExit("Cannot uniquely locate strict Pixel KMI declaration")
              s = s.replace(anchor, anchor + f'\n    additional_kmi_symbol_lists = ["{abi_label}"],', 1)
          elif abi_label not in s:
              raise SystemExit("Existing additional_kmi_symbol_lists does not contain Native FIPS ABI")
          if '"crypto/fips140.ko"' not in s:
              anchor = "module_outs = ZUMA_MODULE_OUTS,"
              if s.count(anchor) != 1:
                  raise SystemExit("Cannot uniquely locate Shusky module_outs declaration")
              s = s.replace(anchor, 'module_outs = ZUMA_MODULE_OUTS + ["crypto/fips140.ko"],', 1)

          shusky.write_text(s)
          common.write_text(c)
          Path("fips-abi-label.txt").write_text(abi_label)
          print("Exact proposed Shusky, Google-common and Native FIPS ABI edits applied.")
          PY
          python3 <<'PY'
          import os
          import subprocess
          from pathlib import Path

          expected = "6483b5a6b74251440b266536c2dbc902a4fa3cf2"
          kleaf_root = Path("build/kernel")
          actual = subprocess.check_output(
              ["git", "-C", str(kleaf_root), "rev-parse", "HEAD"],
              text=True,
          ).strip()
          print("=== Exact synchronized Kleaf source revision ===")
          print("Expected:", expected)
          print("Actual:  ", actual)
          if actual != expected:
              raise SystemExit("FAIL: synchronized Kleaf revision differs from audited pin")

          workspace_link = Path("WORKSPACE")
          resolved_workspace = workspace_link.resolve(strict=True)
          print("\n=== Actual WORKSPACE entry point ===")
          print("WORKSPACE is symlink:", workspace_link.is_symlink())
          if workspace_link.is_symlink():
              print("WORKSPACE link target:", os.readlink(workspace_link))
          print("Resolved WORKSPACE:", resolved_workspace)
          print(resolved_workspace.read_text())

          print("\n=== Exact pinned Kleaf implementation: relevant source lines ===")
          tokens = (
              "define_kleaf_workspace",
              "artifact_url_fmt",
              "_ARTIFACT_URL_FMT",
              "ARTIFACT_URL_FMT",
              "KLEAF_DOWNLOAD_BUILD_NUMBER_MAP",
              "repository_ctx.download",
              "download_artifacts_repo",
          )
          source_files = sorted((kleaf_root / "kleaf").rglob("*.bzl"))
          matches = 0
          for path in source_files:
              lines = path.read_text(errors="replace").splitlines()
              hit_lines = [
                  i for i, line in enumerate(lines)
                  if any(token in line for token in tokens)
              ]
              if not hit_lines:
                  continue
              print(f"\n--- {path} ---")
              emitted = set()
              for i in hit_lines:
                  for j in range(max(0, i - 2), min(len(lines), i + 3)):
                      if j not in emitted:
                          print(f"{j + 1}: {lines[j]}")
                          emitted.add(j)
                  matches += 1
          if not matches:
              raise SystemExit("FAIL: no Kleaf download implementation markers found")

          print("\n=== Controlled, temporary Kleaf URL test ===")
          download_repo = kleaf_root / "kleaf/download_repo.bzl"
          download_text = download_repo.read_text()
          old_url = "https://androidbuildinternal.googleapis.com/android/internal/build/v3/builds/{build_number}/{target}/attempts/latest/artifacts/{filename}/url?redirect=true"
          public_url = "https://ci.android.com/builds/submitted/{build_number}/{target}/latest/raw/{filename}"
          if download_text.count(old_url) != 1:
              raise SystemExit("FAIL: expected exactly one pinned internal artifact URL constant")
          download_repo.write_text(download_text.replace(old_url, public_url, 1))
          print("PASS: patched exactly one URL constant in the disposable runner checkout.")
          print("The repository's committed kernel sources and production workflow remain unchanged.")
          print("The next step is a read-only Bazel cquery; no build or image target is invoked.")
          PY
          python3 <<'PY'
          import os
          import subprocess
          from pathlib import Path

          root = Path(".")
          print("\n=== Diagnose the newly exposed bcm4398 dependency-analysis error ===")
          for relative in (
              "private/google-modules/wlan/bcm4398/BUILD.bazel",
              "private/google-modules/soc/gs/BUILD.bazel",
              "private/devices/google/shusky/BUILD.bazel",
              "private/devices/google/common/BUILD.bazel",
          ):
              path = root / relative
              print(f"\n--- {relative} ---")
              if path.is_file():
                  print(path.read_text())
              else:
                  print("NOT PRESENT")

          print("\n=== All exact gs_undefined and bcm4398 references in Google module BUILD/Starlark files ===")
          for base in (root / "private/google-modules", root / "private/devices/google"):
              for path in sorted(base.rglob("*")):
                  if not path.is_file() or not (
                      path.name.startswith("BUILD") or path.suffix == ".bzl"
                  ):
                      continue
                  try:
                      lines = path.read_text(errors="replace").splitlines()
                  except OSError:
                      continue
                  hits = [
                      (i, line) for i, line in enumerate(lines)
                      if any(token in line for token in (
                          "gs_undefined", "gs_soc_module", "gs_soc_headers",
                          "bcmdhd4398", "--//private/google-modules/soc/gs",
                      ))
                  ]
                  if hits:
                      print(f"\n--- {path} ---")
                      for i, line in hits:
                          print(f"{i + 1}: {line}")

          print("\n=== All gs/SoC Bazel configuration references across device and module trees ===")
          for base in (root / "private/google-modules", root / "private/devices/google"):
              for path in sorted(base.rglob("*")):
                  if not path.is_file() or path.name == ".git":
                      continue
                  if path.name.startswith("BUILD") or path.suffix in (".bzl", ".bazelrc", ".rc"):
                      try:
                          lines = path.read_text(errors="replace").splitlines()
                      except OSError:
                          continue
                      hits = [
                          (i, line) for i, line in enumerate(lines)
                          if "gs_soc_module" in line or "gs_undefined" in line
                      ]
                      if hits:
                          print(f"\\n--- {path} ---")
                          for i, line in hits:
                              print(f"{i + 1}: {line}")

          gs_dir = root / "private/google-modules/soc/gs"
          print("\\n=== Files under private/google-modules/soc/gs ===")
          if gs_dir.exists():
              for path in sorted(gs_dir.rglob("*")):
                  if path.is_file() and (path.name.startswith("BUILD") or path.suffix in (".bzl", ".mk", ".config")):
                      print(path)

          print("\n=== Git revisions for the exact failing source directories ===")
          for directory in (
              "private/google-modules/wlan",
              "private/google-modules/soc",
              "private/devices/google/shusky",
              "private/devices/google/common",
          ):
              p = subprocess.run(
                  ["git", "-C", directory, "rev-parse", "--show-toplevel"],
                  text=True, capture_output=True,
              )
              if p.returncode == 0:
                  top = p.stdout.strip()
                  sha = subprocess.check_output(
                      ["git", "-C", top, "rev-parse", "HEAD"], text=True
                  ).strip()
                  print(f"{directory}: {top} @ {sha}")
              else:
                  print(f"{directory}: no Git project root found")
          print("\n=== Verify the official Shusky Bazel config entry points ===")
          for relative in (
              ".bazelrc",
              ".d4.bazelrc",
              ".d5.bazelrc",
              ".d6.bazelrc",
              "private/devices/google/shusky/device.bazelrc",
              "private/devices/google/shusky/build_shusky.sh",
              "tools/bazel",
              "build/kernel/kleaf/bazel.sh",
              "build/kernel/kleaf/bazel.py",
              "build/kernel/kleaf/common.bazelrc",
          ):
              path = root / relative
              print(f"\n--- {relative} ---")
              if path.is_symlink():
                  print("SYMLINK ->", os.readlink(path))
              if path.is_file():
                  print(path.read_text(errors="replace"))
              else:
                  print("NOT PRESENT")
          PY

      - name: Probe public Android CI artifacts for the exact installed GKI build (read only)
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing the documented public CI endpoint with byte-range requests only."
          for artifact in \
            kernel-headers.tar.gz \
            system_dlkm_staging_archive.tar.gz \
            system_dlkm.modules.blocklist \
            system_dlkm.modules.load
          do
            url="https://ci.android.com/builds/submitted/14691759/kernel_aarch64/latest/raw/$artifact"
            status="$(curl --silent --show-error --location --range 0-0 \
              --max-time 45 --output /dev/null --write-out '%{http_code}' \
              "$url" || true)"
            printf '%-42s HTTP %s\n' "$artifact" "$status"
          done

      - name: Run read-only Bazel target and dependency queries (no build)
        shell: bash
        run: |
          set -euo pipefail
          cd workspace
          test -x tools/bazel
          ABI_LABEL="$(cat fips-abi-label.txt)"
          BAZEL=(tools/bazel --output_user_root="$RUNNER_TEMP/bazel-query-root")
          # Match the production build invocation exactly. Without this flag,
          # Kleaf falls back to its default GKI build-number map (13202960).
          GKI_FLAGS=(--use_prebuilt_gki=14691759 --action_env=KLEAF_DOWNLOAD_BUILD_NUMBER_MAP=gki_prebuilts=14691759)
          QUERY_FLAGS=(--//private/devices/google/common:kernel=//private/devices/google/shusky:kernel --//private/google-modules/soc/gs:gs_soc_module=//private/devices/google/shusky:zuma_soc.shusky --no//private/devices/google/common:download_prebuilt_gki_fips140)
          echo "=== Native FIPS ABI target ==="
          "${BAZEL[@]}" query "$ABI_LABEL" --output=label
          echo "=== Shusky distribution target with Native FIPS ABI edits ==="
          "${BAZEL[@]}" query //private/devices/google/shusky:zuma_shusky_dist --output=label "${QUERY_FLAGS[@]}"
          echo "=== Prebuilt-aware GKI targets ==="
          for target in \
            //common:kernel_aarch64_download_or_build \
            //common:kernel_aarch64_images_download_or_build \
            //common:kernel_aarch64_gki_artifacts_download_or_build \
            //common:kernel_aarch64_headers_download_or_build
          do
            "${BAZEL[@]}" query "$target" --output=label
          done
          echo "=== Confirm patched Shusky dependency graph contains all required prebuilt-aware aliases ==="
          # `query` is unconfigured and traverses inactive select() branches, including the unavailable FIPS prebuilt.
          # `cquery` resolves the actual configuration with the explicit Native FIPS flags, without building.
          "${BAZEL[@]}" cquery "${GKI_FLAGS[@]}" "${QUERY_FLAGS[@]}" --output=label 'deps(//private/devices/google/shusky:zuma_shusky_dist)' > "$RUNNER_TEMP/shusky-deps.txt"
          for target in \
            //common:kernel_aarch64_download_or_build \
            //common:kernel_aarch64_images_download_or_build \
            //common:kernel_aarch64_gki_artifacts_download_or_build \
            //common:kernel_aarch64_headers_download_or_build
          do
            if ! grep -Fxq "$target" "$RUNNER_TEMP/shusky-deps.txt"; then
              echo "ERROR: expected prebuilt-aware target is not in the Shusky dependency graph: $target"
              exit 1
            fi
            echo "PASS dependency: $target"
          done
          echo "=== Verify Native FIPS and strict Pixel KMI declarations ==="
          grep -n 'abi_gki_aarch64_pixel' private/devices/google/shusky/BUILD.bazel
          grep -n "$ABI_LABEL" private/devices/google/shusky/BUILD.bazel
          grep -n 'crypto/fips140.ko' private/devices/google/shusky/BUILD.bazel
          echo "READ-ONLY BAZEL QUERY AUDIT: PASS"
          echo "No bazel build/run/test, kernel compilation, image generation, flashing or phone changes were invoked."
