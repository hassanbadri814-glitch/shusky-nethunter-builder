name: Audit Pixel 8 installed kernel source pin

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-pin-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pin-audit:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'audit-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify the exact installed GKI release identity (audit only)
        shell: bash
        run: |
          set -euo pipefail

          # Read from the Pixel 8 itself on 2026-11-16:
          # 6.1.145-android14-11-gfa1d6308d1fe-ab14691759
          KERNEL_RELEASE="6.1.145-android14-11-gfa1d6308d1fe-ab14691759"
          INSTALLED_PREFIX="fa1d6308d1fe"
          EXPECTED_FULL_SHA="fa1d6308d1fe803c3fdebcd3ee6f7a1155fc3462"
          EXPECTED_BUILD_ID="14691759"
          GKI_TAG="android14-6.1-2025-09_r22"
          COMMON_URL="https://android.googlesource.com/kernel/common"

          echo "=== Device-reported kernel identity ==="
          echo "$KERNEL_RELEASE"
          case "$KERNEL_RELEASE" in
            *"g${INSTALLED_PREFIX}-ab${EXPECTED_BUILD_ID}") ;;
            *) echo "ERROR: release string, commit prefix and build ID disagree"; exit 1 ;;
          esac

          echo "=== Fetch exact official GKI release tag; no broad history scan ==="
          git init common
          git -C common remote add origin "$COMMON_URL"
          git -C common -c protocol.version=2 -c http.version=HTTP/1.1 \
            fetch --no-tags origin "refs/tags/$GKI_TAG"
          TAG_OBJECT="$(git -C common rev-parse FETCH_HEAD)"
          TAG_TYPE="$(git -C common cat-file -t "$TAG_OBJECT")"
          FULL_SHA="$(git -C common rev-parse "FETCH_HEAD^{commit}")"

          echo "Tag: $GKI_TAG"
          echo "Tag object: $TAG_OBJECT"
          echo "Tag object type: $TAG_TYPE"
          echo "Resolved commit: $FULL_SHA"
          test "$TAG_TYPE" = "tag"
          test "$FULL_SHA" = "$EXPECTED_FULL_SHA"
          case "$FULL_SHA" in
            "$INSTALLED_PREFIX"*) ;;
            *) echo "ERROR: official tag SHA does not match device uname prefix"; exit 1 ;;
          esac

          git -C common show -s --format='Commit: %H%nDate: %cI%nSubject: %s%nAuthor: %an' "$FULL_SHA"
          echo
          echo "=== Verify annotated release metadata ==="
          git -C common cat-file -p "$TAG_OBJECT"
          echo
          echo "Expected GKI build ID: $EXPECTED_BUILD_ID"
          echo "The uname suffix ab$EXPECTED_BUILD_ID must match the release artifact build ID."

          echo
          echo "=== Pixel manifest branch is a separate source layer ==="
          MANIFEST_COMMIT="e33231175e227ee733489d45e3aae3fb9cf159aa"
          MANIFEST_URL="https://android.googlesource.com/kernel/manifest/+/$MANIFEST_COMMIT/default.xml?format=TEXT"
          curl --retry 3 --retry-all-errors -fsSL "$MANIFEST_URL" | base64 -d > default.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("default.xml").getroot()
          default = root.find("default")
          projects = [p for p in root.findall("project") if p.get("name") == "kernel/common"]
          if default is None or len(projects) != 1:
              raise SystemExit("ERROR: could not resolve the Pixel manifest kernel/common project")
          project = projects[0]
          revision = project.get("revision", default.get("revision"))
          if not revision:
              raise SystemExit("ERROR: no kernel/common revision in Pixel manifest")
          print("Pixel manifest commit:", "e33231175e227ee733489d45e3aae3fb9cf159aa")
          print("Pixel manifest kernel/common revision:", revision)
          print("Note: this is the Pixel device-source manifest branch; it is not the GKI release tag above.")
          PY

          echo
          echo "RESULT: PASS — device uname prefix and build ID match the exact official GKI tag."
          echo "No kernel compilation, image generation, flashing or phone changes were performed."
