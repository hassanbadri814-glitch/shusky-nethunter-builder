name: Audit Pixel 8 installed kernel source pin

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-pin-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pin-audit:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'audit-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify official Shusky manifest and installed common commit
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_COMMIT="e33231175e227ee733489d45e3aae3fb9cf159aa"
          INSTALLED_PREFIX="164ae0b804dd"
          MANIFEST_URL="https://android.googlesource.com/kernel/manifest/+/$MANIFEST_COMMIT/default.xml?format=TEXT"

          echo "=== Fetch exact manifest revision ==="
          curl --retry 3 --retry-all-errors -fsSL "$MANIFEST_URL" | base64 -d > default.xml
          echo "Manifest commit: $MANIFEST_COMMIT"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("default.xml").getroot()
          default = root.find("default")
          if default is None:
              raise SystemExit("ERROR: manifest has no default revision")
          default_revision = default.get("revision")
          projects = [p for p in root.findall("project") if p.get("name") == "kernel/common"]
          if len(projects) != 1:
              print("Manifest projects:")
              for p in root.findall("project"):
                  print(ET.tostring(p, encoding="unicode"))
              raise SystemExit(f"ERROR: expected one kernel/common project, found {len(projects)}")
          project = projects[0]
          revision = project.get("revision", default_revision)
          if not revision:
              raise SystemExit("ERROR: kernel/common has no resolvable revision")
          print("Kernel/common project:", ET.tostring(project, encoding="unicode"))
          print("Manifest default revision:", default_revision)
          print("Manifest kernel/common revision:", revision)
          with open("common-revision.txt", "w") as f:
              f.write(revision)
          PY
          COMMON_REVISION="$(cat common-revision.txt)"

          echo "=== Fetch only the authoritative kernel/common branch history ==="
          git init common
          git -C common remote add origin https://android.googlesource.com/kernel/common
          FOUND=0
          for SINCE in 2026-04-01 2026-01-01 2025-01-01; do
            echo "Attempting $COMMON_REVISION history since $SINCE"
            if git -C common -c protocol.version=2 -c http.version=HTTP/1.1 fetch --no-tags --shallow-since="$SINCE" origin "refs/heads/$COMMON_REVISION"; then
              if git -C common cat-file -e "$INSTALLED_PREFIX^{commit}" 2>/dev/null; then
                FOUND=1
                break
              fi
            else
              echo "Fetch window failed; continue with wider history."
            fi
          done

          if [ "$FOUND" -ne 1 ]; then
            echo "NOT FOUND on authoritative Pixel manifest branch: $COMMON_REVISION"
            echo "Fetched tip:"
            git -C common log -1 --format='%H %cI %s' FETCH_HEAD || true
            echo "=== Secondary hypothesis test: GKI android14-6.1 branch (NOT the Pixel manifest checkout) ==="
            if git -C common -c protocol.version=2 -c http.version=HTTP/1.1 fetch --filter=blob:none --no-tags --shallow-since=2025-01-01 origin refs/heads/android14-6.1; then
              if git -C common cat-file -e "$INSTALLED_PREFIX^{commit}" 2>/dev/null; then
                GKI_SHA="$(git -C common rev-parse "$INSTALLED_PREFIX^{commit}")"
                echo "FOUND on related GKI branch android14-6.1: $GKI_SHA"
                git -C common show -s --format='Commit: %H%nDate: %cI%nSubject: %s%nAuthor: %an' "$GKI_SHA"
                echo "RESULT: GKI BRANCH MATCH ONLY; NOT PROOF OF PIXEL MANIFEST SOURCE"
              else
                echo "NOT FOUND on related GKI branch android14-6.1 either."
                echo "Fetched GKI tip:"
                git -C common log -1 --format='%H %cI %s' FETCH_HEAD || true
                exit 1
              fi
            else
              echo "ERROR: could not fetch related GKI branch for secondary test."
              exit 1
            fi
            exit 0
          fi

          FULL_SHA="$(git -C common rev-parse "$INSTALLED_PREFIX^{commit}")"
          case "$FULL_SHA" in
            "$INSTALLED_PREFIX"*) ;;
            *) echo "ERROR: resolved SHA does not match installed prefix"; exit 1 ;;
          esac

          echo "=== VERIFIED SOURCE IDENTITY ==="
          echo "Installed kernel/common prefix: $INSTALLED_PREFIX"
          echo "Resolved full SHA: $FULL_SHA"
          git -C common show -s --format='Commit: %H%nDate: %cI%nSubject: %s%nAuthor: %an' "$FULL_SHA"
          echo "RESULT: PASS"
