name: Independent Shiba Native FIPS Artifact Audit
# audit-target-44225209656: final verified audit after removing legacy static audit route
# audit-target-44225209656: trigger one-time audit of the already completed build
on:
  workflow_run:
    workflows:
      - Build Pixel 8 Shiba - NetHunter Native FIPS Test
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed Native FIPS build run ID to audit
        required: true
        type: string
  push:
    branches: [main]
    paths: [.github/workflows/audit-native-fips.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: shiba-native-fips-independent-audit
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'audit-target-')) ||
      (github.event_name == 'workflow_dispatch' && inputs.run_id != '')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Select and verify source build
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            RUN_ID="$EVENT_RUN_ID"
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            RUN_ID="$INPUT_RUN_ID"
          else
            RUN_ID="$(python3 - "$COMMIT_MESSAGE" <<'PY'
          import re,sys
          m=re.search(r'\baudit-target-(\d+)\b',sys.argv[1])
          if not m: raise SystemExit('Explicit audit-target-RUN_ID marker missing')
          print(m.group(1))
          PY
          )"
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API" -o run.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API/jobs?per_page=100" -o jobs.json
          python3 - "$RUN_ID" <<'PY'
          import json,sys
          r=json.load(open('run.json'))
          if str(r.get('id'))!=sys.argv[1] or r.get('name')!='Build Pixel 8 Shiba - NetHunter Native FIPS Test':
              raise SystemExit('Wrong source workflow/run')
          if r.get('status')!='completed' or r.get('conclusion')!='success' or r.get('head_branch')!='main':
              raise SystemExit('Source workflow is not a successful main-branch run')
          jobs=json.load(open('jobs.json')).get('jobs',[])
          b=[j for j in jobs if j.get('name')=='Build and verify Shiba Native FIPS kernel']
          if len(b)!=1 or b[0].get('conclusion')!='success':
              raise SystemExit('Actual Native FIPS build job did not succeed')
          with open('source.env','w') as f: f.write(f"SOURCE_RUN_ID={r['id']}\nSOURCE_SHA={r['head_sha']}\n")
          print('Verified source run',r['id'],'commit',r['head_sha'])
          PY
          cat source.env >> "$GITHUB_OUTPUT"

      - name: Download exact artifact and verify GitHub SHA-256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.SOURCE_RUN_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" -o artifacts.json
          python3 - <<'PY'
          import json
          a=[x for x in json.load(open('artifacts.json')).get('artifacts',[]) if x.get('name')=='shiba-nethunter-native-fips-build-test']
          if len(a)!=1 or a[0].get('expired') or not a[0].get('digest','').startswith('sha256:'):
              raise SystemExit('Expected one unexpired build artifact with SHA-256 digest')
          with open('artifact.env','w') as f:
              f.write(f"ARTIFACT_ID={a[0]['id']}\nARTIFACT_SHA={a[0]['digest'].split(':',1)[1]}\n")
          print('Artifact size:',a[0]['size_in_bytes'],'digest:',a[0]['digest'])
          PY
          source artifact.env
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o artifact.zip
          ACTUAL="$(sha256sum artifact.zip | awk '{print $1}')"
          test "$ACTUAL" = "$ARTIFACT_SHA"
          mkdir artifact
          unzip -q artifact.zip -d artifact
          echo "GitHub artifact SHA-256 verified: $ACTUAL"

      - name: Install independent inspection tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cpio lz4 e2fsprogs file curl zstd binutils kmod

      - name: Audit final images, DLKM filesystems, and Native FIPS ramdisk
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.SOURCE_RUN_ID }}
          SOURCE_SHA: ${{ steps.source.outputs.SOURCE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-report unpacked ramdisk-extracted vendor-dlkm-root system-dlkm-root
          DIST="artifact/build-report/package/out/shusky/dist"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('artifact/build-report'); d=root/'package/out/shusky/dist'
          required=['Image','Image.lz4','boot.img','dtbo.img','system_dlkm.img','vendor_dlkm.img','vendor_kernel_boot.img','fips140.ko','modules.load']
          for n in required:
              p=d/n
              if not p.is_file() or p.stat().st_size==0: raise SystemExit('Missing/empty final output: '+n)
          source_info=(root/'kernel-common-commit.txt').read_text()
          if 'fa1d6308d1fe803c3fdebcd3ee6f7a1155fc3462' not in source_info or '6.1.145-android14-11-gfa1d6308d1fe' not in source_info:
              raise SystemExit('Artifact was not built from the exact Pixel 8 GKI 6.1.145 source')
          build_log=(root/'build.log').read_text(errors='replace')
          if 'KMI or sublevel mismatch before running make modules_install' in build_log:
              raise SystemExit('Kleaf reported a kernel/KMI sublevel mismatch')
          cfg=(root/'fips-config.txt').read_text()
          for x in ['CONFIG_CRYPTO_FIPS140_MOD=m','CONFIG_MODULES=y','CONFIG_MODVERSIONS=y','CONFIG_CFG80211=m','CONFIG_MAC80211=m','CONFIG_USB=y']:
              if x not in cfg: raise SystemExit('Required config missing: '+x)
          if re.search(r'^CONFIG_KSU=(y|m)$',cfg,re.M): raise SystemExit('KernelSU enabled unexpectedly')
          h=(root/'fips-hmac-execution-verification.txt').read_text()
          for x in ['Kbuild target binding: PASS','Independent embedded HMAC-SHA256 recomputation: PASS','Verified module candidates: 3']:
              if x not in h: raise SystemExit('FIPS HMAC evidence missing: '+x)
          dig=re.findall(r'^Module SHA-256: ([0-9a-f]{64})$',h,re.M)
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          if len(dig)!=1 or sha(d/'fips140.ko')!=dig[0]: raise SystemExit('Final FIPS module digest mismatch')
          ml=(d/'modules.load').read_text().splitlines()
          if not ml or len(ml)!=len(set(ml)) or ml.count('kernel/crypto/fips140.ko')!=1:
              raise SystemExit('Final dist modules.load invalid or FIPS entry absent/duplicated')
          if any(re.search(r'(rtl8187|mt76|ksu)\S*\.ko$',x,re.I) for x in ml):
              raise SystemExit('Excluded module found in final modules.load')
          for n in required: print(n,(d/n).stat().st_size,'bytes',sha(d/n))
          print('Final dist, kernel config, FIPS HMAC evidence: PASS')
          PY
          test "$(dd if="$DIST/vendor_kernel_boot.img" bs=8 count=1 2>/dev/null)" = "VNDRBOOT"
          test "$(dd if="$DIST/boot.img" bs=8 count=1 2>/dev/null)" = "ANDROID!"
          python3 - "$DIST/dtbo.img" <<'PY'
          import sys
          with open(sys.argv[1],'rb') as f: m=int.from_bytes(f.read(4),'big')
          if m!=0xd7b7ab1e: raise SystemExit(f'Bad DTBO magic: {m:#x}')
          PY
          lz4 -t "$DIST/Image.lz4"
          test "$(sha256sum "$DIST/Image" | awk '{print $1}')" = "$(lz4 -dc "$DIST/Image.lz4" | sha256sum | awk '{print $1}')"
          readelf -h "$DIST/fips140.ko" > audit-report/fips-elf-header.txt
          readelf -S "$DIST/fips140.ko" > audit-report/fips-elf-sections.txt
          grep -q AArch64 audit-report/fips-elf-header.txt
          grep -q '\.init\.rela\.text' audit-report/fips-elf-sections.txt
          grep -q '\.init\.rela\.rodata' audit-report/fips-elf-sections.txt
          file "$DIST"/*.img | tee audit-report/image-file-types.txt
          e2fsck -fn "$DIST/vendor_dlkm.img" > audit-report/vendor-dlkm-fsck.txt 2>&1
          e2fsck -fn "$DIST/system_dlkm.img" > audit-report/system-dlkm-fsck.txt 2>&1
          sudo debugfs -R "rdump / $GITHUB_WORKSPACE/vendor-dlkm-root" "$DIST/vendor_dlkm.img" > audit-report/vendor-dlkm-extract.txt 2>&1
          sudo debugfs -R "rdump / $GITHUB_WORKSPACE/system-dlkm-root" "$DIST/system_dlkm.img" > audit-report/system-dlkm-extract.txt 2>&1
          sudo chown -R "$(id -u):$(id -g)" vendor-dlkm-root system-dlkm-root
          if grep -Eqi 'Operation not permitted|Permission denied|rdump:.*error|dump_file:.*error' audit-report/vendor-dlkm-extract.txt audit-report/system-dlkm-extract.txt; then
            echo "DLKM extraction reported errors; refusing to certify partial filesystem contents."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          mods=[p for r in [Path('vendor-dlkm-root'),Path('system-dlkm-root')] for p in r.rglob('*.ko')]
          names={p.name for p in mods}
          for x in ['cfg80211.ko','mac80211.ko']:
              if x not in names: raise SystemExit('Required DLKM module missing: '+x)
          bad=[p for p in mods if re.search(r'(rtl8187|mt76|ksu)\S*\.ko$',p.name,re.I)]
          if bad: raise SystemExit('Excluded DLKM module found: '+str(bad[:10]))
          print('DLKM modules:',len(mods),'required wireless present; RTL8187/MT76/KernelSU absent: PASS')
          PY
          curl -fsSL 'https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main/unpack_bootimg.py?format=TEXT' | base64 -d > unpack_bootimg.py
          python3 unpack_bootimg.py --boot_img "$DIST/vendor_kernel_boot.img" --out unpacked 2>&1 | tee audit-report/unpack-vendor-boot.txt
          find unpacked -maxdepth 1 -type f -name 'vendor_ramdisk*' -print | sort > audit-report/vendor-ramdisk-parts.txt
          grep -q . audit-report/vendor-ramdisk-parts.txt
          i=0
          while IFS= read -r part; do
            i=$((i+1)); dest="ramdisk-extracted/part-$i"; mkdir -p "$dest"
            if lz4 -t "$part" >/dev/null 2>&1; then lz4 -dc "$part" | (cd "$dest" && cpio -idm --quiet)
            elif gzip -t "$part" >/dev/null 2>&1; then gzip -dc "$part" | (cd "$dest" && cpio -idm --quiet)
            elif zstd -t "$part" >/dev/null 2>&1; then zstd -dc "$part" | (cd "$dest" && cpio -idm --quiet)
            else (cd "$dest" && cpio -idm --quiet < "$GITHUB_WORKSPACE/$part"); fi
          done < audit-report/vendor-ramdisk-parts.txt
          find ramdisk-extracted -type f \( -name modules.load -o -name fips140.ko -o -name ufs-pixel-fips140.ko \) -printf '%p %s bytes\n' | sort > audit-report/ramdisk-critical-files.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          roots=list(Path('ramdisk-extracted').glob('part-*'))
          loads=[p for r in roots for p in r.rglob('modules.load')]
          ko=[p for r in roots for p in r.rglob('*.ko')]
          if not loads or not any(p.name=='fips140.ko' for p in ko) or not any(p.name=='ufs-pixel-fips140.ko' for p in ko):
              raise SystemExit('FIPS or UFS FIPS module/modules.load missing from actual vendor ramdisk')
          h=hashlib.sha256(Path('artifact/build-report/package/out/shusky/dist/fips140.ko').read_bytes()).hexdigest()
          if not any(hashlib.sha256(p.read_bytes()).hexdigest()==h for p in ko if p.name=='fips140.ko'):
              raise SystemExit('Ramdisk fips140.ko differs from final dist module')
          order=False; missing=[]; entries=[]
          for load in loads:
              es=[x.strip() for x in load.read_text(errors='replace').splitlines() if x.strip() and not x.lstrip().startswith('#')]
              entries.extend(es)
              f=[i for i,x in enumerate(es) if x.endswith('/fips140.ko')]
              u=[i for i,x in enumerate(es) if x.endswith('/ufs-pixel-fips140.ko')]
              if f and u and f[0]<u[0]: order=True
              for e in es:
                  found=[p for p in ko if p.as_posix().endswith('/'+e) or p.as_posix().endswith(e)]
                  if len(found)!=1: missing.append((str(load),e,len(found)))
          if not order: raise SystemExit('FIPS module does not precede UFS FIPS module in the same modules.load')
          if missing: raise SystemExit(f'Module-load paths not uniquely resolved: {missing[:5]}')
          bad=[p for p in ko if re.search(r'(rtl8187|mt76|ksu)\S*\.ko$',p.name,re.I)]
          if bad: raise SystemExit('Excluded module found in vendor ramdisk: '+str(bad[:10]))
          print('Vendor ramdisk fragments:',len(roots),'modules.load:',len(loads),'entries:',len(entries),'module files:',len(ko))
          print('FIPS load order, module presence/hash, all module paths, exclusions: PASS')
          PY
      - name: Independently verify module releases and FIPS KMI CRCs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="6.1.145-android14-11-gfa1d6308d1fe"
          mapfile -t MODULES < <(
            find ramdisk-extracted vendor-dlkm-root system-dlkm-root \
              -type f -name '*.ko' -print | sort -u
          )
          if [ "${#MODULES[@]}" -lt 200 ]; then
            echo "Expected the complete generated module set; found ${#MODULES[@]}."
            exit 1
          fi
          BAD=0
          for module in "${MODULES[@]}"; do
            release="$(modinfo -F vermagic "$module" | awk '{print $1}')"
            release="${release%-ab*}"
            if [ "$release" != "$EXPECTED" ]; then
              echo "RELEASE_MISMATCH $module :: $release"
              BAD=1
            fi
          done
          if [ "$BAD" -ne 0 ]; then
            echo "Generated module set does not match the exact Pixel 8 GKI release."
            exit 1
          fi

          FIPS_MODULE="artifact/build-report/package/out/shusky/dist/fips140.ko"
          GKI_MODULE="$(find ramdisk-extracted -type f -name zsmalloc.ko -print -quit)"
          test -s "$FIPS_MODULE"
          test -n "$GKI_MODULE"
          FIPS_LAYOUT_CRC="$(modprobe --show-modversions "$FIPS_MODULE" | awk '$2 == "module_layout" {print $1}')"
          GKI_LAYOUT_CRC="$(modprobe --show-modversions "$GKI_MODULE" | awk '$2 == "module_layout" {print $1}')"
          test -n "$FIPS_LAYOUT_CRC"
          test "$FIPS_LAYOUT_CRC" = "$GKI_LAYOUT_CRC"

          curl -fsSL --retry 3 --retry-delay 2 \
            "https://ci.android.com/builds/submitted/14691759/kernel_aarch64/latest/raw/vmlinux.symvers" \
            -o audit-report/gki-vmlinux.symvers
          test -s audit-report/gki-vmlinux.symvers

          python3 - "$FIPS_MODULE" audit-report/gki-vmlinux.symvers audit-report/fips-gki-crc-independent.txt <<'PY'
          import re
          import subprocess
          import sys

          module, symvers_path, report_path = sys.argv[1:]
          def norm(value):
              value = value.lower()
              return value[2:] if value.startswith("0x") else value

          kernel_symbols = {}
          with open(symvers_path, encoding="utf-8", errors="replace") as handle:
              for line in handle:
                  fields = line.split()
                  if len(fields) >= 2 and re.fullmatch(r"(?:0x)?[0-9a-fA-F]{8}", fields[0]):
                      kernel_symbols[fields[1]] = norm(fields[0])

          output = subprocess.check_output(["modprobe", "--show-modversions", module], text=True)
          imports = []
          for line in output.splitlines():
              fields = line.split()
              if len(fields) >= 2 and fields[0].startswith("0x"):
                  imports.append((fields[1], norm(fields[0])))

          missing = []
          mismatches = []
          for symbol, expected_crc in imports:
              actual_crc = kernel_symbols.get(symbol)
              if actual_crc is None:
                  missing.append(symbol)
              elif actual_crc != expected_crc:
                  mismatches.append((symbol, expected_crc, actual_crc))

          with open(report_path, "w", encoding="utf-8") as report:
              report.write(f"FIPS module: {module}\n")
              report.write(f"GKI vmlinux.symvers symbols: {len(kernel_symbols)}\n")
              report.write(f"FIPS imported symbols checked: {len(imports)}\n")
              report.write(f"Missing GKI symbols: {len(missing)}\n")
              report.write(f"CRC mismatches: {len(mismatches)}\n")
              for symbol in missing:
                  report.write(f"MISSING {symbol}\n")
              for symbol, expected, actual in mismatches:
                  report.write(f"CRC_MISMATCH {symbol} module={expected} GKI={actual}\n")

          if not imports or missing or mismatches:
              sys.exit(1)
          PY

          {
            echo "Expected kernel release: $EXPECTED"
            echo "Generated modules independently inspected: ${#MODULES[@]}"
            echo "All module vermagic release prefixes match."
            echo "FIPS module_layout CRC matches the GKI zsmalloc module."
            echo "FIPS imported-symbol CRCs match GKI build 14691759 vmlinux.symvers."
          } | tee audit-report/module-kmi-independent.txt

      - name: Independently recompute HMAC from the packaged final FIPS module
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - "artifact/build-report/package/out/shusky/dist/fips140.ko" "artifact/build-report/fips-hmac-execution-verification.txt" <<'PY'
          import hashlib, hmac, re, struct, sys
          from pathlib import Path
          path=Path(sys.argv[1]); blob=path.read_bytes()
          if len(blob)<64 or blob[:6]!=b'\x7fELF\x02\x01':
              raise SystemExit('Final fips140.ko is not ELF64 little-endian')
          hdr=struct.unpack_from('<16sHHIQQQIHHHHHH',blob,0)
          if hdr[1]!=1 or hdr[2]!=183:
              raise SystemExit('Final FIPS module is not relocatable AArch64 ELF')
          shoff,shentsize,shnum,shstrndx=hdr[6],hdr[11],hdr[12],hdr[13]
          if shentsize<64 or not shnum or shstrndx>=shnum:
              raise SystemExit('Invalid ELF section-header table')
          secs=[]
          for i in range(shnum):
              v=struct.unpack_from('<IIQQQQIIQQ',blob,shoff+i*shentsize)
              secs.append({'nameoff':v[0],'type':v[1],'off':v[4],'size':v[5],'link':v[6],'entsize':v[9]})
          st=secs[shstrndx]; names=blob[st['off']:st['off']+st['size']]
          def cstr(tab,off):
              end=tab.find(b'\0',off)
              if off<0 or end<0: raise ValueError('Invalid ELF string')
              return tab[off:end].decode('utf-8','replace')
          for sec in secs: sec['name']=cstr(names,sec['nameoff'])
          byname={sec['name']:sec for sec in secs}
          for name in ['.init.rela.text','.init.rela.rodata']:
              if name not in byname or not byname[name]['size'] or byname[name]['size']%24:
                  raise SystemExit('Missing/invalid FIPS relocation section '+name)
          symbols={}
          for sec in secs:
              if sec['type']!=2: continue
              if sec['link']>=len(secs): raise SystemExit('Invalid ELF symbol string-table link')
              ss=secs[sec['link']]; strings=blob[ss['off']:ss['off']+ss['size']]
              ent=sec['entsize'] or 24
              if ent<24: raise SystemExit('Invalid ELF symbol entry size')
              for i in range(sec['size']//ent):
                  no,info,other,ndx,val,size=struct.unpack_from('<IBBHQQ',blob,sec['off']+i*ent)
                  if no and ndx<len(secs):
                      symbols.setdefault(cstr(strings,no),set()).add((ndx,val,size))
          def sym(name):
              found=symbols.get(name,set())
              if len(found)!=1: raise SystemExit('Expected one defined symbol: '+name)
              return next(iter(found))
          def span(first,last):
              a,av,_=sym(first); b,bv,_=sym(last)
              if a!=b or not 0<=av<bv<=secs[a]['size']:
                  raise SystemExit('Invalid authenticated symbol range: '+first+'..'+last)
              sec=secs[a]
              return blob[sec['off']+av:sec['off']+bv]
          kn,kv,ks=sym('fips140_integ_hmac_key'); keysec=secs[kn]
          begin=keysec['off']+kv
          finish=begin+ks if ks else keysec['off']+keysec['size']
          keydata=blob[begin:finish]
          if b'\0' not in keydata or not keydata.split(b'\0',1)[0]:
              raise SystemExit('Invalid embedded FIPS HMAC key')
          key=keydata.split(b'\0',1)[0]
          dn,dv,ds=sym('fips140_integ_hmac_digest')
          if ds<32: raise SystemExit('Embedded HMAC digest field is too small')
          stored=blob[secs[dn]['off']+dv:secs[dn]['off']+dv+32]
          textdata=span('__fips140_text_start','__fips140_text_end')
          rodata=span('__fips140_rodata_start','__fips140_rodata_end')
          digest=hmac.new(key,textdata+rodata,hashlib.sha256).digest()
          if not hmac.compare_digest(stored,digest):
              raise SystemExit('Independent HMAC-SHA256 recomputation failed')
          actual={
              'Module SHA-256':hashlib.sha256(blob).hexdigest(),
              'Embedded HMAC-SHA256':digest.hex(),
              'HMAC key SHA-256':hashlib.sha256(key).hexdigest(),
              'Authenticated .text SHA-256':hashlib.sha256(textdata).hexdigest(),
              'Authenticated .rodata SHA-256':hashlib.sha256(rodata).hexdigest(),
              'HMAC key length':str(len(key))+' bytes',
              'Covered .text bytes':str(len(textdata)),
              'Covered .rodata bytes':str(len(rodata)),
          }
          report=Path(sys.argv[2]).read_text().splitlines()
          for label,value in actual.items():
              if label+': '+value not in report:
                  raise SystemExit('Independent result disagrees with build report: '+label)
          output=['Independent final artifact HMAC-SHA256 recomputation: PASS']
          output += [label+': '+value for label,value in actual.items()]
          Path('audit-report/fips-hmac-independent.txt').write_text('\n'.join(output)+'\n')
          print('\n'.join(output))
          PY

      - name: Finalize independent audit result
        if: success()
        shell: bash
        run: |
          {
            echo "Source run: ${{ steps.source.outputs.SOURCE_RUN_ID }}"
            echo "Source commit: ${{ steps.source.outputs.SOURCE_SHA }}"
            echo "Independent artifact audit: PASS"
            echo "Exact GKI kernel source, module release, and FIPS symbol CRC checks: PASS"
            echo "Final images, DLKM filesystems, Native FIPS HMAC, and vendor ramdisk: PASS"
          } | tee audit-report/AUDIT-PASS.txt

      - name: Upload independent audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiba-native-fips-independent-audit-${{ steps.source.outputs.SOURCE_RUN_ID }}
          path: audit-report/
          if-no-files-found: warn
          retention-days: 30
