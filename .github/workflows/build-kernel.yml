
      - name: Diagnose Shusky FIPS configurations
        if: always()
        shell: bash
        run: |
          set +e
          cd "$WORKSPACE"

          mkdir -p "$REPORT_DIR"

          REPORT="$REPORT_DIR/fips-config-diagnostic.txt"
          : > "$REPORT"

          echo "=== ALL CONFIG FILES ===" | tee -a "$REPORT"

          find out -type f -name .config \
            -print 2>/dev/null | tee -a "$REPORT"

          echo | tee -a "$REPORT"
          echo "=== SHUSKY CONFIG CONTENTS ===" | tee -a "$REPORT"

          find out -type f -name .config \
            -path '*private/devices/google/shusky*' \
            -print0 2>/dev/null |
          while IFS= read -r -d '' CONFIG; do
            echo | tee -a "$REPORT"
            echo "FILE: $CONFIG" | tee -a "$REPORT"

            grep -E \
              '^(CONFIG_CRYPTO_FIPS140_MOD=|# CONFIG_CRYPTO_FIPS140_MOD is not set|CONFIG_CRYPTO_FIPS140_MERGE_MOD_SECTIONS=)' \
              "$CONFIG" | tee -a "$REPORT"

            echo "--------------------------------" | tee -a "$REPORT"
          done

          echo | tee -a "$REPORT"
          echo "=== DISTRIBUTION CONFIG ===" | tee -a "$REPORT"

          if [ -f out/shusky/dist/.config ]; then
            grep -E \
              '^(CONFIG_CRYPTO_FIPS140_MOD=|# CONFIG_CRYPTO_FIPS140_MOD is not set|CONFIG_CRYPTO_FIPS140_MERGE_MOD_SECTIONS=)' \
              out/shusky/dist/.config | tee -a "$REPORT"
          else
            echo "Distribution .config does not exist." | tee -a "$REPORT"
          fi

          echo
          echo "Diagnostic step completed; no build failure forced."
