name: Build Pixel 8 Shiba - NetHunter FIPS Build Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shiba-nethunter-kernel-build
  cancel-in-progress: false

jobs:
  build-kernel:
    name: Build and verify Shiba FIPS test kernel
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEVICE: shiba
      KERNEL_DEVICE: shusky
      CUSTOM_KERNEL_VERSION: "1.33"

    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python3-pip python-is-python3 \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves zip unzip rsync ccache file \
            kmod xz-utils zstd binutils

      - name: Install Android repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize Google kernel repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace
          cd workspace
          repo init \
            --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-shusky-6.1-android16

      - name: Sync Google kernel source
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          cd workspace
          repo sync \
            --current-branch \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2 \
            --fail-fast

      # ================================================
      # DIAGNOSTISCHE STAP (VERBETERD DOOR EXPERT)
      # ================================================
      - name: Diagnose Google manifest project paths
        shell: bash
        run: |
          set -uo pipefail

          echo "=== WORKSPACE ==="
          pwd
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"

          echo
          echo "=== REPO WORKSPACES ==="
          find "$GITHUB_WORKSPACE" -type d -name .repo -prune -print

          while IFS= read -r repo_dir; do
            root="${repo_dir%/.repo}"
            echo
            echo "=== REPO LIST: $root ==="
            (cd "$root" && repo list) || true
          done < <(find "$GITHUB_WORKSPACE" -type d -name .repo -prune -print)

          echo
          echo "=== PIXEL ABI FILE ==="
          find "$GITHUB_WORKSPACE" -type f \
            -name abi_gki_aarch64_pixel -print

          echo
          echo "=== FIPS ABI FILE ==="
          find "$GITHUB_WORKSPACE" -type f \
            -name abi_gki_aarch64_fips140 -print

          echo
          echo "=== GOOGLE COMMON DIRECTORIES ==="
          find "$GITHUB_WORKSPACE" -maxdepth 6 -type d \
            \( -name common -o -name common-kernels \) -print

          echo
          echo "=== DIAGNOSTICS COMPLETE ==="
          
          # Stop de workflow hier. De rest van de build is voor nu niet nodig.
          exit 1
      # ================================================

      # De onderstaande stappen worden niet uitgevoerd vanwege de exit 1 hierboven.
      # Ze blijven in de YAML staan zodat de workflow geldig is en later weer
      # geactiveerd kunnen worden.

      - name: Verify Google kernel source and locate FIPS postlink
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd workspace

          for file in \
            private/devices/google/shusky/BUILD.bazel \
            private/devices/google/zuma/constants.bzl \
            private/devices/google/shusky/build_shusky.sh \
            common/android/abi_gki_aarch64_pixel \
            common/android/abi_gki_aarch64_fips140
          do
            test -f "$file" || {
              echo "MISSING: $file"
              exit 1
            }
            echo "FOUND: $file"
          done

      - name: Create safe baseline FIPS test defconfig
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd workspace

          cat > private/devices/google/shusky/nethunter_defconfig <<'EOF'
          CONFIG_MODULES=y
          CONFIG_MODVERSIONS=y
          CONFIG_WLAN=y
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_USB=y
          CONFIG_CRYPTO_FIPS140_MOD=m
          EOF

      - name: Build Shusky FIPS test kernel
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd workspace
          ./private/devices/google/shusky/build_shusky.sh \
            --kernel_package=@//aosp \
            --//build/kernel/kleaf:use_prebuilt_gki=false \
            --no//private/devices/google/common:download_prebuilt_gki_fips140 \
            --verbose_failures