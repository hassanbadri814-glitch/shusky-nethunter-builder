
name: Build Pixel 8 Shiba - NetHunter Native FIPS Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shiba-nethunter-native-fips
  cancel-in-progress: false

jobs:
  build-kernel:
    name: Build and audit Shiba Native FIPS kernel
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEVICE: shiba
      KERNEL_DEVICE: shusky
      CUSTOM_KERNEL_VERSION: "1.33"
      WORKSPACE: workspace
      REPORT_DIR: workspace/build-report

    steps:
      # 1. Prepare GitHub runner

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python3-pip python-is-python3 \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves zip unzip rsync ccache file \
            kmod xz-utils zstd binutils cpio lz4

      - name: Install Android repo tool
        run: |
          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # 2. Initialize official Google source

      - name: Initialize Google kernel repository
        run: |
          mkdir -p workspace
          cd workspace

          repo init \
            --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-shusky-6.1-android16

      # 3. Sync Google kernel source

      - name: Sync Google kernel source
        timeout-minutes: 120
        run: |
          cd workspace

          repo sync \
            --current-branch \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2 \
            --fail-fast

      # 4. Verify Google source tree

      - name: Verify Google source tree
        run: |
          cd workspace

          test -f private/devices/google/shusky/BUILD.bazel
          test -f private/devices/google/zuma/constants.bzl
          test -f private/devices/google/shusky/build_shusky.sh

          echo "Google Shusky source tree verified."
          repo status

      # 5. Create safe NetHunter baseline defconfig

      - name: Create NetHunter safe baseline defconfig
        run: |
          cd workspace

          cat > private/devices/google/shusky/nethunter_defconfig <<'EOF'
          # Pixel 8 Shiba NetHunter safe baseline
          # External RTL8187 and MT76 modules intentionally excluded.

          CONFIG_WLAN=y
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_USB=y
          EOF

          cat private/devices/google/shusky/nethunter_defconfig

      # 6. Register NetHunter defconfig

      - name: Register NetHunter defconfig
        run: |
          cd workspace

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("private/devices/google/shusky/BUILD.bazel")
          content = path.read_text()

          if '"nethunter_defconfig"' in content:
              raise SystemExit(
                  "nethunter_defconfig already registered"
              )

          pattern = r'(?m)^(\s*)"shusky_defconfig",\s*$'
          matches = list(re.finditer(pattern, content))

          if len(matches) != 1:
              raise SystemExit(
                  f"Expected one shusky_defconfig entry, found {len(matches)}"
              )

          match = matches[0]
          indent = match.group(1)

          replacement = (
              f'{indent}"shusky_defconfig",\n'
              f'{indent}"nethunter_defconfig",'
          )

          content = (
              content[:match.start()]
              + replacement
              + content[match.end():]
          )

          path.write_text(content)

          print("NetHunter defconfig registered.")
          PY

      # 7. Validate safe baseline and excluded modules

      - name: Validate NetHunter baseline
        run: |
          cd workspace

          echo "=== NetHunter defconfig ==="
          cat private/devices/google/shusky/nethunter_defconfig

          echo
          echo "=== Defconfig registration ==="
          grep -n -A8 -B4 \
            nethunter_defconfig \
            private/devices/google/shusky/BUILD.bazel

          echo
          echo "=== Confirm excluded wireless modules ==="

          if grep -nEi \
            '^[[:space:]]*CONFIG_(RTL8187|MT76[^=]*|EEPROM_93CX6)=' \
            private/devices/google/shusky/nethunter_defconfig; then
            echo "ERROR: Excluded wireless module is enabled in defconfig."
            exit 1
          fi

          echo "PASS: RTL8187, MT76 and EEPROM_93CX6 are not enabled."

          echo
          echo "=== Whitespace validation ==="

          python3 - <<'PY'
          from pathlib import Path
          import sys

          files = [
              Path("private/devices/google/shusky/BUILD.bazel"),
              Path("private/devices/google/shusky/nethunter_defconfig"),
          ]

          failed = False

          for path in files:
              data = path.read_bytes()

              if not data.endswith(b"\n"):
                  print(f"ERROR: Missing final newline: {path}")
                  failed = True

              for number, line in enumerate(
                  data.decode().splitlines(), 1
              ):
                  if line.rstrip(" \t") != line:
                      print(
                          f"ERROR: Trailing whitespace: "
                          f"{path}:{number}"
                      )
                      failed = True

                  if (
                      line.startswith("<<<<<<< ")
                      or line.startswith("=======")
                      or line.startswith(">>>>>>> ")
                  ):
                      print(
                          f"ERROR: Conflict marker: "
                          f"{path}:{number}"
                      )
                      failed = True

          if failed:
              sys.exit(1)

          print("Source whitespace checks passed.")
          PY

      # 8. Record original Google image/module rules

      - name: Record Google image and module rules
        run: |
          cd workspace

          mkdir -p build-report/source-audit

          {
            echo "=== Shusky image and module rules ==="

            grep -Rni -B5 -A15 -E \
              'kernel_images_(vendor_dlkm|system_dlkm)_image|kernel_modules_install|kernel_images_initramfs|modules.load' \
              private/devices/google/shusky \
              --include='BUILD' \
              --include='BUILD.bazel' \
              || true

            echo
            echo "=== AOSP image and module rules ==="

            grep -Rni -B5 -A15 -E \
              'kernel_aarch64_images_(vendor_dlkm|system_dlkm)_image|kernel_aarch64_modules_install|modules.load' \
              aosp \
              --include='BUILD' \
              --include='BUILD.bazel' \
              || true

          } > build-report/source-audit/image-module-rules.txt

          cat build-report/source-audit/image-module-rules.txt

      # 9. Build official Shusky target

      - name: Build Shusky Native FIPS kernel
        run: |
          cd workspace

          mkdir -p build-report

          {
            echo "Build started: $(date -u)"
            echo "Device: $DEVICE"
            echo "Kernel target: $KERNEL_DEVICE"
            echo "Kernel version: $CUSTOM_KERNEL_VERSION"
            echo "Target: //private/devices/google/shusky:zuma_shusky_dist"
            echo "Build type: Native in-tree FIPS"
            echo "Pixel KMI: strict Google build configuration"
            echo "FIPS ABI: supplemental, not a replacement for Pixel KMI"
            echo "FIPS module: native in-tree"
            echo "RTL8187: excluded"
            echo "MT76: excluded"
            echo "KernelSU Inline: disabled"
            echo "Phone flash: disabled"
          } | tee build-report/build-status.txt

          set -o pipefail

          ./private/devices/google/shusky/build_shusky.sh \
            --kernel_package=@//aosp \
            --//build/kernel/kleaf:use_prebuilt_gki=false \
            --no//private/devices/google/common:download_prebuilt_gki_fips140 \
            --verbose_failures \
            2>&1 | tee build-report/build.log

      # 10. Collect build diagnostics

      - name: Collect build diagnostics
        if: always()
        run: |
          cd workspace

          set -u

          mkdir -p build-report/diagnostics
          mkdir -p build-report/symbols

          echo "=== Build output files ==="

          if [ -d out/shusky ]; then
            find out/shusky -type f \
              \( \
                -name 'Module.symvers' \
                -o -name '*.stg' \
                -o -name '*.symvers' \
                -o -name '*abi*' \
                -o -name '*kmi*' \
                -o -name '.config' \
              \) \
              -print \
              > build-report/diagnostics/files.txt
          else
            echo "out/shusky does not exist" \
              > build-report/diagnostics/files.txt
          fi

          cat build-report/diagnostics/files.txt

          echo
          echo "=== KMI errors ==="

          if [ -f build-report/build.log ]; then
            grep -n -A60 -B5 \
              'kmi_symbol_list_violations' \
              build-report/build.log || true

            grep -n -A60 -B5 \
              'missing from the symbol list' \
              build-report/build.log || true
          fi

          echo
          echo "=== FIPS and HMAC build-log messages ==="

          if [ -f build-report/build.log ]; then
            grep -ni -E \
              'fips140|fips.?hmac|gen_hmac|hmac|crypto/fips' \
              build-report/build.log \
              > build-report/diagnostics/fips-build-log-matches.txt \
              || true
          fi

          cat build-report/diagnostics/fips-build-log-matches.txt \
            2>/dev/null || true

          echo
          echo "=== Module.symvers manifest ==="

          find . -type f \
            -name Module.symvers \
            -not -path '*/.git/*' \
            -not -path '*/.repo/*' \
            -print \
            > build-report/symbols/module-symvers-files.txt \
            || true

          cat build-report/symbols/module-symvers-files.txt

          echo
          echo "Diagnostics collection completed."

      # 11. Analyze Module.symvers and ABI lists

      - name: Analyze exported symbols and ABI lists
        if: always()
        run: |
          cd workspace

          set -u

          REPORT="build-report/symbol-analysis"
          MANIFEST="build-report/symbols/module-symvers-files.txt"

          mkdir -p "$REPORT"

          SYMBOLS='__dev_kfree_skb_irq|__ioread32_copy|__iowrite32_copy|dev_set_threaded|of_get_mac_address|pci_disable_link_state|pcie_capability_clear_and_set_word|radix_tree_tagged|rfkill_pause_polling|sched_set_fifo_low|skb_to_sgvec|skb_unlink|usb_alloc_urb|usb_anchor_urb|usb_bulk_msg|usb_control_msg|usb_deregister|usb_free_urb|usb_get_dev|usb_init_urb|usb_kill_anchored_urbs|usb_kill_urb|usb_poison_urb|usb_put_dev|usb_register_driver|usb_reset_device|usb_submit_urb|usb_unanchor_urb|usb_unpoison_urb'

          : > "$REPORT/module-symbols.txt"
          : > "$REPORT/abi-symbols.txt"
          : > "$REPORT/abi-files.txt"

          echo "=== Module.symvers analysis ==="

          if [ ! -s "$MANIFEST" ]; then
            echo "Module.symvers manifest missing or empty." \
              > "$REPORT/module-symbols.txt"
          else
            while IFS= read -r file; do
              [ -n "$file" ] || continue

              {
                echo
                echo "===== $file ====="

                if [ -f "$file" ]; then
                  grep -nE \
                    "^[^[:space:]]+[[:space:]]+(${SYMBOLS})[[:space:]]" \
                    "$file" || true
                else
                  echo "MISSING: $file"
                fi
              } >> "$REPORT/module-symbols.txt"

            done < "$MANIFEST"
          fi

          echo
          echo "=== ABI symbol lists ==="

          find out -type f \
            \( \
              -name abi_symbollist.raw \
              -o -name abi_gki_protected_exports_aarch64 \
            \) \
            -not -path '*/.git/*' \
            -print 2>/dev/null \
            > "$REPORT/abi-files.txt" || true

          if [ ! -s "$REPORT/abi-files.txt" ]; then
            echo "No ABI symbol lists found." \
              > "$REPORT/abi-symbols.txt"
          else
            while IFS= read -r file; do
              [ -f "$file" ] || continue

              {
                echo
                echo "===== $file ====="

                grep -nE \
                  "^(${SYMBOLS})([[:space:]]|$)" \
                  "$file" || true

              } >> "$REPORT/abi-symbols.txt"

            done < "$REPORT/abi-files.txt"
          fi

          echo "Symbol analysis completed."

      # 12. Verify final kernel configuration

      - name: Verify final kernel configuration
        if: success()
        run: |
          cd workspace

          DIST="out/shusky/dist"
          CONFIG=""

          if [ -f "$DIST/.config" ]; then
            CONFIG="$DIST/.config"
          else
            CONFIG="$(find out/bazel -type f \
              -path '*/private/devices/google/shusky/kernel/.config' \
              -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$CONFIG" ] || [ ! -f "$CONFIG" ]; then
            echo "ERROR: Final kernel .config not found."
            find out -type f -name .config -print || true
            exit 1
          fi

          cp "$CONFIG" build-report/final.config

          {
            echo "=== Required configuration ==="

            for option in \
              CONFIG_MODULES \
              CONFIG_MODVERSIONS \
              CONFIG_WLAN \
              CONFIG_CFG80211 \
              CONFIG_MAC80211 \
              CONFIG_USB \
              CONFIG_CRYPTO_FIPS140_MOD \
              CONFIG_CRYPTO_FIPS140_MERGE_MOD_SECTIONS
            do
              grep -E "^${option}=" "$CONFIG" || true
            done

            echo
            echo "=== KernelSU setting ==="
            grep -E '^CONFIG_KSU=' "$CONFIG" || true

            echo
            echo "=== Excluded wireless options ==="

            for option in \
              CONFIG_RTL8187 \
              CONFIG_EEPROM_93CX6 \
              CONFIG_MT76 \
              CONFIG_MT76_USB \
              CONFIG_MT76x2U
            do
              grep -E "^${option}=" "$CONFIG" || \
                echo "# ${option} not set"
            done

          } | tee build-report/config-check.txt

          check_config() {
            option="$1"
            expected="$2"

            if ! grep -qx "${option}=${expected}" "$CONFIG"; then
              echo "ERROR: ${option} is not ${expected}"
              exit 1
            fi
          }

          check_config CONFIG_MODULES y
          check_config CONFIG_MODVERSIONS y
          check_config CONFIG_WLAN y
          check_config CONFIG_CFG80211 m
          check_config CONFIG_MAC80211 m
          check_config CONFIG_USB y
          check_config CONFIG_CRYPTO_FIPS140_MOD m
          check_config CONFIG_CRYPTO_FIPS140_MERGE_MOD_SECTIONS y

          if grep -Eq '^CONFIG_KSU=(y|m)$' "$CONFIG"; then
            echo "ERROR: KernelSU unexpectedly enabled in kernel config."
            exit 1
          fi

          echo "Final configuration checks passed."

      # 13. Verify kernel image and safe baseline modules

      - name: Verify kernel image and baseline modules
        if: success()
        run: |
          cd workspace

          DIST="out/shusky/dist"

          test -f "$DIST/Image.lz4" || {
            echo "ERROR: Image.lz4 missing"
            find "$DIST" -maxdepth 3 -type f
            exit 1
          }

          MODULES=(
            cfg80211.ko
            mac80211.ko
          )

          mkdir -p build-report/modules
          : > build-report/module-list.txt

          for module in "${MODULES[@]}"; do
            found="$(find "$DIST" -type f \
              -name "$module" -print -quit)"

            if [ -z "$found" ]; then
              echo "ERROR: Missing baseline module: $module"
              exit 1
            fi

            echo "$found" | tee -a build-report/module-list.txt
            cp "$found" "build-report/modules/$module"
          done

          echo "Baseline kernel image and modules found."

      # 14. Collect module metadata

      - name: Collect module metadata
        if: success()
        run: |
          cd workspace

          {
            echo "=== Kernel image ==="
            file out/shusky/dist/Image.lz4
            sha256sum out/shusky/dist/Image.lz4

            echo
            echo "=== Baseline module metadata ==="

            for module in build-report/modules/*.ko; do
              echo
              echo "FILE: $module"

              modinfo "$module" || true

              echo "VERMAGIC:"
              modinfo -F vermagic "$module" || true

              echo "DEPENDS:"
              modinfo -F depends "$module" || true

              sha256sum "$module"
            done

          } | tee build-report/module-metadata.txt

          for module in build-report/modules/*.ko; do
            printf '%s: ' "$(basename "$module")"
            modinfo -F vermagic "$module" || true
          done > build-report/vermagic-check.txt

      # 15. Native FIPS module and HMAC evidence

      - name: Audit native FIPS module and HMAC sections
        if: always()
        run: |
          cd workspace

          mkdir -p build-report/fips

          REPORT="build-report/fips"
          : > "$REPORT/fips-module-files.txt"
          : > "$REPORT/fips-module-hashes.txt"
          : > "$REPORT/fips-module-load-entries.txt"

          echo "=== Locate native fips140.ko files ==="

          find out -type f \
            -name fips140.ko \
            -not -path '*/.git/*' \
            -print 2>/dev/null \
            | sort -u \
            > "$REPORT/fips-module-files.txt" || true

          cat "$REPORT/fips-module-files.txt"

          echo
          echo "=== Hash all located FIPS modules ==="

          while IFS= read -r module; do
            [ -f "$module" ] || continue
            sha256sum "$module" \
              | tee -a "$REPORT/fips-module-hashes.txt"
          done < "$REPORT/fips-module-files.txt"

          DIST_MODULE="out/shusky/dist/fips140.ko"

          if [ -f "$DIST_MODULE" ]; then
            cp "$DIST_MODULE" "$REPORT/fips140.ko"

            echo
            echo "=== Final dist module metadata ==="

            file "$DIST_MODULE" \
              | tee "$REPORT/fips-module-file-type.txt"

            readelf -h "$DIST_MODULE" \
              > "$REPORT/fips-elf-header.txt" 2>&1 || true

            readelf -S "$DIST_MODULE" \
              > "$REPORT/fips-elf-sections.txt" 2>&1 || true

            readelf -Ws "$DIST_MODULE" \
              > "$REPORT/fips-elf-symbols.txt" 2>&1 || true

            echo
            echo "=== HMAC-related sections ==="

            grep -n -E \
              '\.init\.data|\.init\.rela\.text|\.init\.rela\.rodata' \
              "$REPORT/fips-elf-sections.txt" || true

            echo
            echo "=== HMAC-related symbols ==="

            grep -n -E \
              'fips140_integ_hmac_key|fips140_integ_hmac_digest|check_fips140_module_hmac|fips140_rela_' \
              "$REPORT/fips-elf-symbols.txt" || true

            echo
            echo "=== Init data hex dump ==="

            readelf -x .init.data "$DIST_MODULE" \
              > "$REPORT/fips-init-data-hex.txt" 2>&1 || true

            cat "$REPORT/fips-init-data-hex.txt"

            echo
            echo "=== FIPS module hash ==="
            sha256sum "$DIST_MODULE" \
              | tee "$REPORT/fips-dist-sha256.txt"

          else
            echo "WARNING: fips140.ko missing from dist."
            echo "Native FIPS dist module not found." \
              > "$REPORT/fips-dist-module-missing.txt"
          fi

          echo
          echo "=== Locate modules.load and FIPS entries ==="

          find out -type f \
            -name modules.load \
            -not -path '*/.git/*' \
            -print 2>/dev/null \
            | sort -u \
            > "$REPORT/modules-load-files.txt" || true

          while IFS= read -r loadfile; do
            [ -f "$loadfile" ] || continue

            if grep -niE '(^|/)kernel/crypto/fips140\.ko|fips140' \
              "$loadfile"; then
              {
                echo
                echo "===== $loadfile ====="
                grep -niE \
                  '(^|/)kernel/crypto/fips140\.ko|fips140' \
                  "$loadfile" || true
              } >> "$REPORT/fips-module-load-entries.txt"
            fi
          done < "$REPORT/modules-load-files.txt"

          cat "$REPORT/fips-module-load-entries.txt" || true

          echo
          echo "=== Locate modules.dep FIPS dependencies ==="

          find out -type f \
            -name modules.dep \
            -not -path '*/.git/*' \
            -print 2>/dev/null \
            | sort -u \
            > "$REPORT/modules-dep-files.txt" || true

          while IFS= read -r depfile; do
            [ -f "$depfile" ] || continue

            if grep -ni fips "$depfile"; then
              {
                echo
                echo "===== $depfile ====="
                grep -ni fips "$depfile" || true
              } >> "$REPORT/fips-modules-dep-entries.txt"
            fi
          done < "$REPORT/modules-dep-files.txt"

          cat "$REPORT/fips-modules-dep-entries.txt" \
            2>/dev/null || true

          echo
          echo "FIPS evidence collection completed."

      # 16. Audit initramfs and final image paths

      - name: Audit initramfs and image integration
        if: always()
        run: |
          cd workspace

          mkdir -p build-report/image-audit

          REPORT="build-report/image-audit"

          echo "=== Dist files ==="

          if [ -d out/shusky/dist ]; then
            find out/shusky/dist -type f -printf '%p\t%s bytes\n' \
              | sort \
              > "$REPORT/dist-files.txt"
          else
            echo "Dist directory missing." \
              > "$REPORT/dist-files.txt"
          fi

          cat "$REPORT/dist-files.txt"

          echo
          echo "=== Initramfs and boot-related files ==="

          find out -type f \
            \( \
              -iname '*initramfs*' \
              -o -iname '*ramdisk*' \
              -o -name 'vendor_boot.img' \
              -o -name 'boot.img' \
              -o -name 'init_boot.img' \
              -o -name 'modules.load' \
              -o -name 'vendor_ramdisk.modules' \
            \) \
            -not -path '*/.git/*' \
            -print 2>/dev/null \
            | sort -u \
            > "$REPORT/initramfs-and-boot-files.txt" || true

          cat "$REPORT/initramfs-and-boot-files.txt"

          echo
          echo "=== All FIPS module paths in output tree ==="

          find out -type f \
            \( \
              -name fips140.ko \
              -o -name ufs-pixel-fips140.ko \
            \) \
            -not -path '*/.git/*' \
            -print 2>/dev/null \
            | sort -u \
            > "$REPORT/fips-module-paths.txt" || true

          cat "$REPORT/fips-module-paths.txt"

          echo
          echo "=== Shusky initramfs modules.load files ==="

          find out -type f \
            -path '*kernel_images_initramfs*' \
            -name modules.load \
            -print 2>/dev/null \
            | sort -u \
            > "$REPORT/shusky-initramfs-modules-load-files.txt" || true

          while IFS= read -r loadfile; do
            [ -f "$loadfile" ] || continue

            echo
            echo "===== $loadfile ====="
            cat "$loadfile"

          done < "$REPORT/shusky-initramfs-modules-load-files.txt"

          echo
          echo "Image audit completed."
          echo "File presence and modules.load entries do not alone prove"
          echo "that a module is physically packaged in a boot ramdisk."

      # 17. Audit vendor_dlkm and system_dlkm outputs

      - name: Inspect DLKM outputs
        if: always()
        run: |
          cd workspace

          mkdir -p build-report/dlkm

          REPORT="build-report/dlkm"

          find out/shusky/dist -type f \
            \( \
              -name 'vendor_dlkm.img' \
              -o -name 'system_dlkm.img' \
              -o -name '*vendor_dlkm*' \
              -o -name '*system_dlkm*' \
            \) \
            -print 2>/dev/null \
            | sort -u \
            > "$REPORT/dlkm-image-files.txt" || true

          cat "$REPORT/dlkm-image-files.txt"

          while IFS= read -r image; do
            [ -f "$image" ] || continue

            echo
            echo "===== $image ====="

            file "$image" || true
            sha256sum "$image" || true

            cp "$image" "$REPORT/"

          done < "$REPORT/dlkm-image-files.txt"

          echo
          echo "=== DLKM staging paths containing FIPS ==="

          find out -type f \
            \( \
              -name fips140.ko \
              -o -name modules.load \
              -o -name modules.dep \
            \) \
            -not -path '*/.git/*' \
            -print 2>/dev/null \
            | sort -u \
            > "$REPORT/dlkm-staging-files.txt" || true

          while IFS= read -r file; do
            [ -f "$file" ] || continue

            case "$file" in
              *vendor_dlkm*|*system_dlkm*|*modules.load|*modules.dep)
                if grep -qi fips "$file" 2>/dev/null; then
                  echo
                  echo "===== $file ====="
                  grep -ni fips "$file" || true
                fi
                ;;
            esac
          done < "$REPORT/dlkm-staging-files.txt"

          echo
          echo "DLKM inspection completed."

      # 18. Create consolidated build report

      - name: Create consolidated build report
        if: always()
        run: |
          cd workspace

          mkdir -p build-report

          {
            echo "=== Build information ==="
            date -u

            echo
            echo "=== Build status ==="

            if [ -f build-report/build-status.txt ]; then
              cat build-report/build-status.txt
            fi

            echo
            echo "=== Dist contents ==="

            if [ -d out/shusky/dist ]; then
              find out/shusky/dist -type f -print | sort
            else
              echo "Dist directory not found"
            fi

            echo
            echo "=== FIPS module hashes ==="

            if [ -f build-report/fips/fips-module-hashes.txt ]; then
              cat build-report/fips/fips-module-hashes.txt
            fi

            echo
            echo "=== FIPS module load entries ==="

            if [ -f build-report/fips/fips-module-load-entries.txt ]; then
              cat build-report/fips/fips-module-load-entries.txt
            fi

            echo
            echo "=== Image audit files ==="

            if [ -f build-report/image-audit/initramfs-and-boot-files.txt ]; then
              cat build-report/image-audit/initramfs-and-boot-files.txt
            fi

            echo
            echo "=== DLKM image files ==="

            if [ -f build-report/dlkm/dlkm-image-files.txt ]; then
              cat build-report/dlkm/dlkm-image-files.txt
            fi

            echo
            echo "=== Disk space ==="
            df -h

          } > build-report/build-report.txt

          echo "Consolidated report created."

      # 19. Upload diagnostic and build artifacts

      - name: Upload Shiba Native FIPS audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiba-nethunter-native-fips-audit
          path: |
            workspace/out/shusky/dist/
            workspace/build-report/
          if-no-files-found: warn
          retention-days: 14
