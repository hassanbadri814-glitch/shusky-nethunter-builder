name: Build Pixel 8 Shiba - NetHunter Native FIPS Test
# build-authorized: user-approved Native FIPS kernel build; no device flashing is performed.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: shiba-nethunter-native-fips-build
  cancel-in-progress: false

jobs:
  build-kernel:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'build-authorized') }}
    name: Build and verify Shiba Native FIPS kernel
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEVICE: shiba
      KERNEL_DEVICE: shusky
      CUSTOM_KERNEL_VERSION: "1.33"
      WORKSPACE: ${{ github.workspace }}/workspace
      REPORT_DIR: ${{ github.workspace }}/workspace/build-report

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker image prune -af || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            cmake \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            lz4 \
            make \
            openssl \
            pahole \
            python3 \
            python3-pip \
            python3-venv \
            rsync \
            unzip \
            zip \
            zstd

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" version

      - name: Initialize Google kernel workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-shusky-6.1-android16 \
            --depth=1

      # Cache the Repo metadata and Git objects.
      # repo sync still runs on every build and updates the checkout.
      - name: Restore Google Repo source cache
        id: repo-cache
        uses: actions/cache@v4
        with:
          path: workspace/.repo
          key: repo-${{ runner.os }}-shusky-android16-v2
          restore-keys: |
            repo-${{ runner.os }}-shusky-android16-v1

      - name: Record source cache status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          if [ "${{ steps.repo-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Google Repo cache: HIT" \
              | tee "$REPORT_DIR/repo-cache-status.txt"
          else
            echo "Google Repo cache: MISS or restored fallback" \
              | tee "$REPORT_DIR/repo-cache-status.txt"
          fi

      - name: Sync Google kernel sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          SYNC_OK=0
          for ATTEMPT in $(seq 1 5); do
            echo "Repo sync attempt $ATTEMPT/5..."
            if repo sync \
              -c \
              -j"$(nproc)" \
              --no-clone-bundle \
              --no-tags; then
              SYNC_OK=1
              break
            fi
            if [ "$ATTEMPT" -lt 5 ]; then
              WAIT=$((ATTEMPT * 15))
              echo "Repo sync failed; retrying in ${WAIT}s."
              sleep "$WAIT"
            fi
          done
          if [ "$SYNC_OK" -ne 1 ]; then
            echo "ERROR: Google kernel source sync failed after 5 attempts."
            exit 1
          fi

      - name: Pin Pixel device kernel/common source revision
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE/aosp"
          DEVICE_COMMON_COMMIT="8769cc47188c3bdca2a34d39ba0f39a945b85465"
          if ! git cat-file -e "$DEVICE_COMMON_COMMIT^{commit}" 2>/dev/null; then
            echo "ERROR: Pixel device-source commit is absent from the synced manifest checkout."
            echo "Expected: $DEVICE_COMMON_COMMIT"
            git log -1 --format='%H %cI %s'
            exit 1
          fi
          git checkout --detach "$DEVICE_COMMON_COMMIT"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$DEVICE_COMMON_COMMIT"
          echo "Pixel device kernel/common commit: $ACTUAL"
          echo "KERNEL_COMMON_COMMIT=$ACTUAL" >> "$GITHUB_ENV"
          {
            echo "Pixel device-source commit: $ACTUAL"
            echo "Installed GKI base is supplied separately by build ID 14691759."
          } | tee "$REPORT_DIR/kernel-common-commit.txt"

      # Persist Bazel's action cache between runs. The Repo cache above
      # separately retains Git objects and the pinned kernel history.
      - name: Restore Bazel disk cache
        id: bazel-cache
        uses: actions/cache@v4
        with:
          path: workspace/.bazel-disk-cache
          key: bazel-${{ runner.os }}-shusky-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-shusky-

      - name: Prepare build reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "Build started: $(date -u)"
            echo "Target: //private/devices/google/shusky:zuma_shusky_dist"
            echo "Build type: Native FIPS integration"
            echo "Pixel KMI: strict"
            echo "FIPS ABI: supplemental"
            echo "FIPS module: native in-tree"
            echo "FIPS HMAC postlink: required"
            echo "KernelSU Inline: disabled"
            echo "RTL8187: excluded"
            echo "MT76: excluded"
            echo "Phone flash: disabled"
            echo "Repo source cache: enabled"
            echo "Bazel disk cache: enabled"
          } | tee "$REPORT_DIR/build-info.txt"

      - name: Verify native FIPS sources and ABI files
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          echo "=== Native FIPS sources ==="
          for FILE in \
            aosp/crypto/Kconfig \
            aosp/crypto/Makefile \
            aosp/crypto/fips140-module.c \
            aosp/crypto/fips140_gen_hmac.c \
            aosp/arch/arm64/Makefile.postlink
          do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing source: $FILE"
              exit 1
            fi
            echo "FOUND: $FILE"
          done
          echo
          echo "=== ABI files ==="
          PIXEL_ABI="aosp/android/abi_gki_aarch64_pixel"
          FIPS_ABI="aosp/android/abi_gki_aarch64_fips140"
          test -f "$PIXEL_ABI"
          test -f "$FIPS_ABI"
          echo "Pixel ABI: $PIXEL_ABI"
          echo "FIPS ABI: $FIPS_ABI"
          echo "PIXEL_ABI=$PIXEL_ABI" >> "$GITHUB_ENV"
          echo "FIPS_ABI=$FIPS_ABI" >> "$GITHUB_ENV"
          {
            echo "Pixel ABI: PASS"
            echo "FIPS ABI: PASS"
            echo "Native FIPS sources: PASS"
          } | tee "$REPORT_DIR/fips-source-verification.txt"

      - name: Verify FIPS Kconfig and HMAC postlink
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          grep -n -B5 -A15 \
            'CRYPTO_FIPS140_MOD' \
            aosp/crypto/Kconfig \
            | tee "$REPORT_DIR/fips-kconfig.txt"
          grep -n -B5 -A8 \
            'fips140' \
            aosp/crypto/Makefile \
            | tee "$REPORT_DIR/fips-crypto-makefile.txt"
          grep -n -B8 -A18 \
            'CMD_FIPS140_GEN_HMAC\|cmd_gen_hmac\|fips140.ko' \
            aosp/arch/arm64/Makefile.postlink \
            | tee "$REPORT_DIR/fips-hmac-postlink-source.txt"
          grep -q 'CMD_FIPS140_GEN_HMAC' \
            aosp/arch/arm64/Makefile.postlink
          grep -q 'cmd_gen_hmac' \
            aosp/arch/arm64/Makefile.postlink
          echo "FIPS source and postlink checks: PASS"

      - name: Resolve and export FIPS ABI Bazel target
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          ABI_FILE="abi_gki_aarch64_fips140"
          echo "=== AOSP BUILD files ==="
          find aosp -maxdepth 3 \
            \( -name BUILD -o -name BUILD.bazel \) \
            -print \
            | tee "$REPORT_DIR/aosp-build-files.txt"
          if [ -f aosp/android/BUILD.bazel ]; then
            ABI_BUILD="aosp/android/BUILD.bazel"
            ABI_LABEL="//aosp/android:${ABI_FILE}"
            ABI_RELATIVE="$ABI_FILE"
          elif [ -f aosp/android/BUILD ]; then
            ABI_BUILD="aosp/android/BUILD"
            ABI_LABEL="//aosp/android:${ABI_FILE}"
            ABI_RELATIVE="$ABI_FILE"
          elif [ -f aosp/BUILD.bazel ]; then
            ABI_BUILD="aosp/BUILD.bazel"
            ABI_LABEL="//aosp:android/${ABI_FILE}"
            ABI_RELATIVE="android/${ABI_FILE}"
          elif [ -f aosp/BUILD ]; then
            ABI_BUILD="aosp/BUILD"
            ABI_LABEL="//aosp:android/${ABI_FILE}"
            ABI_RELATIVE="android/${ABI_FILE}"
          else
            echo "ERROR: No AOSP root Bazel package found."
            exit 1
          fi
          echo "ABI BUILD file: $ABI_BUILD"
          echo "ABI label: $ABI_LABEL"
          if ! grep -Fq "$ABI_RELATIVE" "$ABI_BUILD"; then
            cat >> "$ABI_BUILD" <<EOF
          # Export Google native FIPS ABI for Shusky.
          exports_files([
              "$ABI_RELATIVE",
          ])
          EOF
          fi
          tools/bazel query "$ABI_LABEL" \
            --output=label \
            | tee "$REPORT_DIR/fips-abi-bazel-query.txt"
          echo "FIPS_ABI_LABEL=$ABI_LABEL" >> "$GITHUB_ENV"

      - name: Verify Shusky and Zuma build definitions
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          SHUSKY_BUILD="private/devices/google/shusky/BUILD.bazel"
          ZUMA_RAMDISK="private/devices/google/zuma/vendor_ramdisk.modules.zuma"
          SHUSKY_RAMDISK="private/devices/google/shusky/vendor_ramdisk.modules.shusky"
          test -f "$SHUSKY_BUILD"
          test -f "$ZUMA_RAMDISK"
          test -f "$SHUSKY_RAMDISK"
          echo "=== Shusky BUILD ==="
          grep -n -B5 -A12 \
            'shusky_defconfig\|kmi_symbol_list\|module_outs\|vendor_ramdisk' \
            "$SHUSKY_BUILD"
          echo
          echo "=== Zuma ramdisk module list ==="
          sed -n '1,100p' "$ZUMA_RAMDISK"
          echo
          echo "=== Shusky ramdisk module list ==="
          sed -n '1,100p' "$SHUSKY_RAMDISK"

      - name: Route Shusky and Native FIPS dependencies through exact GKI prebuilt
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          python3 <<'PY'
          from pathlib import Path

          shusky = Path("private/devices/google/shusky/BUILD.bazel")
          google_common = Path("private/devices/google/common/BUILD.bazel")
          shusky_text = shusky.read_text()
          common_text = google_common.read_text()

          replacements = {
              '"//common:kernel_aarch64"':
                  '"//common:kernel_aarch64_download_or_build"',
              '"//common:kernel_aarch64_images"':
                  '"//common:kernel_aarch64_images_download_or_build"',
              '"//common:kernel_aarch64_gki_boot_image"':
                  '"//common:kernel_aarch64_gki_artifacts_download_or_build"',
              '"//common:kernel_aarch64_headers"':
                  '"//common:kernel_aarch64_headers_download_or_build"',
          }
          for old, new in replacements.items():
              count = shusky_text.count(old)
              if count == 0:
                  raise SystemExit(f"ERROR: expected Shusky GKI reference missing: {old}")
              shusky_text = shusky_text.replace(old, new)
              print(f"Shusky BUILD: {old} -> {new} ({count} occurrence(s))")

          old_images = 'images = "//common:kernel_aarch64_images"'
          new_images = 'images = "//common:kernel_aarch64_images_download_or_build"'
          if common_text.count(old_images) != 1:
              raise SystemExit(
                  "ERROR: expected exactly one Google-common extracted_system_dlkm images reference"
              )
          common_text = common_text.replace(old_images, new_images, 1)
          shusky.write_text(shusky_text)
          google_common.write_text(common_text)
          print("Google common BUILD: extracted_system_dlkm now uses prebuilt-aware GKI images.")

          # Guard only the Shusky consumer BUILD file. The Google-common
          # BUILD file defines the canonical source-build targets themselves,
          # so finding those labels there is legitimate and must not fail this
          # consumer-routing check. Require exact quoted labels, not prefixes.
          import re
          forbidden_labels = (
              "//common:kernel_aarch64",
              "//common:kernel_aarch64_images",
              "//common:kernel_aarch64_gki_boot_image",
              "//common:kernel_aarch64_headers",
          )
          for label in forbidden_labels:
              if re.search(r'(?<![A-Za-z0-9_])"' + re.escape(label) + r'"', shusky_text):
                  raise SystemExit(
                      f"ERROR: unresolved exact direct GKI reference {label} in {shusky}"
                  )
          expected_labels = (
              "//common:kernel_aarch64_download_or_build",
              "//common:kernel_aarch64_images_download_or_build",
              "//common:kernel_aarch64_gki_artifacts_download_or_build",
              "//common:kernel_aarch64_headers_download_or_build",
          )
          for label in expected_labels:
              if f'"{label}"' not in shusky_text:
                  raise SystemExit(
                      f"ERROR: expected prebuilt-aware GKI reference missing: {label}"
                  )
          print("PASS: Shusky uses exact prebuilt-aware GKI consumer labels.")
          PY
          echo "=== Confirm Native FIPS kernel label flag exists ==="
          grep -n -A5 -B2 'name = "kernel"' private/devices/google/common/BUILD.bazel
          python3 <<'PY'
          import subprocess
          from pathlib import Path

          kleaf = Path("build/kernel")
          expected_commit = "6483b5a6b74251440b266536c2dbc902a4fa3cf2"
          actual_commit = subprocess.check_output(
              ["git", "-C", str(kleaf), "rev-parse", "HEAD"],
              text=True,
          ).strip()
          if actual_commit != expected_commit:
              raise SystemExit(
                  f"ERROR: unexpected Kleaf source revision: {actual_commit}; "
                  f"expected {expected_commit}"
              )

          download_repo = kleaf / "kleaf/download_repo.bzl"
          source = download_repo.read_text()
          internal_url = (
              "https://androidbuildinternal.googleapis.com/android/internal/build/v3/"
              "builds/{build_number}/{target}/attempts/latest/artifacts/{filename}/url?redirect=true"
          )
          public_url = (
              "https://ci.android.com/builds/submitted/{build_number}/{target}/latest/raw/{filename}"
          )
          if source.count(internal_url) != 1:
              raise SystemExit(
                  "ERROR: expected exactly one pinned Kleaf internal artifact URL constant"
              )
          download_repo.write_text(source.replace(internal_url, public_url, 1))
          verified = download_repo.read_text()
          if public_url not in verified or internal_url in verified:
              raise SystemExit("ERROR: public GKI artifact URL patch verification failed")
          print(f"Kleaf source revision: {actual_commit}")
          print("PASS: pinned Kleaf download_repo.bzl now uses the verified public Android CI artifact endpoint.")
          PY
          echo "GKI prebuilt target routing patch: PASS"

      - name: Create native FIPS defconfig fragment
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          cat > \
            private/devices/google/shusky/nethunter_fips_defconfig <<'EOF'
          CONFIG_MODULES=y
          CONFIG_MODVERSIONS=y
          CONFIG_WLAN=y
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_USB=y
          CONFIG_CRYPTO_FIPS140_MOD=m
          EOF
          echo "=== FIPS defconfig ==="
          cat \
            private/devices/google/shusky/nethunter_fips_defconfig

      - name: Integrate native FIPS into Shusky and Zuma ramdisk
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          python3 <<'PY'
          import os
          from pathlib import Path
          build = Path(
              "private/devices/google/shusky/BUILD.bazel"
          )
          zuma_ramdisk = Path(
              "private/devices/google/zuma/vendor_ramdisk.modules.zuma"
          )
          shusky_ramdisk = Path(
              "private/devices/google/shusky/vendor_ramdisk.modules.shusky"
          )
          text = build.read_text()
          fips_label = os.environ["FIPS_ABI_LABEL"]
          if "nethunter_fips_defconfig" not in text:
              old = '"shusky_defconfig"'
              if old not in text:
                  raise SystemExit(
                      "ERROR: shusky_defconfig not found"
                  )
              text = text.replace(
                  old,
                  old + ',\n        "nethunter_fips_defconfig"',
                  1
              )
          if "additional_kmi_symbol_lists" not in text:
              old = (
                  'kmi_symbol_list = '
                  '"//common:android/abi_gki_aarch64_pixel",'
              )
              if old not in text:
                  raise SystemExit(
                      "ERROR: Strict Pixel ABI declaration not found"
                  )
              text = text.replace(
                  old,
                  old + f'''
              additional_kmi_symbol_lists = [
                  "{fips_label}",
              ],''',
                  1
              )
          elif fips_label not in text:
              raise SystemExit(
                  "ERROR: Existing additional_kmi_symbol_lists "
                  "does not contain the FIPS ABI label."
              )
          if '"crypto/fips140.ko"' not in text:
              old = "module_outs = ZUMA_MODULE_OUTS,"
              if old not in text:
                  raise SystemExit(
                      "ERROR: module_outs = ZUMA_MODULE_OUTS not found"
                  )
              text = text.replace(
                  old,
                  'module_outs = ZUMA_MODULE_OUTS + '
                  '["crypto/fips140.ko"],',
                  1
              )
          build.write_text(text)
          fips_entry = "kernel/crypto/fips140.ko"
          zuma_lines = zuma_ramdisk.read_text().splitlines()
          if fips_entry not in zuma_lines:
              # Google's Native FIPS crypto module is intended for early boot.
              # Put it first, before the UFS FIPS consumer and other device modules.
              zuma_lines.insert(0, fips_entry)
              zuma_ramdisk.write_text(
                  "\n".join(zuma_lines) + "\n"
              )
          if zuma_lines[0] != fips_entry:
              raise SystemExit(
                  "ERROR: kernel/crypto/fips140.ko must be first in the Zuma ramdisk load list"
              )
          shusky_lines = shusky_ramdisk.read_text().splitlines()
          if fips_entry in shusky_lines:
              raise SystemExit(
                  "ERROR: FIPS entry already exists in Shusky list; "
                  "review the existing integration before continuing."
              )
          print("Shusky BUILD updated.")
          print("FIPS ABI:", fips_label)
          print("FIPS module added to module_outs.")
          print("FIPS added to Zuma ramdisk list.")
          print("Existing Zuma module ordering preserved.")
          PY
          echo "=== Verify FIPS entry in Zuma ramdisk list ==="
          grep -n -F \
            'kernel/crypto/fips140.ko' \
            private/devices/google/zuma/vendor_ramdisk.modules.zuma
          echo
          echo "=== First entries (ordering retained for diagnosis) ==="
          sed -n '1,12p' \
            private/devices/google/zuma/vendor_ramdisk.modules.zuma

      - name: Verify configured GKI and Native FIPS dependency graph before compilation
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          tools/bazel query "$FIPS_ABI_LABEL" --output=label
          GKI_FLAGS=(
            --use_prebuilt_gki=14691759
            --action_env=KLEAF_DOWNLOAD_BUILD_NUMBER_MAP=gki_prebuilts=14691759
          )
          SHUSKY_FLAGS=(
            --//private/devices/google/common:kernel=//private/devices/google/shusky:kernel
            --//private/google-modules/soc/gs:gs_soc_module=//private/devices/google/shusky:zuma_soc.shusky
            --no//private/devices/google/common:download_prebuilt_gki_fips140
          )
          tools/bazel cquery --config=stamp --config=shusky --kernel_package=@//aosp "${GKI_FLAGS[@]}" "${SHUSKY_FLAGS[@]}" \
            --output=label \
            'deps(//private/devices/google/shusky:zuma_shusky_dist)' \
            > "$REPORT_DIR/shusky-configured-dependencies.txt"
          for REQUIRED in \
            '@gki_prebuilts//Image.lz4:Image.lz4' \
            '@gki_prebuilts//kernel-headers.tar.gz:kernel-headers.tar.gz' \
            '@gki_prebuilts//system_dlkm_staging_archive.tar.gz:system_dlkm_staging_archive.tar.gz' \
            '@gki_prebuilts//system_dlkm.modules.blocklist:system_dlkm.modules.blocklist' \
            '@gki_prebuilts//system_dlkm.modules.load:system_dlkm.modules.load'
          do
            if ! grep -Fq "$REQUIRED" "$REPORT_DIR/shusky-configured-dependencies.txt"; then
              echo "ERROR: required GKI prebuilt dependency is absent: $REQUIRED"
              exit 1
            fi
            echo "PASS dependency: $REQUIRED"
          done
          grep -n 'abi_gki_aarch64_pixel' private/devices/google/shusky/BUILD.bazel
          grep -n "$FIPS_ABI_LABEL" private/devices/google/shusky/BUILD.bazel
          grep -n 'crypto/fips140.ko' private/devices/google/shusky/BUILD.bazel
          echo "Configured GKI and Native FIPS dependency graph: PASS" \
            | tee "$REPORT_DIR/pre-build-verification.txt"

      - name: Build Shusky Native FIPS kernel
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          tools/bazel run \
            --config=stamp \
            --config=shusky \
            --kernel_package=@//aosp \
            --use_prebuilt_gki=14691759 \
            --action_env=KLEAF_DOWNLOAD_BUILD_NUMBER_MAP=gki_prebuilts=14691759 \
            --//private/devices/google/common:kernel=//private/devices/google/shusky:kernel \
            --//private/google-modules/soc/gs:gs_soc_module=//private/devices/google/shusky:zuma_soc.shusky \
            --no//private/devices/google/common:download_prebuilt_gki_fips140 \
            --verbose_failures \
            --sandbox_debug \
            --disk_cache="$WORKSPACE/.bazel-disk-cache" \
            //private/devices/google/shusky:zuma_shusky_dist \
            2>&1 | tee "$REPORT_DIR/build.log"

      - name: Preserve generated vendor_kernel_boot image
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          mkdir -p out/shusky/dist
          mapfile -t VENDOR_KERNEL_BOOT_CANDIDATES < <(
            find out/bazel/output_user_root \
              -type f \
              -path '*/out/android14-6.1/dist/vendor_kernel_boot.img' \
              -print 2>/dev/null
          )
          if [ "${#VENDOR_KERNEL_BOOT_CANDIDATES[@]}" -ne 1 ]; then
            printf 'Expected exactly one generated vendor_kernel_boot.img; found %s\\n' "${#VENDOR_KERNEL_BOOT_CANDIDATES[@]}"
            printf '%s\\n' "${VENDOR_KERNEL_BOOT_CANDIDATES[@]}"
            exit 1
          fi
          cp "${VENDOR_KERNEL_BOOT_CANDIDATES[0]}" out/shusky/dist/vendor_kernel_boot.img
          test "$(dd if=out/shusky/dist/vendor_kernel_boot.img bs=8 count=1 2>/dev/null)" = "VNDRBOOT"
          sha256sum out/shusky/dist/vendor_kernel_boot.img \
            | tee "$REPORT_DIR/vendor-kernel-boot-sha256.txt"
          stat -c 'vendor_kernel_boot.img bytes: %s' out/shusky/dist/vendor_kernel_boot.img \
            | tee "$REPORT_DIR/vendor-kernel-boot-size.txt"

      - name: Verify final FIPS kernel configuration
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          mkdir -p "$REPORT_DIR"
          REPORT="$REPORT_DIR/fips-config.txt"
          CONFIG_LIST="$REPORT_DIR/shusky-config-files.txt"
          : > "$REPORT"
          : > "$CONFIG_LIST"
          echo "=== Find the actual Shusky kernel configuration ==="
          mapfile -t CONFIGS < <(
            find out/bazel \
              -type f \
              -path '*/private/devices/google/shusky/kernel/.config' \
              -print
          )
          if [ "${#CONFIGS[@]}" -eq 0 ]; then
            echo "ERROR: Shusky kernel .config not found."
            echo "Available .config files:"
            find out -type f -name .config -print
            exit 1
          fi
          if [ "${#CONFIGS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one Shusky kernel config."
            echo "Found: ${#CONFIGS[@]}"
            printf '%s\n' "${CONFIGS[@]}"
            exit 1
          fi
          CONFIG="${CONFIGS[0]}"
          printf '%s\n' "$CONFIG" | tee "$CONFIG_LIST"
          echo
          echo "Selected Shusky config: $CONFIG"
          {
            echo "Selected config: $CONFIG"
            echo
            echo "=== FIPS settings ==="
            grep -E \
              '^(CONFIG_CRYPTO_FIPS140_MOD=|# CONFIG_CRYPTO_FIPS140_MOD is not set|CONFIG_CRYPTO_FIPS140_MERGE_MOD_SECTIONS=)' \
              "$CONFIG" || true
          } | tee "$REPORT"
          EXPECTED_CONFIG=(
            "CONFIG_MODULES=y"
            "CONFIG_MODVERSIONS=y"
            "CONFIG_WLAN=y"
            "CONFIG_CFG80211=m"
            "CONFIG_MAC80211=m"
            "CONFIG_USB=y"
            "CONFIG_CRYPTO_FIPS140_MOD=m"
          )
          for SETTING in "${EXPECTED_CONFIG[@]}"; do
            if ! grep -qxF "$SETTING" "$CONFIG"; then
              echo "ERROR: Required safe-baseline setting is missing: $SETTING"
              exit 1
            fi
            echo "$SETTING" >> "$REPORT"
          done
          if grep -Eq '^CONFIG_KSU=(y|m)' "$CONFIG"; then
            echo "ERROR: KernelSU is enabled in the kernel config."
            grep -n '^CONFIG_KSU=' "$CONFIG"
            exit 1
          fi
          echo "CONFIG_KSU: disabled (not enabled in kernel config)" | tee -a "$REPORT"
          echo
          echo "=== Distribution config comparison ==="
          if [ -f out/shusky/dist/.config ]; then
            if grep -q '^CONFIG_CRYPTO_FIPS140_MOD=m$' \
              out/shusky/dist/.config; then
              echo "Distribution config: FIPS enabled."
            else
              echo "WARNING: FIPS setting not present in dist/.config."
              echo "The Shusky kernel config itself passed."
            fi
          else
            echo "Distribution .config not available."
          fi
          echo "FIPS_CONFIG=$CONFIG" >> "$GITHUB_ENV"
          echo
          echo "Native Shusky FIPS configuration: PASS"

      - name: Verify generated native FIPS module
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          MODULE="$(find . -type f \
            -path '*/crypto/fips140.ko' \
            -not -path './build-report/*' \
            -print -quit)"
          if [ -z "$MODULE" ]; then
            echo "ERROR: Native crypto/fips140.ko not found."
            exit 1
          fi
          echo "FIPS module: $MODULE"
          sha256sum "$MODULE" \
            | tee "$REPORT_DIR/fips140-sha256.txt"
          file "$MODULE" \
            | tee "$REPORT_DIR/fips140-file.txt"
          readelf -S "$MODULE" \
            | tee "$REPORT_DIR/fips140-sections.txt"
          grep -q '\.init\.rela\.text' \
            "$REPORT_DIR/fips140-sections.txt"
          grep -q '\.init\.rela\.rodata' \
            "$REPORT_DIR/fips140-sections.txt"
          echo "FIPS relocation sections: PASS"

      - name: Verify exact Native FIPS HMAC postlink execution and digest
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          python3 <<'PY'
          from pathlib import Path
          import re

          postlink = Path("aosp/arch/arm64/Makefile.postlink").read_text()
          generator = Path("aosp/crypto/fips140_gen_hmac.c").read_text()
          required = (
              "CMD_FIPS140_GEN_HMAC = crypto/fips140_gen_hmac",
              "quiet_cmd_gen_hmac = HMAC",
              "$(objtree)/crypto/fips140.ko: FORCE",
              "$(call cmd,gen_hmac)",
              "$(CMD_FIPS140_GEN_HMAC) $@",
          )
          for fragment in required:
              if fragment not in postlink:
                  raise SystemExit(f"ERROR: pinned Makefile.postlink lacks: {fragment}")
          if not re.search(r"(?m)^quiet_cmd_gen_hmac\s*=\s*HMAC\s+\$@", postlink):
              raise SystemExit("ERROR: HMAC log label is not bound to Kbuild target $@")
          generator_tokens = (
              "fips140_integ_hmac_key", "fips140_integ_hmac_digest",
              "__fips140_text_start", "__fips140_text_end",
              "__fips140_rodata_start", "__fips140_rodata_end",
              "HMAC_Init_ex", "EVP_sha256()", "HMAC_Update", "HMAC_Final",
          )
          for token in generator_tokens:
              if token not in generator:
                  raise SystemExit(f"ERROR: pinned HMAC generator lacks: {token}")
          print("Pinned Kbuild target rule and SHA-256 generator implementation: PASS")
          PY

          python3 - "$REPORT_DIR/build.log" "$REPORT_DIR/fips-hmac-target-log.txt" <<'PY'
          from pathlib import Path
          import re
          import sys
          log = Path(sys.argv[1]).read_text(errors="replace")
          pattern = re.compile(r"(^|[ \t])HMAC[ \t]+(?:\S*/)?crypto/fips140\.ko(?:[ \t]|$)")
          matches = [line for line in log.splitlines() if pattern.search(line)]
          if matches:
              Path(sys.argv[2]).write_text("\n".join(matches) + "\n")
              print(f"Kbuild exposed the exact fips140.ko HMAC target line(s): {len(matches)}")
              print("\n".join(matches))
          else:
              Path(sys.argv[2]).write_text(
                  "Bazel did not expose successful action stdout in build.log. "
                  "The pinned target rule and embedded digest are independently verified below.\n"
              )
              print("INFO: Bazel did not expose the successful Kbuild action's quiet log line.")
              print("The exact source target rule and resulting embedded HMAC are verified independently.")
          PY

          # Verify only authoritative final outputs. Bazel sandbox action trees
          # also contain transient pre-strip/unstripped copies; comparing those
          # byte-for-byte with the stripped final module creates false conflicts.
          : > "$REPORT_DIR/fips-hmac-module-candidates.txt"
          test -f out/shusky/dist/fips140.ko && \
            printf '%s\n' out/shusky/dist/fips140.ko \
              >> "$REPORT_DIR/fips-hmac-module-candidates.txt"
          find out/bazel -type f \
            \( -path '*/execroot/__main__/bazel-out/k8-fastbuild/bin/private/devices/google/shusky/kernel/crypto/fips140.ko' \
               -o -path '*/execroot/__main__/bazel-out/k8-fastbuild/bin/private/devices/google/shusky/kernel_modules_install/staging/lib/modules/*/kernel/crypto/fips140.ko' \) \
            -not -path '*/sandbox/*' -print \
            >> "$REPORT_DIR/fips-hmac-module-candidates.txt"
          sort -u -o "$REPORT_DIR/fips-hmac-module-candidates.txt" \
            "$REPORT_DIR/fips-hmac-module-candidates.txt"
          if ! grep -qx 'out/shusky/dist/fips140.ko' \
            "$REPORT_DIR/fips-hmac-module-candidates.txt"; then
            echo "ERROR: authoritative final dist fips140.ko is missing."
            exit 1
          fi
          if [ "$(wc -l < "$REPORT_DIR/fips-hmac-module-candidates.txt")" -lt 2 ]; then
            echo "ERROR: expected final dist plus Bazel/staging FIPS module for cross-verification."
            exit 1
          fi

          python3 - "$REPORT_DIR" "$REPORT_DIR/fips-hmac-module-candidates.txt" <<'PY'
          import hashlib, hmac, struct, sys
          from pathlib import Path

          report = Path(sys.argv[1])
          candidates = [Path(p) for p in Path(sys.argv[2]).read_text().splitlines() if p]
          verified, rejected = [], []

          def cstr(table, offset):
              if offset < 0 or offset >= len(table):
                  raise ValueError("string-table offset out of bounds")
              end = table.find(b"\0", offset)
              if end < 0:
                  raise ValueError("unterminated ELF string")
              return table[offset:end].decode("utf-8", "replace")

          def verify(path):
              blob = path.read_bytes()
              if len(blob) < 64 or blob[:4] != b"\x7fELF" or blob[4:6] != b"\x02\x01":
                  raise ValueError("not ELF64 little-endian")
              hdr = struct.unpack_from("<16sHHIQQQIHHHHHH", blob, 0)
              if hdr[1] != 1 or hdr[2] != 183:
                  raise ValueError("not relocatable AArch64 ELF")
              shoff, shentsize, shnum, shstrndx = hdr[6], hdr[11], hdr[12], hdr[13]
              if shentsize < 64 or not shnum or shstrndx >= shnum:
                  raise ValueError("invalid section-header table")
              secs = []
              for i in range(shnum):
                  v = struct.unpack_from("<IIQQQQIIQQ", blob, shoff + i * shentsize)
                  secs.append({"nameoff":v[0],"type":v[1],"off":v[4],"size":v[5],
                               "link":v[6],"entsize":v[9]})
              st = secs[shstrndx]
              names = blob[st["off"]:st["off"]+st["size"]]
              for s in secs:
                  s["name"] = cstr(names, s["nameoff"])
              byname = {s["name"]:s for s in secs}
              for name in (".init.rela.text", ".init.rela.rodata"):
                  s = byname.get(name)
                  if not s or not s["size"] or s["size"] % 24:
                      raise ValueError(f"missing/invalid {name}")

              syms = {}
              for s in secs:
                  if s["type"] != 2:
                      continue
                  if s["link"] >= len(secs):
                      raise ValueError("bad symtab string-table link")
                  strings_sec = secs[s["link"]]
                  strings = blob[strings_sec["off"]:strings_sec["off"]+strings_sec["size"]]
                  ent = s["entsize"] or 24
                  if ent < 24:
                      raise ValueError("bad ELF64 symbol entry size")
                  for i in range(s["size"] // ent):
                      nameoff, info, other, ndx, value, size = struct.unpack_from(
                          "<IBBHQQ", blob, s["off"]+i*ent)
                      if nameoff and ndx < len(secs):
                          name = cstr(strings, nameoff)
                          syms.setdefault(name, set()).add((ndx,value,size))

              def sym(name):
                  found = syms.get(name, set())
                  if len(found) != 1:
                      raise ValueError(f"expected one defined {name}; found {len(found)}")
                  ndx,value,size = next(iter(found))
                  return ndx,value,size

              def span(first,last):
                  a, av, _ = sym(first)
                  b, bv, _ = sym(last)
                  if a != b or not 0 <= av < bv <= secs[a]["size"]:
                      raise ValueError(f"invalid symbol range {first}..{last}")
                  s = secs[a]
                  return blob[s["off"]+av:s["off"]+bv]

              kn, kv, ks = sym("fips140_integ_hmac_key")
              keysec = secs[kn]
              ko = keysec["off"] + kv
              kend = ko + ks if ks else keysec["off"] + keysec["size"]
              kb = blob[ko:kend]
              if b"\0" not in kb or not kb.split(b"\0",1)[0]:
                  raise ValueError("HMAC key is empty or not NUL-terminated")
              key = kb.split(b"\0",1)[0]

              dn, dv, ds = sym("fips140_integ_hmac_digest")
              if ds < 32:
                  raise ValueError("digest symbol is smaller than SHA-256")
              digestsec = secs[dn]
              stored = blob[digestsec["off"]+dv:digestsec["off"]+dv+32]
              textdata = span("__fips140_text_start","__fips140_text_end")
              rodata = span("__fips140_rodata_start","__fips140_rodata_end")
              calculated = hmac.new(key,textdata+rodata,hashlib.sha256).digest()
              if not hmac.compare_digest(stored,calculated):
                  raise ValueError("embedded digest differs from independently recomputed HMAC-SHA256")
              return {
                  "path":str(path),"sha256":hashlib.sha256(blob).hexdigest(),
                  "hmac":calculated.hex(),"key_bytes":len(key),
                  "key_sha256":hashlib.sha256(key).hexdigest(),
                  "text_sha256":hashlib.sha256(textdata).hexdigest(),
                  "rodata_sha256":hashlib.sha256(rodata).hexdigest(),
                  "text_bytes":len(textdata),"rodata_bytes":len(rodata),
                  "rela_text":byname[".init.rela.text"]["size"],
                  "rela_rodata":byname[".init.rela.rodata"]["size"],
              }

          for p in candidates:
              try:
                  verified.append(verify(p))
              except Exception as e:
                  rejected.append(f"{p}: {e}")
          if not verified:
              raise SystemExit("ERROR: no module passed independent HMAC verification:\n"+"\n".join(rejected[:30]))
          # Final dist, canonical Bazel target and installed staging copy must
          # be byte-identical, and each must independently pass embedded HMAC.
          if len({x["sha256"] for x in verified}) != 1:
              details = "\\n".join(
                  f'{x["path"]}: sha256={x["sha256"]} hmac={x["hmac"]}'
                  for x in verified
              )
              raise SystemExit(
                  "ERROR: authoritative final FIPS module outputs are not byte-identical:\\n" + details
              )
          fingerprints = {
              (x["hmac"], x["key_sha256"], x["text_sha256"], x["rodata_sha256"])
              for x in verified
          }
          if len(fingerprints) != 1:
              raise SystemExit(
                  "ERROR: authoritative final FIPS outputs disagree in HMAC key or authenticated text/rodata"
              )
          v = verified[0]
          lines = [
              "Kbuild target binding: PASS (pinned Makefile.postlink rule is scoped to crypto/fips140.ko)",
              "Independent embedded HMAC-SHA256 recomputation: PASS",
              f"Verified module candidates: {len(verified)}",
              f"Module SHA-256: {v['sha256']}",
              f"Embedded HMAC-SHA256: {v['hmac']}",
              f"HMAC key SHA-256: {v['key_sha256']}",
              f"Authenticated .text SHA-256: {v['text_sha256']}",
              f"Authenticated .rodata SHA-256: {v['rodata_sha256']}",
              f"HMAC key length: {v['key_bytes']} bytes",
              f"Covered .text bytes: {v['text_bytes']}",
              f"Covered .rodata bytes: {v['rodata_bytes']}",
              f".init.rela.text bytes: {v['rela_text']}",
              f".init.rela.rodata bytes: {v['rela_rodata']}",
              "Verified module paths:",
          ]
          lines.extend("  "+x["path"] for x in verified)
          if rejected:
              lines.append("Non-final or non-verifiable candidates skipped:")
              lines.extend("  "+x for x in rejected[:30])
          (report/"fips-hmac-execution-verification.txt").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
      - name: Verify generated vendor ramdisk modules.load
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          find . -type f \
            -name modules.load \
            -not -path './build-report/*' \
            -print \
            | sort \
            | tee "$REPORT_DIR/modules-load-files.txt"
          FOUND=0
          INDEX=0
          while IFS= read -r MODULES_LOAD; do
            [ -f "$MODULES_LOAD" ] || continue
            INDEX=$((INDEX + 1))
            echo
            echo "=== modules.load: $MODULES_LOAD ==="
            sed -n '1,35p' "$MODULES_LOAD"
            if grep -q 'fips140\.ko' "$MODULES_LOAD"; then
              FOUND=$((FOUND + 1))
              echo "FIPS entry found."
              cp "$MODULES_LOAD" \
                "$REPORT_DIR/modules-load-${INDEX}.txt"
              grep -n -B3 -A5 \
                'fips140\.ko' \
                "$MODULES_LOAD" \
                >> "$REPORT_DIR/fips-modules-load-position.txt"
            fi
          done < "$REPORT_DIR/modules-load-files.txt"
          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: No generated modules.load contains fips140.ko."
            exit 1
          fi
          {
            echo "modules.load files containing FIPS: $FOUND"
            echo "FIPS module entry: present"
            echo "Load order: recorded, not assumed"
          } | tee "$REPORT_DIR/modules-load-verification.txt"
          echo "FIPS modules.load presence verification: PASS"

      - name: Collect ramdisk and module dependency diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          cd "$WORKSPACE" || exit 0
          mkdir -p "$REPORT_DIR"
          echo "=== modules.load files ===" \
            | tee "$REPORT_DIR/ramdisk-diagnostics.txt"
          find out -type f \
            -name modules.load \
            -print 2>/dev/null \
            | sort \
            | tee "$REPORT_DIR/ramdisk-modules-load-paths.txt"
          echo \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          echo "=== FIPS-related module dependency entries ===" \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          find out -type f \
            \( -name modules.dep -o -name modules.softdep \) \
            -print0 2>/dev/null \
            | while IFS= read -r -d '' DEPFILE; do
                if grep -qE 'fips140|zsmalloc' "$DEPFILE"; then
                  echo \
                    | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
                  echo "FILE: $DEPFILE" \
                    | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
                  grep -n -B2 -A3 \
                    -E 'fips140|zsmalloc' \
                    "$DEPFILE" \
                    | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
                fi
              done
          echo \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          echo "=== Relevant ramdisk and boot image candidates ===" \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          find out/shusky out/bazel \
            -type f \
            \( -iname '*vendor*ramdisk*' \
            -o -iname '*initramfs*' \
            -o -name vendor_boot.img \
            -o -name boot.img \
            -o -name modules.load \
            -o -name modules.dep \
            -o -name modules.softdep \) \
            -print 2>/dev/null \
            | sort -u \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          echo \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          echo "=== Final distribution modules.load ===" \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          if [ -f out/shusky/dist/modules.load ]; then
            sed -n '1,100p' out/shusky/dist/modules.load \
              | tee "$REPORT_DIR/final-dist-modules.load"
            if grep -q 'fips140\.ko' out/shusky/dist/modules.load; then
              echo "FIPS is present in final dist/modules.load." \
                | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
            else
              echo "FIPS is NOT present in final dist/modules.load." \
                | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
            fi
          else
            echo "Final dist/modules.load does not exist." \
              | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          fi
          echo \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          echo "=== Image file types ===" \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          find out/shusky/dist \
            -type f \
            \( -name '*.img' -o -name '*ramdisk*' \) \
            -print0 2>/dev/null \
            | while IFS= read -r -d '' IMAGE_FILE; do
                file "$IMAGE_FILE"
              done \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          echo "Ramdisk diagnostics collected."

      - name: Verify excluded Wi-Fi modules
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          if find . -type f \
            \( -name '*rtl8187*.ko' \
            -o -name '*mt76*.ko' \) \
            -not -path './build-report/*' \
            | grep .; then
            echo "ERROR: RTL8187 or MT76 module found."
            exit 1
          fi
          echo "RTL8187: excluded"
          echo "MT76: excluded"
          for MODULE in cfg80211.ko mac80211.ko; do
            if ! find . -type f -name "$MODULE" -not -path './build-report/*' | grep -q .; then
              echo "ERROR: Required NetHunter wireless module missing: $MODULE"
              exit 1
            fi
            echo "$MODULE: present"
          done
          if find . -type f -name 'ksu.ko' -not -path './build-report/*' | grep -q .; then
            echo "ERROR: Unexpected KernelSU module found."
            exit 1
          fi
          echo "KernelSU module: absent"

      - name: Collect build outputs and reports
        if: always()
        shell: bash
        run: |
          set +e
          cd "$WORKSPACE" || exit 0
          mkdir -p "$REPORT_DIR"
          {
            echo "Build report generated: $(date -u)"
            echo
            echo "=== FIPS module candidates ==="
            find . -type f \
              -path '*/crypto/fips140.ko' \
              -not -path './build-report/*' \
              -exec sha256sum {} \;
            echo
            echo "=== Kernel images ==="
            find . -type f \
              \( -name Image \
              -o -name Image.lz4 \
              -o -name boot.img \
              -o -name vendor_boot.img \
              -o -name vendor_kernel_boot.img \
              -o -name vendor_dlkm.img \
              -o -name system_dlkm.img \
              -o -name dtbo.img \) \
              -print
          } | tee "$REPORT_DIR/build-summary.txt"

      - name: Package Native FIPS build artifacts
        if: always()
        shell: bash
        run: |
          set +e
          cd "$WORKSPACE" || exit 0
          mkdir -p "$REPORT_DIR/package"
          find . -type f \
            \( -name Image \
            -o -name Image.lz4 \
            -o -name boot.img \
            -o -name vendor_boot.img \
            -o -name vendor_kernel_boot.img \
            -o -name vendor_dlkm.img \
            -o -name system_dlkm.img \
            -o -name dtbo.img \
            -o -name fips140.ko \
            -o -name modules.load \
            -o -name modules.dep \
            -o -name modules.softdep \) \
            -not -path './build-report/package/*' \
            -not -path './build-report/*' \
            -exec cp --parents {} "$REPORT_DIR/package/" \;
          zip -qr \
            shiba-nethunter-native-fips-build-test.zip \
            build-report \
            2>/dev/null || true

      - name: Upload Native FIPS build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiba-nethunter-native-fips-build-test
          path: |
            workspace/build-report/
            workspace/shiba-nethunter-native-fips-build-test.zip
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
