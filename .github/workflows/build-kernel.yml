
name: Build Pixel 8 Shiba - NetHunter FIPS Build Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shiba-nethunter-kernel-build
  cancel-in-progress: false

jobs:
  build-kernel:
    name: Build and verify Shiba FIPS test kernel
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEVICE: shiba
      KERNEL_DEVICE: shusky
      CUSTOM_KERNEL_VERSION: "1.33"

    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python3-pip python-is-python3 \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves zip unzip rsync ccache file \
            kmod xz-utils zstd binutils

      - name: Install Android repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize Google kernel repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace
          cd workspace
          repo init \
            --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-shusky-6.1-android16

      - name: Sync Google kernel source
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          cd workspace
          repo sync \
            --current-branch \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2 \
            --fail-fast

      - name: Verify Google kernel source and locate FIPS postlink
        shell: bash
        run: |
          set -euo pipefail
          cd workspace

          for file in \
            private/devices/google/shusky/BUILD.bazel \
            private/devices/google/zuma/constants.bzl \
            private/devices/google/shusky/build_shusky.sh \
            common/android/abi_gki_aarch64_pixel \
            common/android/abi_gki_aarch64_fips140
          do
            test -f "$file" || {
              echo "MISSING: $file"
              exit 1
            }
            echo "FOUND: $file"
          done

          echo
          echo "=== Locate FIPS source files ==="

          FIPS_MODULE_SOURCE="$(find . \
            -type f -name fips140-module.c \
            -not -path './.repo/*' \
            -print -quit)"

          FIPS_HMAC_SOURCE="$(find . \
            -type f -name fips140_gen_hmac.c \
            -not -path './.repo/*' \
            -print -quit)"

          POSTLINK_FILE="$(find . \
            -type f -name Makefile.postlink \
            -not -path './.repo/*' \
            -print -quit)"

          test -n "$FIPS_MODULE_SOURCE" || {
            echo "ERROR: fips140-module.c not found."
            exit 1
          }

          test -n "$FIPS_HMAC_SOURCE" || {
            echo "ERROR: fips140_gen_hmac.c not found."
            exit 1
          }

          test -n "$POSTLINK_FILE" || {
            echo "ERROR: Makefile.postlink not found."
            find . -type f -name '*postlink*' \
              -not -path './.repo/*' -print
            exit 1
          }

          echo "FIPS module source: $FIPS_MODULE_SOURCE"
          echo "FIPS HMAC source: $FIPS_HMAC_SOURCE"
          echo "Postlink file: $POSTLINK_FILE"

          echo "$POSTLINK_FILE" > fips-postlink-path.txt

          echo
          echo "=== Verify HMAC postlink implementation ==="

          grep -n -A25 -B5 \
            'cmd_gen_hmac\|fips140.ko\|fips140_gen_hmac' \
            "$POSTLINK_FILE"

          grep -q 'fips140_gen_hmac' "$POSTLINK_FILE"
          grep -q 'fips140.ko' "$POSTLINK_FILE"

          echo
          echo "=== Existing Shusky KMI configuration ==="

          grep -n -A5 -B5 \
            'kmi_symbol_list' \
            private/devices/google/shusky/BUILD.bazel || true

          echo
          echo "=== Repository status ==="
          repo status

      - name: Create safe baseline FIPS test defconfig
        shell: bash
        run: |
          set -euo pipefail
          cd workspace

          cat > private/devices/google/shusky/nethunter_defconfig <<'EOF'
          # NetHunter safe baseline with experimental FIPS 140 test
          # RTL8187 and MT76 intentionally excluded.
          # FIPS module collected as standalone build artifact only.

          CONFIG_MODULES=y
          CONFIG_MODVERSIONS=y
          CONFIG_WLAN=y
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_USB=y

          CONFIG_CRYPTO_FIPS140_MOD=m
          # CONFIG_MODULE_SIG_ALL is not set
          EOF

          cat private/devices/google/shusky/nethunter_defconfig

          grep -qx \
            'CONFIG_CRYPTO_FIPS140_MOD=m' \
            private/devices/google/shusky/nethunter_defconfig

          if grep -Eq \
            '^CONFIG_(RTL8187|MT76[^=]*)=(y|m)$' \
            private/devices/google/shusky/nethunter_defconfig; then
            echo "ERROR: Excluded wireless driver found."
            exit 1
          fi

      - name: Register FIPS Bazel configuration
        shell: bash
        run: |
          set -euo pipefail
          cd workspace

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("private/devices/google/shusky/BUILD.bazel")
          content = path.read_text()

          # 1. Register the custom defconfig.
          if '"nethunter_defconfig"' in content:
              raise SystemExit(
                  "ERROR: nethunter_defconfig already registered"
              )

          pattern = r'(?m)^(\s*)"shusky_defconfig",\s*$'
          matches = list(re.finditer(pattern, content))

          if len(matches) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one shusky_defconfig entry; "
                  f"found {len(matches)}"
              )

          match = matches[0]
          indent = match.group(1)

          replacement = (
              f'{indent}"shusky_defconfig",\n'
              f'{indent}"nethunter_defconfig",'
          )

          content = (
              content[:match.start()]
              + replacement
              + content[match.end():]
          )

          # 2. Preserve Pixel ABI and add FIPS ABI as an additional list.
          pixel_pattern = (
              r'(?m)^(\s*)kmi_symbol_list\s*=\s*'
              r'"//common:android/abi_gki_aarch64_pixel",\s*$'
          )

          pixel_matches = list(re.finditer(pixel_pattern, content))

          if len(pixel_matches) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one Pixel ABI declaration; "
                  f"found {len(pixel_matches)}"
              )

          if "additional_kmi_symbol_lists" in content:
              raise SystemExit(
                  "ERROR: additional_kmi_symbol_lists already exists. "
                  "Inspect BUILD.bazel before continuing."
              )

          match = pixel_matches[0]
          indent = match.group(1)

          replacement = (
              f'{match.group(0)}\n'
              f'{indent}additional_kmi_symbol_lists = [\n'
              f'{indent}    "//common:android/abi_gki_aarch64_fips140",\n'
              f'{indent}],'
          )

          content = (
              content[:match.start()]
              + replacement
              + content[match.end():]
          )

          # 3. Add the FIPS module to the Shusky module outputs.
          module_pattern = (
              r'(?m)^(\s*)module_outs\s*=\s*'
              r'ZUMA_MODULE_OUTS\s*,\s*$'
          )

          module_matches = list(re.finditer(module_pattern, content))

          if len(module_matches) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one "
                  "module_outs = ZUMA_MODULE_OUTS entry; "
                  f"found {len(module_matches)}"
              )

          match = module_matches[0]
          indent = match.group(1)

          replacement = (
              f'{indent}module_outs = '
              'ZUMA_MODULE_OUTS + ["crypto/fips140.ko"],'
          )

          content = (
              content[:match.start()]
              + replacement
              + content[match.end():]
          )

          path.write_text(content)

          print("OK: nethunter_defconfig registered.")
          print("OK: Pixel ABI retained.")
          print("OK: FIPS ABI added as additional KMI list.")
          print("OK: crypto/fips140.ko added to module_outs.")
          PY

          echo
          echo "=== Defconfig registration ==="
          grep -n -A5 -B3 \
            'nethunter_defconfig' \
            private/devices/google/shusky/BUILD.bazel

          echo
          echo "=== KMI ABI registration ==="
          grep -n -A8 -B3 \
            'kmi_symbol_list' \
            private/devices/google/shusky/BUILD.bazel

          echo
          echo "=== FIPS module output registration ==="
          grep -n -A2 -B2 \
            'crypto/fips140.ko' \
            private/devices/google/shusky/BUILD.bazel

      - name: Validate Bazel and source modifications
        shell: bash
        run: |
          set -euo pipefail
          cd workspace

          BUILD_FILE="private/devices/google/shusky/BUILD.bazel"
          DEFCONFIG="private/devices/google/shusky/nethunter_defconfig"

          grep -Fq \
            '"nethunter_defconfig"' "$BUILD_FILE"

          grep -Fq \
            'kmi_symbol_list = "//common:android/abi_gki_aarch64_pixel"' \
            "$BUILD_FILE"

          grep -Fq \
            '"//common:android/abi_gki_aarch64_fips140"' \
            "$BUILD_FILE"

          grep -Fq \
            'ZUMA_MODULE_OUTS + ["crypto/fips140.ko"]' \
            "$BUILD_FILE"

          grep -qx \
            'CONFIG_CRYPTO_FIPS140_MOD=m' "$DEFCONFIG"

          grep -q \
            'additional_kmi_symbol_lists' "$BUILD_FILE"

          python3 - <<'PY'
          from pathlib import Path
          import sys

          files = [
              Path("private/devices/google/shusky/BUILD.bazel"),
              Path("private/devices/google/shusky/nethunter_defconfig"),
          ]

          failed = False

          for path in files:
              data = path.read_bytes()

              if not data.endswith(b"\n"):
                  print(f"ERROR: Missing final newline: {path}")
                  failed = True

              for number, line in enumerate(
                  data.decode().splitlines(), 1
              ):
                  if line.rstrip(" \t") != line:
                      print(
                          f"ERROR: Trailing whitespace: "
                          f"{path}:{number}"
                      )
                      failed = True

                  if line.startswith(
                      ("<<<<<<< ", "=======", ">>>>>>> ")
                  ):
                      print(
                          f"ERROR: Conflict marker: "
                          f"{path}:{number}"
                      )
                      failed = True

          if failed:
              sys.exit(1)

          print("Bazel and source validation passed.")
          PY

          echo
          echo "=== Final Bazel changes ==="
          git diff -- private/devices/google/shusky/BUILD.bazel

      - name: Build Shusky FIPS test kernel
        shell: bash
        run: |
          set -euo pipefail
          cd workspace

          mkdir -p build-report

          {
            echo "Build started: $(date -u)"
            echo "Device: $DEVICE"
            echo "Kernel target: $KERNEL_DEVICE"
            echo "Kernel version label: $CUSTOM_KERNEL_VERSION"
            echo "Target: //private/devices/google/shusky:zuma_shusky_dist"
            echo "Build type: SAFE BASELINE + FIPS BUILD TEST"
            echo "RTL8187: EXCLUDED"
            echo "MT76: EXCLUDED"
            echo "Pixel ABI: ENABLED"
            echo "Additional FIPS ABI: ENABLED"
            echo "Strict KMI enforcement: NOT DISABLED"
            echo "KernelSU inline: DISABLED"
            echo "FIPS crypto module: BUILD OUTPUT"
            echo "FIPS HMAC postlink: SOURCE VERIFIED"
            echo "Flash operations: NONE"
          } | tee build-report/build-status.txt

          ./private/devices/google/shusky/build_shusky.sh \
            --kernel_package=@//aosp \
            --//build/kernel/kleaf:use_prebuilt_gki=false \
            --no//private/devices/google/common:download_prebuilt_gki_fips140 \
            --verbose_failures \
            2>&1 | tee build-report/build.log

      - name: Collect build diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          cd workspace

          mkdir -p build-report/diagnostics
          mkdir -p build-report/symbols

          if [ -d out/shusky/dist ]; then
            find out/shusky/dist -maxdepth 4 -type f \
              -print \
              > build-report/diagnostics/dist-files.txt
          else
            echo "Dist directory not found." \
              > build-report/diagnostics/dist-files.txt
          fi

          if [ -f build-report/build.log ]; then
            grep -n -A60 -B5 \
              'kmi_symbol_list_violations' \
              build-report/build.log || true

            grep -n -A60 -B5 \
              'missing from the symbol list' \
              build-report/build.log || true

            grep -n -i -E \
              'error:|failed|fatal|HMAC|fips140|KMI' \
              build-report/build.log \
              | tail -n 300 || true
          fi

          find . -type f \
            -name Module.symvers \
            -not -path '*/.git/*' \
            -not -path '*/.repo/*' \
            -print \
            > build-report/symbols/module-symvers-files.txt

          find out common -type f \
            \( \
              -name abi_symbollist.raw \
              -o -name abi_gki_protected_exports_aarch64 \
              -o -name '*abi*' \
            \) \
            -not -path '*/.git/*' \
            -not -path '*/.repo/*' \
            -print 2>/dev/null \
            > build-report/diagnostics/abi-files.txt

      - name: Analyze exported symbols and ABI
        if: always()
        shell: bash
        run: |
          set +e
          cd workspace

          mkdir -p build-report/symbol-analysis

          REPORT="build-report/symbol-analysis"
          MANIFEST="build-report/symbols/module-symvers-files.txt"

          SYMBOLS='__dev_kfree_skb_irq|__ioread32_copy|__iowrite32_copy|dev_set_threaded|of_get_mac_address|pci_disable_link_state|pcie_capability_clear_and_set_word|radix_tree_tagged|rfkill_pause_polling|sched_set_fifo_low|skb_to_sgvec|skb_unlink|usb_alloc_urb|usb_anchor_urb|usb_bulk_msg|usb_control_msg|usb_deregister|usb_free_urb|usb_get_dev|usb_init_urb|usb_kill_anchored_urbs|usb_kill_urb|usb_poison_urb|usb_put_dev|usb_register_driver|usb_reset_device|usb_submit_urb|usb_unanchor_urb|usb_unpoison_urb|__traceiter_android_vh_sha256|__traceiter_android_vh_aes_expandkey|__traceiter_android_vh_aes_encrypt|__traceiter_android_vh_aes_decrypt|__tracepoint_android_vh_sha256|__tracepoint_android_vh_aes_expandkey|__tracepoint_android_vh_aes_encrypt|__tracepoint_android_vh_aes_decrypt|aead_register_instance|ahash_register_instance|cpu_have_feature|crypto_ahash_finup|crypto_ahash_setkey|crypto_alg_list|crypto_alg_sem|crypto_alloc_rng|crypto_attr_alg_name|crypto_check_attr_type|crypto_cipher_encrypt_one|crypto_cipher_setkey|crypto_drop_spawn|crypto_get_default_null_skcipher|crypto_grab_aead|crypto_grab_ahash|crypto_grab_shash|crypto_grab_skcipher|crypto_grab_spawn|crypto_inst_setname|crypto_put_default_null_skcipher|crypto_register_aead|crypto_register_aeads|crypto_register_ahash|crypto_register_ahashes|crypto_register_alg|crypto_register_algs|crypto_register_rng|crypto_register_rngs|crypto_register_shashes|crypto_register_skcipher|crypto_register_skciphers|crypto_register_template|crypto_register_templates|crypto_remove_spawns|crypto_rng_reset|crypto_shash_alg_has_setkey|crypto_shash_tfm_digest|crypto_spawn_tfm|crypto_spawn_tfm2|crypto_unregister_aead|crypto_unregister_alg|crypto_unregister_rng|crypto_unregister_rngs|crypto_unregister_shashes|crypto_unregister_skciphers|crypto_unregister_template|crypto_unregister_templates|fpsimd_context_busy|irq_stat|kernel_neon_begin|kernel_neon_end|rng_is_initialized|scatterwalk_ffwd|scatterwalk_map_and_copy|shash_free_singlespawn_instance|shash_register_instance|skcipher_alloc_instance_simple|skcipher_register_instance|skcipher_walk_aead_decrypt|skcipher_walk_aead_encrypt|skcipher_walk_done|skcipher_walk_virt'

          : > "$REPORT/module-symbols.txt"
          : > "$REPORT/abi-symbols.txt"

          if [ -s "$MANIFEST" ]; then
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              [ -f "$file" ] || continue

              {
                echo
                echo "===== $file ====="
                grep -nE \
                  "^[^[:space:]]+[[:space:]]+(${SYMBOLS})[[:space:]]" \
                  "$file" || true
              } >> "$REPORT/module-symbols.txt"
            done < "$MANIFEST"
          else
            echo "No Module.symvers files found." \
              > "$REPORT/module-symbols.txt"
          fi

          ABI_FILES="build-report/diagnostics/abi-files.txt"

          if [ -s "$ABI_FILES" ]; then
            while IFS= read -r file; do
              [ -f "$file" ] || continue

              {
                echo
                echo "===== $file ====="
                grep -nE \
                  "^(${SYMBOLS})([[:space:]]|$)" \
                  "$file" || true
              } >> "$REPORT/abi-symbols.txt"
            done < "$ABI_FILES"
          else
            echo "No ABI files found." \
              > "$REPORT/abi-symbols.txt"
          fi

          echo "=== Module symbol matches ==="
          cat "$REPORT/module-symbols.txt"

          echo "=== ABI symbol matches ==="
          cat "$REPORT/abi-symbols.txt"

      - name: Verify final kernel configuration
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd workspace

          CONFIG=""

          while IFS= read -r candidate; do
            if grep -qx \
              'CONFIG_CRYPTO_FIPS140_MOD=m' "$candidate"; then
              CONFIG="$candidate"
              break
            fi
          done < <(
            find out/shusky -type f \
              -name .config -print 2>/dev/null
          )

          if [ -z "$CONFIG" ]; then
            echo "ERROR: No Shusky .config with FIPS enabled found."
            find out -type f -name .config -print || true
            exit 1
          fi

          echo "Using config: $CONFIG"
          cp "$CONFIG" build-report/final.config

          {
            echo "=== Required configuration ==="

            for option in \
              CONFIG_MODULES \
              CONFIG_MODVERSIONS \
              CONFIG_ANDROID_VENDOR_HOOKS \
              CONFIG_ARM64_MODULE_PLTS \
              CONFIG_WLAN \
              CONFIG_CFG80211 \
              CONFIG_MAC80211 \
              CONFIG_USB \
              CONFIG_CRYPTO_FIPS140_MOD \
              CONFIG_CRYPTO_FIPS140_MERGE_MOD_SECTIONS \
              CONFIG_CRYPTO_FIPS140_MOD_EVAL_TESTING \
              CONFIG_MODULE_SIG_ALL \
              CONFIG_KSU \
              CONFIG_RTL8187 \
              CONFIG_MT76_CORE \
              CONFIG_MT76_USB \
              CONFIG_MT76x2U
            do
              grep -E "^${option}=" "$CONFIG" || true
              grep -E "^# ${option} is not set$" "$CONFIG" || true
            done
          } | tee build-report/config-check.txt

          check_config() {
            option="$1"
            expected="$2"

            grep -qx "${option}=${expected}" "$CONFIG" || {
              echo "ERROR: ${option} is not ${expected}"
              exit 1
            }
          }

          check_config CONFIG_MODULES y
          check_config CONFIG_MODVERSIONS y
          check_config CONFIG_ANDROID_VENDOR_HOOKS y
          check_config CONFIG_ARM64_MODULE_PLTS y
          check_config CONFIG_WLAN y
          check_config CONFIG_CFG80211 m
          check_config CONFIG_MAC80211 m
          check_config CONFIG_USB y
          check_config CONFIG_CRYPTO_FIPS140_MOD m
          check_config CONFIG_CRYPTO_FIPS140_MERGE_MOD_SECTIONS y

          if grep -Eq \
            '^CONFIG_(RTL8187|MT76[^=]*)=(y|m)$' "$CONFIG"; then
            echo "ERROR: RTL8187 or MT76 unexpectedly enabled."
            exit 1
          fi

          if grep -Eq '^CONFIG_KSU=(y|m)$' "$CONFIG"; then
            echo "ERROR: KernelSU unexpectedly built into kernel."
            exit 1
          fi

          if grep -Eq \
            '^CONFIG_(CRYPTO_FIPS140_MOD_EVAL_TESTING|MODULE_SIG_ALL)=(y|m)$' \
            "$CONFIG"; then
            echo "ERROR: Unexpected FIPS evaluation or module signing configuration."
            exit 1
          fi

          echo "FIPS and baseline configuration checks passed."

      - name: Verify FIPS module and integrity postlink
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd workspace

          mkdir -p build-report/fips

          FIPS_MODULE="$(find out -type f \
            -path '*/crypto/fips140.ko' \
            -print -quit)"

          if [ -z "$FIPS_MODULE" ]; then
            echo "ERROR: crypto/fips140.ko not found."
            find out -type f -name '*fips140*' -print || true
            exit 1
          fi

          echo "Found: $FIPS_MODULE"
          cp "$FIPS_MODULE" build-report/fips/fips140.ko

          modinfo build-report/fips/fips140.ko \
            | tee build-report/fips/modinfo.txt

          modinfo -F vermagic \
            build-report/fips/fips140.ko \
            | tee build-report/fips/vermagic.txt

          readelf -SW build-report/fips/fips140.ko \
            | tee build-report/fips/sections.txt

          grep -q '\.init\.rela\.text' \
            build-report/fips/sections.txt || {
              echo "ERROR: .init.rela.text missing."
              exit 1
            }

          grep -q '\.init\.rela\.rodata' \
            build-report/fips/sections.txt || {
              echo "ERROR: .init.rela.rodata missing."
              exit 1
            }

          POSTLINK_FILE="$(cat fips-postlink-path.txt)"

          {
            echo "Postlink source: $POSTLINK_FILE"
            echo
            echo "=== HMAC generator references in build log ==="

            grep -n -i -E \
              'HMAC.*fips140\.ko|fips140_gen_hmac' \
              build-report/build.log || true

            echo
            echo "=== HMAC generator references in generated command files ==="

            find out -type f \
              \( -name '*.cmd' -o -name '*log*' \) \
              -not -path '*/.git/*' \
              -exec grep -n -H -i \
                'fips140_gen_hmac\|gen_hmac' {} \; \
              2>/dev/null || true

            echo
            echo "=== Postlink source rule ==="

            grep -n -A25 -B5 \
              'cmd_gen_hmac\|fips140.ko\|fips140_gen_hmac' \
              "$POSTLINK_FILE" || true
          } | tee build-report/fips/hmac-postlink.txt

          sha256sum build-report/fips/fips140.ko \
            | tee build-report/fips/sha256.txt

          echo "ELF relocation section checks passed."
          echo "HMAC execution evidence collected for review."

      - name: Verify kernel image and baseline modules
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd workspace

          DIST="out/shusky/dist"

          test -d "$DIST" || {
            echo "ERROR: Expected dist directory not found."
            find out/shusky -maxdepth 4 -type f -print || true
            exit 1
          }

          IMAGE="$(find "$DIST" -type f \
            \( -name Image.lz4 -o -name Image \) \
            -print -quit)"

          test -n "$IMAGE" || {
            echo "ERROR: No Image or Image.lz4 found."
            find "$DIST" -maxdepth 4 -type f -print
            exit 1
          }

          file "$IMAGE"
          sha256sum "$IMAGE"

          mkdir -p build-report/modules
          : > build-report/module-list.txt

          for module in cfg80211.ko mac80211.ko; do
            FOUND="$(find out -type f \
              -path '*shusky*' \
              -name "$module" \
              -print -quit)"

            if [ -z "$FOUND" ]; then
              echo "ERROR: $module was not found."
              find out -type f -name "$module" -print || true
              exit 1
            fi

            echo "$FOUND" | tee -a build-report/module-list.txt
            cp "$FOUND" "build-report/modules/$module"
          done

          if find out/shusky -type f \
            \( \
              -name 'rtl8187.ko' \
              -o -name 'mt76.ko' \
              -o -name 'mt76-usb.ko' \
              -o -name 'mt76x02-lib.ko' \
              -o -name 'mt76x02-usb.ko' \
              -o -name 'mt76x2-common.ko' \
              -o -name 'mt76x2u.ko' \
            \) | grep .; then
            echo "ERROR: An excluded wireless driver was found."
            exit 1
          fi

          echo "Excluded wireless modules are absent."
          echo "Kernel image and baseline modules verified."

      - name: Collect module metadata
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd workspace

          {
            echo "=== Kernel image ==="
            find out/shusky/dist -type f \
              \( -name Image -o -name Image.lz4 \) \
              -exec file {} \; \
              -exec sha256sum {} \;

            echo
            echo "=== Module metadata ==="

            for module in build-report/modules/*.ko \
                          build-report/fips/fips140.ko; do
              [ -f "$module" ] || continue

              echo
              echo "FILE: $module"
              modinfo "$module" || true
              echo "VERMAGIC:"
              modinfo -F vermagic "$module" || true
              echo "DEPENDS:"
              modinfo -F depends "$module" || true
              echo "NAME:"
              modinfo -F name "$module" || true
              echo "IMPORT_NS:"
              modinfo -F import_ns "$module" || true
              sha256sum "$module"
            done
          } | tee build-report/module-metadata.txt

          for module in build-report/modules/*.ko \
                        build-report/fips/fips140.ko; do
            [ -f "$module" ] || continue
            printf '%s: ' "$(basename "$module")"
            modinfo -F vermagic "$module" || true
          done > build-report/vermagic-check.txt

      - name: Inspect vendor_dlkm output
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd workspace

          mkdir -p build-report/vendor_dlkm

          find out/shusky/dist -type f \
            \( \
              -name 'vendor_dlkm.img' \
              -o -name '*vendor_dlkm*' \
              -o -name '*modules*' \
            \) \
            -print \
            > build-report/vendor_dlkm/files.txt

          cat build-report/vendor_dlkm/files.txt

          while IFS= read -r image; do
            [ -f "$image" ] || continue
            cp "$image" build-report/vendor_dlkm/
            file "$image"
            sha256sum "$image"
          done < build-report/vendor_dlkm/files.txt

          echo "Image inventory collected."
          echo "No image is flashed or installed."

      - name: Create build report
        if: always()
        shell: bash
        run: |
          set +e
          cd workspace

          mkdir -p build-report

          {
            echo "=== Build information ==="
            date -u

            echo
            echo "=== Build status ==="
            cat build-report/build-status.txt 2>/dev/null || true

            echo
            echo "=== Build result ==="
            if [ -f build-report/build.log ]; then
              echo "Check GitHub Actions job result for authoritative build status."
            else
              echo "Build log not found."
            fi

            echo
            echo "=== Dist contents ==="
            if [ -d out/shusky/dist ]; then
              find out/shusky/dist -type f -print
            else
              echo "Dist directory not found."
            fi

            echo
            echo "=== FIPS verification ==="
            for file in \
              build-report/fips/modinfo.txt \
              build-report/fips/vermagic.txt \
              build-report/fips/sections.txt \
              build-report/fips/hmac-postlink.txt \
              build-report/fips/sha256.txt
            do
              if [ -f "$file" ]; then
                echo
                echo "--- $file ---"
                cat "$file"
              fi
            done

            echo
            echo "=== FIPS symbol analysis ==="
            cat build-report/symbol-analysis/module-symbols.txt 2>/dev/null || true
            cat build-report/symbol-analysis/abi-symbols.txt 2>/dev/null || true

            echo
            echo "=== Config check ==="
            cat build-report/config-check.txt 2>/dev/null || true

            echo
            echo "=== KMI markers ==="
            find out -type f \
              \( \
                -name '*kmi_symbol_list*checked*' \
                -o -name '*kmi*violations*' \
              \) \
              -print 2>/dev/null || true

            echo
            echo "=== Disk space ==="
            df -h
          } > build-report/build-report.txt

          cat build-report/build-report.txt

      - name: Upload Shiba NetHunter FIPS build-test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiba-nethunter-fips-build-test
          path: |
            workspace/out/shusky/dist/
            workspace/build-report/
          if-no-files-found: warn
          retention-days: 14
