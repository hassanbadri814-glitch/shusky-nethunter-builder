            "CONFIG_WLAN=y"
            "CONFIG_CFG80211=m"
            "CONFIG_MAC80211=m"
            "CONFIG_USB=y"
            "CONFIG_WLAN_VENDOR_REALTEK=y"
            "CONFIG_RTL8187=m"
            "CONFIG_EEPROM_93CX6=m"
