
      - name: Verify native FIPS source and ABI files
        shell: bash
        run: |
          set -euo pipefail
          cd workspace

          echo "=== Locate native kernel common source ==="

          COMMON_DIR=""

          while IFS= read -r candidate; do
            candidate="${candidate%/crypto/Kconfig}"

            if [ -f "$candidate/crypto/Makefile" ] &&
               [ -f "$candidate/arch/arm64/Makefile.postlink" ] &&
               [ -f "$candidate/crypto/fips140-module.c" ] &&
               [ -f "$candidate/crypto/fips140_gen_hmac.c" ]; then
              COMMON_DIR="$candidate"
              break
            fi
          done < <(
            find . -type f -path '*/crypto/Kconfig' \
              -not -path '*/.git/*' \
              -not -path '*/.repo/*' \
              -print
          )

          if [ -z "$COMMON_DIR" ]; then
            echo "ERROR: Native FIPS kernel source not found."
            exit 1
          fi

          echo "COMMON_DIR=$COMMON_DIR" >> "$GITHUB_ENV"
          echo "FOUND: $COMMON_DIR"

          echo
          echo "=== Verify native FIPS files ==="

          for file in \
            crypto/Kconfig \
            crypto/Makefile \
            crypto/fips140-module.c \
            crypto/fips140_gen_hmac.c \
            arch/arm64/Makefile.postlink
          do
            test -f "$COMMON_DIR/$file" || {
              echo "ERROR: Missing $COMMON_DIR/$file"
              exit 1
            }
            echo "FOUND: $COMMON_DIR/$file"
          done

          echo
          echo "=== Locate ABI files ==="

          PIXEL_ABI="$(
            find . -type f -name abi_gki_aarch64_pixel \
              -not -path '*/.git/*' \
              -not -path '*/.repo/*' \
              -print -quit
          )"

          FIPS_ABI="$(
            find . -type f -name abi_gki_aarch64_fips140 \
              -not -path '*/.git/*' \
              -not -path '*/.repo/*' \
              -print -quit
          )"

          test -n "$PIXEL_ABI" || {
            echo "ERROR: Pixel ABI file not found."
            exit 1
          }

          test -n "$FIPS_ABI" || {
            echo "ERROR: FIPS ABI file not found."
            exit 1
          }

          echo "Pixel ABI: $PIXEL_ABI"
          echo "FIPS ABI: $FIPS_ABI"

          echo
          echo "=== FIPS Kconfig ==="
          grep -n -A12 -B3 'CRYPTO_FIPS140_MOD' \
            "$COMMON_DIR/crypto/Kconfig"

          echo
          echo "=== FIPS Makefile ==="
          grep -n -A12 -B3 'fips140' \
            "$COMMON_DIR/crypto/Makefile"

          echo
          echo "=== HMAC postlink ==="
          grep -n -A25 -B5 \
            'cmd_gen_hmac\|fips140.ko\|fips140_gen_hmac' \
            "$COMMON_DIR/arch/arm64/Makefile.postlink"

          grep -q 'fips140_gen_hmac' \
            "$COMMON_DIR/arch/arm64/Makefile.postlink"

          grep -q 'fips140.ko' \
            "$COMMON_DIR/arch/arm64/Makefile.postlink"

          echo
          echo "=== ABI sizes ==="
          wc -l "$PIXEL_ABI" "$FIPS_ABI"

          echo
          echo "=== Shusky build files ==="

          for file in \
            private/devices/google/shusky/BUILD.bazel \
            private/devices/google/shusky/build_shusky.sh \
            private/devices/google/zuma/BUILD.bazel
          do
            test -f "$file" || {
              echo "ERROR: Missing $file"
              exit 1
            }
            echo "FOUND: $file"
          done
