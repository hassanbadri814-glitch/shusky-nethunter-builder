
      - name: Diagnose Shusky vendor ramdisk BUILD structure
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          BUILD="private/devices/google/shusky/BUILD.bazel"

          echo "=== Vendor ramdisk references ==="

          grep -n -i -B12 -A25 \
            'vendor_ramdisk\|modules_list\|create_file' \
            "$BUILD" \
            | tee "$REPORT_DIR/shusky-ramdisk-build.txt"

          echo
          echo "=== Exact BUILD file section ==="

          sed -n '1,260p' "$BUILD"

          echo
          echo "=== Zuma ramdisk definitions ==="

          grep -Rni -B5 -A12 \
            'vendor_ramdisk.modules.zuma\|vendor_ramdisk_modules_list' \
            private/devices/google/zuma \
            private/devices/google/shusky \
            | tee "$REPORT_DIR/ramdisk-definitions.txt"
