
      - name: Analyze exported symbols and ABI list
        if: always()
        run: |
          cd workspace

          mkdir -p build-report/symbol-analysis

          SYMBOLS='__dev_kfree_skb_irq|__ioread32_copy|__iowrite32_copy|dev_set_threaded|of_get_mac_address|pci_disable_link_state|pcie_capability_clear_and_set_word|radix_tree_tagged|rfkill_pause_polling|sched_set_fifo_low|skb_to_sgvec|skb_unlink|usb_alloc_urb|usb_anchor_urb|usb_bulk_msg|usb_control_msg|usb_deregister|usb_free_urb|usb_get_dev|usb_init_urb|usb_kill_anchored_urbs|usb_kill_urb|usb_poison_urb|usb_put_dev|usb_register_driver|usb_reset_device|usb_submit_urb|usb_unanchor_urb|usb_unpoison_urb'

          : > build-report/symbol-analysis/module-symbols.txt

          echo "=== Searching Module.symvers files ==="

          GKI_SYMVERS=$(find out -type f \
            -path "*/aosp/kernel_aarch64/Module.symvers" \
            -print -quit 2>/dev/null || true)

          SHUSKY_SYMVERS=$(find out -type f \
            -path "*/shusky/kernel/Module.symvers" \
            -print -quit 2>/dev/null || true)

          for file in "$GKI_SYMVERS" "$SHUSKY_SYMVERS"; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              {
                echo "=== $file ==="

                grep -E \
                  "^[^[:space:]]+[[:space:]]+(${SYMBOLS})[[:space:]]" \
                  "$file" || true

              } | tee -a build-report/symbol-analysis/module-symbols.txt
            else
              echo "MODULE.SYMVERS NOT FOUND" \
                | tee -a build-report/symbol-analysis/module-symbols.txt
            fi
          done

          echo "=== Searching ABI symbol lists ==="

          find out -type f \
            -name abi_symbollist.raw \
            -print \
            > build-report/symbol-analysis/abi-files.txt

          if [ ! -s build-report/symbol-analysis/abi-files.txt ]; then
            echo "No abi_symbollist.raw found." \
              | tee build-report/symbol-analysis/abi-symbols.txt
          else
            while IFS= read -r file; do
              [ -f "$file" ] || continue

              {
                echo "=== $file ==="

                grep -nE "^(${SYMBOLS})$" "$file" || true

              } | tee -a build-report/symbol-analysis/abi-symbols.txt

            done < build-report/symbol-analysis/abi-files.txt
          fi

          echo "Symbol analysis completed."
