
name: Build Pixel 8 Shiba - NetHunter Safe Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shiba-nethunter-kernel-build
  cancel-in-progress: false

jobs:
  build-kernel:
    name: Build and verify Shiba safe baseline kernel
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEVICE: shiba
      KERNEL_DEVICE: shusky
      CUSTOM_KERNEL_VERSION: "1.33"

    steps:
      # ================================================
      # 1. Prepare GitHub runner
      # ================================================

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python3-pip python-is-python3 \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves zip unzip rsync ccache file \
            kmod xz-utils zstd

      - name: Install Android repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # ================================================
      # 2. Initialize official Google source
      # ================================================

      - name: Initialize Google kernel repository
        run: |
          mkdir -p workspace
          cd workspace

          repo init \
            --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-shusky-6.1-android16

      # ================================================
      # 3. Sync Google kernel source
      # ================================================

      - name: Sync Google kernel source
        timeout-minutes: 120
        run: |
          cd workspace

          repo sync \
            --current-branch \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2 \
            --fail-fast

      # ================================================
      # 4. Verify Google source tree
      # ================================================

      - name: Verify Google kernel source
        run: |
          cd workspace

          test -f private/devices/google/shusky/BUILD.bazel
          test -f private/devices/google/zuma/constants.bzl
          test -f private/devices/google/shusky/build_shusky.sh
          test -f common/android/abi_gki_aarch64_pixel

          echo "Official Google Shusky source tree verified."
          echo "Device: $DEVICE"
          echo "Kernel target: $KERNEL_DEVICE"
          repo status

      # ================================================
      # 5. Create safe NetHunter baseline defconfig
      # ================================================

      - name: Create safe baseline defconfig
        run: |
          cd workspace

          cat > private/devices/google/shusky/nethunter_defconfig <<'EOF'
          # NetHunter safe baseline
          # External RTL8187 and MT76 drivers are intentionally excluded.

          CONFIG_WLAN=y
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_USB=y
          EOF

          echo "=== Safe baseline defconfig ==="
          cat private/devices/google/shusky/nethunter_defconfig

          if grep -Eq \
            'CONFIG_RTL8187=|CONFIG_MT76[^=]*=' \
            private/devices/google/shusky/nethunter_defconfig; then
            echo "ERROR: Excluded wireless driver found in defconfig."
            exit 1
          fi

      # ================================================
      # 6. Register NetHunter defconfig
      # ================================================

      - name: Register safe baseline defconfig
        run: |
          cd workspace

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("private/devices/google/shusky/BUILD.bazel")
          content = path.read_text()

          if '"nethunter_defconfig"' in content:
              raise SystemExit(
                  "ERROR: nethunter_defconfig already registered"
              )

          pattern = r'(?m)^(\s*)"shusky_defconfig",\s*$'
          matches = list(re.finditer(pattern, content))

          if len(matches) != 1:
              raise SystemExit(
                  f"Expected one shusky_defconfig entry, found {len(matches)}"
              )

          match = matches[0]
          indent = match.group(1)

          replacement = (
              f'{indent}"shusky_defconfig",\n'
              f'{indent}"nethunter_defconfig",'
          )

          content = (
              content[:match.start()]
              + replacement
              + content[match.end():]
          )

          path.write_text(content)
          print("Safe baseline defconfig registered.")
          PY

      # ================================================
      # 7. Validate source modifications
      # ================================================

      - name: Validate source modifications
        run: |
          cd workspace

          echo "=== Registered defconfig ==="
          grep -n -A8 -B4 \
            nethunter_defconfig \
            private/devices/google/shusky/BUILD.bazel

          echo
          echo "=== Existing Google module outputs ==="
          grep -n -A15 -B3 \
            'net/wireless/cfg80211.ko' \
            private/devices/google/zuma/constants.bzl

          echo
          echo "=== Verify excluded drivers are not registered ==="

          if grep -nE \
            'rtl8187|mt76|eeprom_93cx6' \
            private/devices/google/zuma/constants.bzl; then
            echo "ERROR: Excluded wireless module found in module outputs."
            exit 1
          fi

          echo "No RTL8187 or MT76 modules registered by this workflow."

          echo
          echo "=== Whitespace and conflict checks ==="

          python3 - <<'PY'
          from pathlib import Path
          import sys

          files = [
              Path("private/devices/google/shusky/BUILD.bazel"),
              Path("private/devices/google/shusky/nethunter_defconfig"),
          ]

          failed = False

          for path in files:
              data = path.read_bytes()

              if not data.endswith(b"\n"):
                  print(f"ERROR: Missing final newline: {path}")
                  failed = True

              for number, line in enumerate(
                  data.decode().splitlines(), 1
              ):
                  if line.rstrip(" \t") != line:
                      print(
                          f"ERROR: Trailing whitespace: "
                          f"{path}:{number}"
                      )
                      failed = True

                  if (
                      line.startswith("<<<<<<< ")
                      or line.startswith("=======")
                      or line.startswith(">>>>>>> ")
                  ):
                      print(
                          f"ERROR: Conflict marker: "
                          f"{path}:{number}"
                      )
                      failed = True

          if failed:
              sys.exit(1)

          print("Source validation passed.")
          PY

      # ================================================
      # 8. Build official Shusky target
      # ================================================

      - name: Build Shusky safe baseline kernel
        run: |
          cd workspace

          mkdir -p build-report

          {
            echo "Build started: $(date -u)"
            echo "Device: $DEVICE"
            echo "Kernel target: $KERNEL_DEVICE"
            echo "Kernel version: $CUSTOM_KERNEL_VERSION"
            echo "Target: //private/devices/google/shusky:zuma_shusky_dist"
            echo "Build type: SAFE BASELINE"
            echo "RTL8187: EXCLUDED"
            echo "MT76: EXCLUDED"
            echo "Strict Pixel KMI: ENABLED"
            echo "KernelSU inline: DISABLED"
            echo "Flash operations: NONE"
          } | tee build-report/build-status.txt

          set -euo pipefail

          ./private/devices/google/shusky/build_shusky.sh \
            --kernel_package=@//aosp \
            --//build/kernel/kleaf:use_prebuilt_gki=false \
            --no//private/devices/google/common:download_prebuilt_gki_fips140 \
            --verbose_failures \
            2>&1 | tee build-report/build.log

      # ================================================
      # 9. Collect diagnostics, even after build failure
      # ================================================

      - name: Collect build diagnostics
        if: always()
        run: |
          cd workspace

          mkdir -p build-report/diagnostics
          mkdir -p build-report/symbols

          echo "=== Dist directory ==="

          if [ -d out/shusky/dist ]; then
            find out/shusky/dist -maxdepth 3 -type f \
              -print \
              | tee build-report/diagnostics/dist-files.txt
          else
            echo "Dist directory not found." \
              | tee build-report/diagnostics/dist-files.txt
          fi

          echo
          echo "=== Relevant build errors ==="

          if [ -f build-report/build.log ]; then
            grep -n -A60 -B5 \
              'kmi_symbol_list_violations' \
              build-report/build.log || true

            grep -n -A60 -B5 \
              'missing from the symbol list' \
              build-report/build.log || true

            grep -n -i -E \
              'error:|failed|fatal' \
              build-report/build.log \
              | tail -n 150 || true
          fi

          echo
          echo "=== Module.symvers manifest ==="

          find . -type f \
            -name Module.symvers \
            -not -path '*/.git/*' \
            -not -path '*/.repo/*' \
            -print \
            > build-report/symbols/module-symvers-files.txt || true

          cat build-report/symbols/module-symvers-files.txt

          echo
          echo "=== ABI and KMI files ==="

          find out -type f \
            \( \
              -name abi_symbollist.raw \
              -o -name abi_gki_protected_exports_aarch64 \
              -o -name '*abi*' \
            \) \
            -not -path '*/.git/*' \
            -print 2>/dev/null \
            > build-report/diagnostics/abi-files.txt || true

          cat build-report/diagnostics/abi-files.txt

          echo
          echo "Diagnostics collection completed."

      # ================================================
      # 10. Analyze Module.symvers and ABI symbols
      # ================================================

      - name: Analyze exported symbols and ABI
        if: always()
        run: |
          cd workspace

          mkdir -p build-report/symbol-analysis

          REPORT="build-report/symbol-analysis"
          MANIFEST="build-report/symbols/module-symvers-files.txt"

          SYMBOLS='__dev_kfree_skb_irq|__ioread32_copy|__iowrite32_copy|dev_set_threaded|of_get_mac_address|pci_disable_link_state|pcie_capability_clear_and_set_word|radix_tree_tagged|rfkill_pause_polling|sched_set_fifo_low|skb_to_sgvec|skb_unlink|usb_alloc_urb|usb_anchor_urb|usb_bulk_msg|usb_control_msg|usb_deregister|usb_free_urb|usb_get_dev|usb_init_urb|usb_kill_anchored_urbs|usb_kill_urb|usb_poison_urb|usb_put_dev|usb_register_driver|usb_reset_device|usb_submit_urb|usb_unanchor_urb|usb_unpoison_urb'

          : > "$REPORT/module-symbols.txt"
          : > "$REPORT/abi-symbols.txt"

          echo "=== Module.symvers analysis ==="

          if [ -s "$MANIFEST" ]; then
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              [ -f "$file" ] || continue

              {
                echo
                echo "===== $file ====="

                grep -nE \
                  "^[^[:space:]]+[[:space:]]+(${SYMBOLS})[[:space:]]" \
                  "$file" || true

              } >> "$REPORT/module-symbols.txt"

            done < "$MANIFEST"
          else
            echo "No Module.symvers files found." \
              > "$REPORT/module-symbols.txt"
          fi

          echo
          echo "=== ABI symbol analysis ==="

          ABI_FILES="build-report/diagnostics/abi-files.txt"

          if [ -s "$ABI_FILES" ]; then
            while IFS= read -r file; do
              [ -f "$file" ] || continue

              {
                echo
                echo "===== $file ====="

                grep -nE \
                  "^(${SYMBOLS})([[:space:]]|$)" \
                  "$file" || true

              } >> "$REPORT/abi-symbols.txt"

            done < "$ABI_FILES"
          else
            echo "No ABI files found." \
              > "$REPORT/abi-symbols.txt"
          fi

          echo
          echo "=== Module symbol matches ==="
          cat "$REPORT/module-symbols.txt"

          echo
          echo "=== ABI symbol matches ==="
          cat "$REPORT/abi-symbols.txt"

      # ================================================
      # 11. Verify final kernel configuration
      # ================================================

      - name: Verify final kernel configuration
        if: success()
        run: |
          cd workspace

          DIST="out/shusky/dist"
          CONFIG=""

          if [ -f "$DIST/.config" ]; then
            CONFIG="$DIST/.config"
          else
            CONFIG="$(find out/bazel -type f \
              -path '*/private/devices/google/shusky/kernel/.config' \
              -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$CONFIG" ] || [ ! -f "$CONFIG" ]; then
            echo "ERROR: Final kernel .config not found."
            find out -type f -name .config -print || true
            exit 1
          fi

          cp "$CONFIG" build-report/final.config

          {
            echo "=== Required baseline configuration ==="

            for option in \
              CONFIG_MODULES \
              CONFIG_MODVERSIONS \
              CONFIG_WLAN \
              CONFIG_CFG80211 \
              CONFIG_MAC80211 \
              CONFIG_USB \
              CONFIG_KSU \
              CONFIG_RTL8187 \
              CONFIG_MT76_CORE \
              CONFIG_MT76_USB \
              CONFIG_MT76x2U
            do
              grep -E "^${option}=" "$CONFIG" || true
              grep -E "^# ${option} is not set$" "$CONFIG" || true
            done

          } | tee build-report/config-check.txt

          check_config() {
            option="$1"
            expected="$2"

            if ! grep -qx "${option}=${expected}" "$CONFIG"; then
              echo "ERROR: ${option} is not ${expected}"
              exit 1
            fi
          }

          check_config CONFIG_MODULES y
          check_config CONFIG_MODVERSIONS y
          check_config CONFIG_WLAN y
          check_config CONFIG_CFG80211 m
          check_config CONFIG_MAC80211 m
          check_config CONFIG_USB y

          if grep -Eq \
            '^CONFIG_(RTL8187|MT76[^=]*)=(y|m)$' \
            "$CONFIG"; then
            echo "ERROR: RTL8187 or MT76 unexpectedly enabled."
            exit 1
          fi

          if grep -Eq '^CONFIG_KSU=(y|m)$' "$CONFIG"; then
            echo "ERROR: KernelSU unexpectedly built into kernel."
            exit 1
          fi

          echo "Baseline configuration checks passed."

      # ================================================
      # 12. Verify kernel image and baseline modules
      # ================================================

      - name: Verify kernel image and baseline modules
        if: success()
        run: |
          cd workspace

          DIST="out/shusky/dist"

          test -f "$DIST/Image.lz4" || {
            echo "ERROR: Image.lz4 missing."
            find "$DIST" -maxdepth 3 -type f
            exit 1
          }

          MODULES=(
            cfg80211.ko
            mac80211.ko
          )

          mkdir -p build-report/modules
          : > build-report/module-list.txt

          for module in "${MODULES[@]}"; do
            found="$(find "$DIST" -type f \
              -name "$module" -print -quit)"

            if [ -z "$found" ]; then
              echo "ERROR: Missing baseline module: $module"
              exit 1
            fi

            echo "$found" \
              | tee -a build-report/module-list.txt

            cp "$found" "build-report/modules/$module"
          done

          echo
          echo "=== Confirm excluded modules are absent ==="

          if find "$DIST" -type f \
            \( \
              -name 'rtl8187.ko' \
              -o -name 'mt76.ko' \
              -o -name 'mt76-usb.ko' \
              -o -name 'mt76x02-lib.ko' \
              -o -name 'mt76x02-usb.ko' \
              -o -name 'mt76x2-common.ko' \
              -o -name 'mt76x2u.ko' \
            \) | grep .; then
            echo "ERROR: An excluded wireless driver was found."
            exit 1
          fi

          echo "Excluded wireless modules are absent."
          echo "Baseline kernel image and modules verified."

      # ================================================
      # 13. Collect module metadata
      # ================================================

      - name: Collect module metadata
        if: success()
        run: |
          cd workspace

          {
            echo "=== Kernel image ==="
            file out/shusky/dist/Image.lz4
            sha256sum out/shusky/dist/Image.lz4

            echo
            echo "=== Module metadata ==="

            for module in build-report/modules/*.ko; do
              echo
              echo "FILE: $module"

              modinfo "$module" || true

              echo "VERMAGIC:"
              modinfo -F vermagic "$module" || true

              echo "DEPENDS:"
              modinfo -F depends "$module" || true

              echo "NAME:"
              modinfo -F name "$module" || true

              echo "IMPORT_NS:"
              modinfo -F import_ns "$module" || true

              sha256sum "$module"
            done

          } | tee build-report/module-metadata.txt

          for module in build-report/modules/*.ko; do
            printf '%s: ' "$(basename "$module")"
            modinfo -F vermagic "$module" || true
          done > build-report/vermagic-check.txt

      # ================================================
      # 14. Inspect vendor_dlkm outputs
      # ================================================

      - name: Inspect vendor_dlkm output
        if: success()
        run: |
          cd workspace

          mkdir -p build-report/vendor_dlkm

          find out/shusky/dist -type f \
            \( \
              -name 'vendor_dlkm.img' \
              -o -name '*vendor_dlkm*' \
              -o -name '*modules*' \
            \) \
            -print \
            > build-report/vendor_dlkm/files.txt

          cat build-report/vendor_dlkm/files.txt

          while IFS= read -r image; do
            [ -f "$image" ] || continue

            cp "$image" build-report/vendor_dlkm/

            file "$image"
            sha256sum "$image"

          done < build-report/vendor_dlkm/files.txt

          if ! grep -q 'vendor_dlkm.img' \
            build-report/vendor_dlkm/files.txt; then
            echo "WARNING: vendor_dlkm.img not found in dist."
          fi

      # ================================================
      # 15. Create final build report
      # ================================================

      - name: Create build report
        if: always()
        run: |
          cd workspace

          mkdir -p build-report

          {
            echo "=== Build information ==="
            date -u

            echo
            echo "=== Build status ==="
            if [ -f build-report/build-status.txt ]; then
              cat build-report/build-status.txt
            fi

            echo
            echo "=== Build result ==="
            if [ -f build-report/build.log ] &&
               grep -q 'Build completed successfully' \
                 build-report/build.log; then
              echo "Build completed successfully."
            else
              echo "Check build.log and GitHub Actions job result."
            fi

            echo
            echo "=== Dist contents ==="
            if [ -d out/shusky/dist ]; then
              find out/shusky/dist -type f -print
            else
              echo "Dist directory not found."
            fi

            echo
            echo "=== Disk space ==="
            df -h

          } > build-report/build-report.txt

      # ================================================
      # 16. Upload diagnostic and build artifacts
      # ================================================

      - name: Upload Shiba safe baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiba-nethunter-safe-baseline
          path: |
            workspace/out/shusky/dist/
            workspace/build-report/
          if-no-files-found: warn
          retention-days: 14
