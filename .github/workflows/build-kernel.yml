      - name: Verify final FIPS kernel configuration
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          mkdir -p "$REPORT_DIR"

          REPORT="$REPORT_DIR/fips-config.txt"
          CONFIG_LIST="$REPORT_DIR/shusky-config-files.txt"

          : > "$REPORT"
          : > "$CONFIG_LIST"

          echo "=== Zoek de Shusky kernel-buildconfiguratie ==="

          mapfile -t CONFIGS < <(
            find out/bazel \
              -type f \
              -path '*/private/devices/google/shusky/kernel/.config' \
              -print
          )

          printf '%s\n' "${CONFIGS[@]}" | tee "$CONFIG_LIST"

          if [ "${#CONFIGS[@]}" -eq 0 ]; then
            echo "ERROR: Shusky kernel .config not found."
            exit 1
          fi

          echo
          echo "=== Controleer FIPS-configuratie ==="

          for CONFIG in "${CONFIGS[@]}"; do
            echo
            echo "Checking: $CONFIG"

            {
              echo "CONFIG: $CONFIG"
              grep -E \
                '^CONFIG_CRYPTO_FIPS140_MOD=|^CONFIG_CRYPTO_FIPS140_MERGE_MOD_SECTIONS=' \
                "$CONFIG" || true
              echo
            } | tee -a "$REPORT"

            if ! grep -q '^CONFIG_CRYPTO_FIPS140_MOD=m$' "$CONFIG"; then
              echo "ERROR: FIPS module is not enabled in this Shusky kernel config."
              exit 1
            fi
          done

          echo
          echo "=== Controleer distributieconfiguratie ==="

          if [ -f out/shusky/dist/.config ]; then
            echo "Found: out/shusky/dist/.config"

            grep -E \
              '^CONFIG_CRYPTO_FIPS140_MOD=|^CONFIG_CRYPTO_FIPS140_MERGE_MOD_SECTIONS=' \
              out/shusky/dist/.config \
              | tee -a "$REPORT" || true

            if ! grep -q '^CONFIG_CRYPTO_FIPS140_MOD=m$' out/shusky/dist/.config; then
              echo "WARNING: FIPS setting not found in dist/.config."
              echo "The Shusky kernel build config itself passed."
            fi
          else
            echo "No dist/.config found."
          fi

          echo
          echo "Native Shusky FIPS configuration: PASS"