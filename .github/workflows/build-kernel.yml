name: Build Pixel 8 Shiba - NetHunter Native FIPS Test
# build-authorized: user-approved Native FIPS kernel build; no device flashing is performed.

on:
  push:
    branches:
      - main
      - phase2/rtl8187b-driver-audit

permissions:
  contents: read
  actions: read

concurrency:
  group: shiba-nethunter-native-fips-build
  cancel-in-progress: true

jobs:
  build-kernel:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'build-authorized') }}
    name: Build and verify Shiba Native FIPS kernel
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEVICE: shiba
      KERNEL_DEVICE: shusky
      CUSTOM_KERNEL_VERSION: "1.33"
      WORKSPACE: ${{ github.workspace }}/workspace
      REPORT_DIR: ${{ github.workspace }}/workspace/build-report

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Validate workflow syntax and integration contract
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n "$GITHUB_WORKSPACE/scripts/audit-rtl8187.sh"
          bash -n "$GITHUB_WORKSPACE/scripts/audit-dlkm-images.sh"
          bash -n "$GITHUB_WORKSPACE/scripts/patch-rtl8187-kmi.sh"
          bash -n "$GITHUB_WORKSPACE/scripts/audit-rtl8187-kmi-base.sh"
          ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0))' "$GITHUB_WORKSPACE/.github/workflows/build-kernel.yml"
          python3 <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/build-kernel.yml").read_text()
          rtl = "drivers/net/wireless/realtek/rtl818x/rtl8187/rtl8187.ko"
          wrong = "drivers/net/wireless/realtek/" + "rtl8187/rtl8187.ko"
          required = (
              "CONFIG_WLAN_VENDOR_REALTEK=y",
              "CONFIG_RTL8187=m",
              "CONFIG_EEPROM_93CX6=m",
              "scripts/audit-rtl8187.sh",
              "scripts/audit-dlkm-images.sh",
              "scripts/patch-rtl8187-kmi.sh",
              "scripts/audit-rtl8187-kmi-base.sh",
              "additional_kmi_symbol_lists",
              "abi_gki_aarch64_virtual_device",
              "VIRTUAL_ABI_LABEL",
          )
          assert rtl in workflow, "correct RTL8187 Kbuild output path missing"
          assert wrong not in workflow, "obsolete/wrong RTL8187 Kbuild path remains"
          for token in required:
              assert token in workflow, f"required integration contract missing: {token}"
          assert "kmi_symbol_list" in workflow and "abi_gki_aarch64_pixel" in workflow, "strict Pixel KMI base missing"
          assert "abi_gki_aarch64_fips140" in workflow, "supplemental FIPS ABI missing"
          assert "if-no-files-found: " + "warn" not in workflow, "artifact upload still permits missing required files"
          print("Workflow YAML + Bash syntax + RTL8187/EEPROM/KMI contract: PASS")
          PY

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          timeout 30s sudo docker image prune -af || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            cmake \
            curl \
            e2fsprogs \
            flex \
            git \
            kmod \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            lz4 \
            make \
            openssl \
            pahole \
            python3 \
            python3-pip \
            python3-venv \
            rsync \
            unzip \
            zip \
            zstd

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" version

      - name: Initialize Google kernel workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-shusky-6.1-android16 \
            --depth=1

      # Cache the Repo metadata and Git objects.
      # repo sync still runs on every build and updates the checkout.
      - name: Restore Google Repo source cache
        id: repo-cache
        uses: actions/cache@v4
        with:
          path: workspace/.repo
          key: repo-${{ runner.os }}-shusky-android16-v2
          restore-keys: |
            repo-${{ runner.os }}-shusky-android16-v1

      - name: Record source cache status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          if [ "${{ steps.repo-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Google Repo cache: HIT" \
              | tee "$REPORT_DIR/repo-cache-status.txt"
          else
            echo "Google Repo cache: MISS or restored fallback" \
              | tee "$REPORT_DIR/repo-cache-status.txt"
          fi

      - name: Sync Google kernel sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          SYNC_OK=0
          for ATTEMPT in $(seq 1 5); do
            echo "Repo sync attempt $ATTEMPT/5..."
            if repo sync \
              -c \
              -j"$(nproc)" \
              --no-clone-bundle \
              --no-tags; then
              SYNC_OK=1
              break
            fi
            if [ "$ATTEMPT" -lt 5 ]; then
              WAIT=$((ATTEMPT * 15))
              echo "Repo sync failed; retrying in ${WAIT}s."
              sleep "$WAIT"
            fi
          done
          if [ "$SYNC_OK" -ne 1 ]; then
            echo "ERROR: Google kernel source sync failed after 5 attempts."
            exit 1
          fi

      - name: Export pinned Repo manifest for Kleaf SCM stamping
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          mkdir -p out
          repo manifest -r > out/manifest.xml
          test -s out/manifest.xml
          grep -q 'path="aosp"' out/manifest.xml
          {
            echo "Repo manifest exported for Kleaf SCM stamping."
            echo "Manifest: $WORKSPACE/out/manifest.xml"
            echo "Kernel/common project path: aosp"
          } | tee "$REPORT_DIR/repo-manifest-status.txt"

      - name: Pin exact Google GKI kernel/common source revision
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE/aosp"
          GKI_KERNEL_COMMON_COMMIT="fa1d6308d1fe803c3fdebcd3ee6f7a1155fc3462"
          GKI_KERNEL_RELEASE="6.1.145-android14-11-gfa1d6308d1fe"
          SOURCE_REMOTE=""
          SOURCE_URL=""
          while IFS= read -r remote; do
            url="$(git remote get-url "$remote")"
            case "$url" in
              *android.googlesource.com/kernel/common*)
                SOURCE_REMOTE="$remote"
                SOURCE_URL="$url"
                break
                ;;
            esac
          done < <(git remote)
          if [ -z "$SOURCE_REMOTE" ]; then
            echo "ERROR: repo manifest checkout has no kernel/common remote."
            git remote -v
            exit 1
          fi
          echo "Resolved kernel/common remote: $SOURCE_REMOTE ($SOURCE_URL)"
          if ! git cat-file -e "$GKI_KERNEL_COMMON_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 --no-tags "$SOURCE_REMOTE" "$GKI_KERNEL_COMMON_COMMIT"
          fi
          git checkout --detach "$GKI_KERNEL_COMMON_COMMIT"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$GKI_KERNEL_COMMON_COMMIT"
          grep -qx 'VERSION = 6' Makefile
          grep -qx 'PATCHLEVEL = 1' Makefile
          grep -qx 'SUBLEVEL = 145' Makefile
          echo "KERNEL_COMMON_COMMIT=$ACTUAL" >> "$GITHUB_ENV"
          echo "EXPECTED_KERNEL_RELEASE=$GKI_KERNEL_RELEASE-ab14691759" >> "$GITHUB_ENV"
          {
            echo "Exact Google kernel/common commit: $ACTUAL"
            echo "Source kernel release: $GKI_KERNEL_RELEASE"
            echo "Matching GKI build ID: 14691759"
            echo "The kernel source and GKI prebuilt now use the same 6.1.145 base."
          } | tee "$REPORT_DIR/kernel-common-commit.txt"

      # Persist Bazel's action cache between runs, including when a later
      # audit fails. The save step at the end runs with always().
      - name: Restore Bazel disk cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/.bazel-disk-cache
          key: bazel-${{ runner.os }}-shusky-gki14691759-rtl8187-v2-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-shusky-gki14691759-rtl8187-v2-

      - name: Prepare build reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "Build started: $(date -u)"
            echo "Target: //private/devices/google/shusky:zuma_shusky_dist"
            echo "Build type: Native FIPS integration"
            echo "Pixel KMI: strict"
            echo "FIPS ABI: supplemental"
            echo "FIPS module: native in-tree"
            echo "FIPS HMAC postlink: required"
            echo "KernelSU Inline: disabled"
            echo "RTL8187: enabled as an on-demand USB module"
            echo "MT76: excluded"
            echo "Phone flash: disabled"
            echo "Repo source cache: enabled"
            echo "Bazel disk cache: enabled"
          } | tee "$REPORT_DIR/build-info.txt"

      - name: Verify native FIPS sources and ABI files
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          echo "=== Native FIPS sources ==="
          for FILE in \
            aosp/crypto/Kconfig \
            aosp/crypto/Makefile \
            aosp/crypto/fips140-module.c \
            aosp/crypto/fips140_gen_hmac.c \
            aosp/arch/arm64/Makefile.postlink
          do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing source: $FILE"
              exit 1
            fi
            echo "FOUND: $FILE"
          done
          echo
          echo "=== ABI files ==="
          PIXEL_ABI="aosp/android/abi_gki_aarch64_pixel"
          FIPS_ABI="aosp/android/abi_gki_aarch64_fips140"
          test -f "$PIXEL_ABI"
          test -f "$FIPS_ABI"
          echo "Pixel ABI: $PIXEL_ABI"
          echo "FIPS ABI: $FIPS_ABI"
          echo "PIXEL_ABI=$PIXEL_ABI" >> "$GITHUB_ENV"
          echo "FIPS_ABI=$FIPS_ABI" >> "$GITHUB_ENV"
          {
            echo "Pixel ABI: PASS"
            echo "FIPS ABI: PASS"
            echo "Native FIPS sources: PASS"
          } | tee "$REPORT_DIR/fips-source-verification.txt"

      - name: Verify FIPS Kconfig and HMAC postlink
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          grep -n -B5 -A15 \
            'CRYPTO_FIPS140_MOD' \
            aosp/crypto/Kconfig \
            | tee "$REPORT_DIR/fips-kconfig.txt"
          grep -n -B5 -A8 \
            'fips140' \
            aosp/crypto/Makefile \
            | tee "$REPORT_DIR/fips-crypto-makefile.txt"
          grep -n -B8 -A18 \
            'CMD_FIPS140_GEN_HMAC\|cmd_gen_hmac\|fips140.ko' \
            aosp/arch/arm64/Makefile.postlink \
            | tee "$REPORT_DIR/fips-hmac-postlink-source.txt"
          grep -q 'CMD_FIPS140_GEN_HMAC' \
            aosp/arch/arm64/Makefile.postlink
          grep -q 'cmd_gen_hmac' \
            aosp/arch/arm64/Makefile.postlink
          echo "FIPS source and postlink checks: PASS"

      - name: Resolve and export FIPS ABI Bazel target
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          ABI_FILE="abi_gki_aarch64_fips140"
          echo "=== AOSP BUILD files ==="
          find aosp -maxdepth 3 \
            \( -name BUILD -o -name BUILD.bazel \) \
            -print \
            | tee "$REPORT_DIR/aosp-build-files.txt"
          if [ -f aosp/android/BUILD.bazel ]; then
            ABI_BUILD="aosp/android/BUILD.bazel"
            ABI_LABEL="//aosp/android:${ABI_FILE}"
            ABI_RELATIVE="$ABI_FILE"
          elif [ -f aosp/android/BUILD ]; then
            ABI_BUILD="aosp/android/BUILD"
            ABI_LABEL="//aosp/android:${ABI_FILE}"
            ABI_RELATIVE="$ABI_FILE"
          elif [ -f aosp/BUILD.bazel ]; then
            ABI_BUILD="aosp/BUILD.bazel"
            ABI_LABEL="//aosp:android/${ABI_FILE}"
            ABI_RELATIVE="android/${ABI_FILE}"
          elif [ -f aosp/BUILD ]; then
            ABI_BUILD="aosp/BUILD"
            ABI_LABEL="//aosp:android/${ABI_FILE}"
            ABI_RELATIVE="android/${ABI_FILE}"
          else
            echo "ERROR: No AOSP root Bazel package found."
            exit 1
          fi
          echo "ABI BUILD file: $ABI_BUILD"
          echo "ABI label: $ABI_LABEL"
          if ! grep -Fq "$ABI_RELATIVE" "$ABI_BUILD"; then
            cat >> "$ABI_BUILD" <<EOF
          # Export Google native FIPS ABI for Shusky.
          exports_files([
              "$ABI_RELATIVE",
          ])
          EOF
          fi
          tools/bazel query "$ABI_LABEL" \
            --output=label \
            | tee "$REPORT_DIR/fips-abi-bazel-query.txt"
          VIRTUAL_ABI_FILE="abi_gki_aarch64_virtual_device"
          VIRTUAL_ABI_RELATIVE="${ABI_RELATIVE/abi_gki_aarch64_fips140/$VIRTUAL_ABI_FILE}"
          VIRTUAL_ABI_LABEL="${ABI_LABEL/abi_gki_aarch64_fips140/$VIRTUAL_ABI_FILE}"
          test -s "aosp/$VIRTUAL_ABI_RELATIVE"
          if ! grep -Fq "$VIRTUAL_ABI_RELATIVE" "$ABI_BUILD"; then
            cat >> "$ABI_BUILD" <<EOF
          # Reuse Google's already-published generic GKI virtual-device ABI.
          exports_files([
              "$VIRTUAL_ABI_RELATIVE",
          ])
          EOF
          fi
          tools/bazel query "$VIRTUAL_ABI_LABEL" \
            --output=label \
            | tee "$REPORT_DIR/virtual-device-abi-bazel-query.txt"
          echo "FIPS_ABI_LABEL=$ABI_LABEL" >> "$GITHUB_ENV"
          echo "VIRTUAL_ABI_LABEL=$VIRTUAL_ABI_LABEL" >> "$GITHUB_ENV"

      - name: Verify Shusky and Zuma build definitions
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          SHUSKY_BUILD="private/devices/google/shusky/BUILD.bazel"
          ZUMA_RAMDISK="private/devices/google/zuma/vendor_ramdisk.modules.zuma"
          SHUSKY_RAMDISK="private/devices/google/shusky/vendor_ramdisk.modules.shusky"
          test -f "$SHUSKY_BUILD"
          test -f "$ZUMA_RAMDISK"
          test -f "$SHUSKY_RAMDISK"
          echo "=== Shusky BUILD ==="
          grep -n -B5 -A12 \
            'shusky_defconfig\|kmi_symbol_list\|module_outs\|vendor_ramdisk' \
            "$SHUSKY_BUILD"
          echo
          echo "=== Zuma ramdisk module list ==="
          sed -n '1,100p' "$ZUMA_RAMDISK"
          echo
          echo "=== Shusky ramdisk module list ==="
          sed -n '1,100p' "$SHUSKY_RAMDISK"

      - name: Route Shusky and Native FIPS dependencies through exact GKI prebuilt
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          python3 <<'PY'
          from pathlib import Path

          shusky = Path("private/devices/google/shusky/BUILD.bazel")
          google_common = Path("private/devices/google/common/BUILD.bazel")
          shusky_text = shusky.read_text()
          common_text = google_common.read_text()

          replacements = {
              '"//common:kernel_aarch64"':
                  '"//common:kernel_aarch64_download_or_build"',
              '"//common:kernel_aarch64_images"':
                  '"//common:kernel_aarch64_images_download_or_build"',
              '"//common:kernel_aarch64_gki_boot_image"':
                  '"//common:kernel_aarch64_gki_artifacts_download_or_build"',
              '"//common:kernel_aarch64_headers"':
                  '"//common:kernel_aarch64_headers_download_or_build"',
          }
          for old, new in replacements.items():
              count = shusky_text.count(old)
              if count == 0:
                  raise SystemExit(f"ERROR: expected Shusky GKI reference missing: {old}")
              shusky_text = shusky_text.replace(old, new)
              print(f"Shusky BUILD: {old} -> {new} ({count} occurrence(s))")

          old_images = 'images = "//common:kernel_aarch64_images"'
          new_images = 'images = "//common:kernel_aarch64_images_download_or_build"'
          if common_text.count(old_images) != 1:
              raise SystemExit(
                  "ERROR: expected exactly one Google-common extracted_system_dlkm images reference"
              )
          common_text = common_text.replace(old_images, new_images, 1)
          shusky.write_text(shusky_text)
          google_common.write_text(common_text)
          print("Google common BUILD: extracted_system_dlkm now uses prebuilt-aware GKI images.")

          # Guard only the Shusky consumer BUILD file. The Google-common
          # BUILD file defines the canonical source-build targets themselves,
          # so finding those labels there is legitimate and must not fail this
          # consumer-routing check. Require exact quoted labels, not prefixes.
          import re
          forbidden_labels = (
              "//common:kernel_aarch64",
              "//common:kernel_aarch64_images",
              "//common:kernel_aarch64_gki_boot_image",
              "//common:kernel_aarch64_headers",
          )
          for label in forbidden_labels:
              if re.search(r'(?<![A-Za-z0-9_])"' + re.escape(label) + r'"', shusky_text):
                  raise SystemExit(
                      f"ERROR: unresolved exact direct GKI reference {label} in {shusky}"
                  )
          expected_labels = (
              "//common:kernel_aarch64_download_or_build",
              "//common:kernel_aarch64_images_download_or_build",
              "//common:kernel_aarch64_gki_artifacts_download_or_build",
              "//common:kernel_aarch64_headers_download_or_build",
          )
          for label in expected_labels:
              if f'"{label}"' not in shusky_text:
                  raise SystemExit(
                      f"ERROR: expected prebuilt-aware GKI reference missing: {label}"
                  )
          print("PASS: Shusky uses exact prebuilt-aware GKI consumer labels.")
          PY
          echo "=== Confirm Native FIPS kernel label flag exists ==="
          grep -n -A5 -B2 'name = "kernel"' private/devices/google/common/BUILD.bazel
          python3 <<'PY'
          import subprocess
          from pathlib import Path

          kleaf = Path("build/kernel")
          expected_commit = "6483b5a6b74251440b266536c2dbc902a4fa3cf2"
          actual_commit = subprocess.check_output(
              ["git", "-C", str(kleaf), "rev-parse", "HEAD"],
              text=True,
          ).strip()
          if actual_commit != expected_commit:
              raise SystemExit(
                  f"ERROR: unexpected Kleaf source revision: {actual_commit}; "
                  f"expected {expected_commit}"
              )

          download_repo = kleaf / "kleaf/download_repo.bzl"
          source = download_repo.read_text()
          internal_url = (
              "https://androidbuildinternal.googleapis.com/android/internal/build/v3/"
              "builds/{build_number}/{target}/attempts/latest/artifacts/{filename}/url?redirect=true"
          )
          public_url = (
              "https://ci.android.com/builds/submitted/{build_number}/{target}/latest/raw/{filename}"
          )
          if source.count(internal_url) != 1:
              raise SystemExit(
                  "ERROR: expected exactly one pinned Kleaf internal artifact URL constant"
              )
          download_repo.write_text(source.replace(internal_url, public_url, 1))
          verified = download_repo.read_text()
          if public_url not in verified or internal_url in verified:
              raise SystemExit("ERROR: public GKI artifact URL patch verification failed")
          print(f"Kleaf source revision: {actual_commit}")
          print("PASS: pinned Kleaf download_repo.bzl now uses the verified public Android CI artifact endpoint.")
          PY
          echo "GKI prebuilt target routing patch: PASS"

      - name: Verify pinned RTL8187 and EEPROM source integration
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          RTL_DIR="aosp/drivers/net/wireless/realtek/rtl818x/rtl8187"
          RTL_KCONFIG="aosp/drivers/net/wireless/realtek/rtl818x/Kconfig"
          REALTEK_KCONFIG="aosp/drivers/net/wireless/realtek/Kconfig"
          test -s "$RTL_DIR/Makefile"
          test -s "$RTL_DIR/dev.c"
          test -s "$RTL_KCONFIG"
          test -s "$REALTEK_KCONFIG"
          grep -Fq 'source "drivers/net/wireless/realtek/rtl818x/Kconfig"' "$REALTEK_KCONFIG"
          grep -Eq 'config RTL8187([[:space:]]|$)' "$RTL_KCONFIG"
          grep -Eq 'select EEPROM_93CX6' "$RTL_KCONFIG"
          grep -Eq 'obj-\$\(CONFIG_RTL8187\).*rtl8187\.o' "$RTL_DIR/Makefile"
          test -s aosp/drivers/misc/eeprom/eeprom_93cx6.c
          test -s aosp/drivers/misc/eeprom/Makefile
          {
            echo "RTL8187 source directory: $RTL_DIR"
            echo "RTL8187 Kconfig selects EEPROM_93CX6: PASS"
            echo "RTL8187 Makefile builds rtl8187.o: PASS"
            echo "EEPROM_93CX6 source and Makefile: PASS"
          } | tee "$REPORT_DIR/rtl8187-source-verification.txt"

      - name: Apply RTL8187 KMI-safe source compatibility and verify pinned GKI ABI
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          bash "$GITHUB_WORKSPACE/scripts/patch-rtl8187-kmi.sh" \
            "$WORKSPACE/aosp" \
            "$REPORT_DIR/rtl8187-kmi-source-patch.txt"
          bash "$GITHUB_WORKSPACE/scripts/audit-rtl8187-kmi-base.sh" \
            "$WORKSPACE/aosp" \
            "$REPORT_DIR" \
            14691759

      - name: Create native FIPS defconfig fragment
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          cat > \
            private/devices/google/shusky/nethunter_fips_defconfig <<'EOF'
          CONFIG_MODULES=y
          CONFIG_MODVERSIONS=y
          CONFIG_WLAN=y
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_USB=y
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_RTL8187=m
          CONFIG_EEPROM_93CX6=m
          CONFIG_CRYPTO_FIPS140_MOD=m
          EOF
          echo "=== FIPS defconfig ==="
          cat \
            private/devices/google/shusky/nethunter_fips_defconfig

      - name: Integrate native FIPS into Shusky and Zuma ramdisk
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          python3 <<'PY'
          import os
          from pathlib import Path
          build = Path(
              "private/devices/google/shusky/BUILD.bazel"
          )
          zuma_ramdisk = Path(
              "private/devices/google/zuma/vendor_ramdisk.modules.zuma"
          )
          shusky_ramdisk = Path(
              "private/devices/google/shusky/vendor_ramdisk.modules.shusky"
          )
          text = build.read_text()
          fips_label = os.environ["FIPS_ABI_LABEL"]
          virtual_label = os.environ["VIRTUAL_ABI_LABEL"]
          if "nethunter_fips_defconfig" not in text:
              old = '"shusky_defconfig"'
              if old not in text:
                  raise SystemExit(
                      "ERROR: shusky_defconfig not found"
                  )
              text = text.replace(
                  old,
                  old + ',\n        "nethunter_fips_defconfig"',
                  1
              )
          if "additional_kmi_symbol_lists" not in text:
              old = (
                  'kmi_symbol_list = '
                  '"//common:android/abi_gki_aarch64_pixel",'
              )
              if old not in text:
                  raise SystemExit(
                      "ERROR: Strict Pixel ABI declaration not found"
                  )
              text = text.replace(
                  old,
                  old + f'''
              additional_kmi_symbol_lists = [
                  "{fips_label}",
                  "{virtual_label}",
              ],''',
                  1
              )
          else:
              if fips_label not in text:
                  raise SystemExit(
                      "ERROR: Existing additional_kmi_symbol_lists "
                      "does not contain the FIPS ABI label."
                  )
              if virtual_label not in text:
                  marker = f'        "{fips_label}",'
                  if marker not in text:
                      raise SystemExit(
                          "ERROR: Cannot safely add official virtual_device ABI label."
                      )
                  text = text.replace(
                      marker,
                      marker + f'\n        "{virtual_label}",',
                      1,
                  )
          required_module_outs = [
              "crypto/fips140.ko",
              "drivers/net/wireless/realtek/rtl818x/rtl8187/rtl8187.ko",
              "drivers/misc/eeprom/eeprom_93cx6.ko",
          ]
          if not all(f'"{item}"' in text for item in required_module_outs):
              old = "module_outs = ZUMA_MODULE_OUTS,"
              if old not in text:
                  raise SystemExit("ERROR: module_outs = ZUMA_MODULE_OUTS not found")
              text = text.replace(
                  old,
                  'module_outs = ZUMA_MODULE_OUTS + '
                  '["crypto/fips140.ko", '
                  '"drivers/net/wireless/realtek/rtl818x/rtl8187/rtl8187.ko", '
                  '"drivers/misc/eeprom/eeprom_93cx6.ko"],',
                  1
              )
          if not all(f'"{item}"' in text for item in required_module_outs):
              raise SystemExit("ERROR: required FIPS/RTL8187/EEPROM module_outs entries missing")
          build.write_text(text)
          fips_entry = "kernel/crypto/fips140.ko"
          zuma_lines = zuma_ramdisk.read_text().splitlines()
          if fips_entry not in zuma_lines:
              # Google's Native FIPS crypto module is intended for early boot.
              # Put it first, before the UFS FIPS consumer and other device modules.
              zuma_lines.insert(0, fips_entry)
              zuma_ramdisk.write_text(
                  "\n".join(zuma_lines) + "\n"
              )
          if zuma_lines[0] != fips_entry:
              raise SystemExit(
                  "ERROR: kernel/crypto/fips140.ko must be first in the Zuma ramdisk load list"
              )
          shusky_lines = shusky_ramdisk.read_text().splitlines()
          if fips_entry in shusky_lines:
              raise SystemExit(
                  "ERROR: FIPS entry already exists in Shusky list; "
                  "review the existing integration before continuing."
              )
          print("Shusky BUILD updated.")
          print("FIPS ABI:", fips_label)
          print("Existing official GKI virtual_device ABI:", virtual_label)
          print("FIPS module added to module_outs.")
          print("FIPS added to Zuma ramdisk list.")
          print("Existing Zuma module ordering preserved.")
          PY
          echo "=== Verify FIPS entry in Zuma ramdisk list ==="
          grep -n -F \
            'kernel/crypto/fips140.ko' \
            private/devices/google/zuma/vendor_ramdisk.modules.zuma
          echo
          echo "=== First entries (ordering retained for diagnosis) ==="
          sed -n '1,12p' \
            private/devices/google/zuma/vendor_ramdisk.modules.zuma

      - name: Verify configured GKI and Native FIPS dependency graph before compilation
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          tools/bazel query "$FIPS_ABI_LABEL" --output=label
          GKI_FLAGS=(
            --use_prebuilt_gki=14691759
            --action_env=KLEAF_DOWNLOAD_BUILD_NUMBER_MAP=gki_prebuilts=14691759
          )
          SHUSKY_FLAGS=(
            --//private/devices/google/common:kernel=//private/devices/google/shusky:kernel
            --//private/google-modules/soc/gs:gs_soc_module=//private/devices/google/shusky:zuma_soc.shusky
            --no//private/devices/google/common:download_prebuilt_gki_fips140
          )
          tools/bazel cquery --config=stamp --config=shusky --kernel_package=@//aosp "${GKI_FLAGS[@]}" "${SHUSKY_FLAGS[@]}" \
            --output=label \
            'deps(//private/devices/google/shusky:zuma_shusky_dist)' \
            > "$REPORT_DIR/shusky-configured-dependencies.txt"
          for REQUIRED in \
            '@gki_prebuilts//Image.lz4:Image.lz4' \
            '@gki_prebuilts//kernel-headers.tar.gz:kernel-headers.tar.gz' \
            '@gki_prebuilts//system_dlkm_staging_archive.tar.gz:system_dlkm_staging_archive.tar.gz' \
            '@gki_prebuilts//system_dlkm.modules.blocklist:system_dlkm.modules.blocklist' \
            '@gki_prebuilts//system_dlkm.modules.load:system_dlkm.modules.load'
          do
            if ! grep -Fq "$REQUIRED" "$REPORT_DIR/shusky-configured-dependencies.txt"; then
              echo "ERROR: required GKI prebuilt dependency is absent: $REQUIRED"
              exit 1
            fi
            echo "PASS dependency: $REQUIRED"
          done
          grep -n 'abi_gki_aarch64_pixel' private/devices/google/shusky/BUILD.bazel
          grep -n "$FIPS_ABI_LABEL" private/devices/google/shusky/BUILD.bazel
          grep -n "$VIRTUAL_ABI_LABEL" private/devices/google/shusky/BUILD.bazel
          grep -n 'crypto/fips140.ko' private/devices/google/shusky/BUILD.bazel
          echo "Configured GKI and Native FIPS dependency graph: PASS" \
            | tee "$REPORT_DIR/pre-build-verification.txt"

      - name: Pin exact GKI SCM version for Kleaf
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          python3 <<'PY'
          import json
          from pathlib import Path

          common = Path("aosp")
          status = common / "workspace_status.json"
          expected = "-android14-11-gfa1d6308d1fe-ab14691759"
          payload = {"SCMVERSION": expected}
          status.write_text(json.dumps(payload, sort_keys=True) + "\n")
          actual = json.loads(status.read_text())
          if actual.get("SCMVERSION") != expected:
              raise SystemExit("ERROR: Kleaf SCMVERSION override does not match the pinned Pixel 8 GKI release")
          print("Kleaf workspace_status.json:", status)
          print("Exact SCMVERSION:", actual["SCMVERSION"])
          print("Expected full kernel release:", "6.1.145" + actual["SCMVERSION"])
          PY

      - name: Build Shusky Native FIPS kernel
        shell: bash
        run: |
