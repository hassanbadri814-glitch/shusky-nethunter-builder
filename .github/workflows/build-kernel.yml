      - name: Verify final Shusky FIPS configurations
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          REPORT="$REPORT_DIR/fips-config-verification.txt"
          : > "$REPORT"

          CONFIGS=(
            "out/bazel/output_user_root/8f001b10dded3e7c12837e88ae651347/execroot/__main__/bazel-out/k8-fastbuild/bin/private/devices/google/shusky/kernel/.config"
            "out/bazel/output_user_root/8f001b10dded3e7c12837e88ae651347/execroot/__main__/bazel-out/k8-fastbuild/bin/private/devices/google/shusky/kernel_config/out_dir/.config"
            "out/shusky/dist/.config"
          )

          for CONFIG in "${CONFIGS[@]}"; do
            echo
            echo "=== $CONFIG ==="

            if [ ! -f "$CONFIG" ]; then
              echo "MISSING"
              continue
            fi

            grep -E \
              '^(CONFIG_CRYPTO_FIPS140_MOD=|# CONFIG_CRYPTO_FIPS140_MOD is not set|CONFIG_CRYPTO_FIPS140_MERGE_MOD_SECTIONS=)' \
              "$CONFIG" || true

            {
              echo "FILE: $CONFIG"
              grep -E \
                '^(CONFIG_CRYPTO_FIPS140_MOD=|# CONFIG_CRYPTO_FIPS140_MOD is not set|CONFIG_CRYPTO_FIPS140_MERGE_MOD_SECTIONS=)' \
                "$CONFIG" || true
              echo
            } >> "$REPORT"
          done

          echo
          echo "=== Final distribution config ==="

          DIST_CONFIG="out/shusky/dist/.config"

          if [ ! -f "$DIST_CONFIG" ]; then
            echo "ERROR: Distribution .config missing."
            exit 1
          fi

          if ! grep -q '^CONFIG_CRYPTO_FIPS140_MOD=m$' "$DIST_CONFIG"; then
            echo "ERROR: FIPS is not enabled in distribution config."
            exit 1
          fi

          echo "Distribution FIPS configuration: PASS"