name: Build Pixel 8 Shiba - NetHunter Native FIPS Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: shiba-nethunter-native-fips-audit-only
  cancel-in-progress: false

jobs:
  build-kernel:
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, 'audit-only') }}
    name: Build and verify Shiba Native FIPS kernel
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEVICE: shiba
      KERNEL_DEVICE: shusky
      CUSTOM_KERNEL_VERSION: "1.33"
      WORKSPACE: ${{ github.workspace }}/workspace
      REPORT_DIR: ${{ github.workspace }}/workspace/build-report

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker image prune -af || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            cmake \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            lz4 \
            make \
            openssl \
            pahole \
            python3 \
            python3-pip \
            python3-venv \
            rsync \
            unzip \
            zip \
            zstd

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" version

      - name: Initialize Google kernel workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-shusky-6.1-android16 \
            --depth=1

      # Cache the Repo metadata and Git objects.
      # repo sync still runs on every build and updates the checkout.
      - name: Restore Google Repo source cache
        id: repo-cache
        uses: actions/cache@v4
        with:
          path: workspace/.repo
          key: repo-${{ runner.os }}-shusky-android16-v1

      - name: Record source cache status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          if [ "${{ steps.repo-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Google Repo cache: HIT" \
              | tee "$REPORT_DIR/repo-cache-status.txt"
          else
            echo "Google Repo cache: MISS or restored fallback" \
              | tee "$REPORT_DIR/repo-cache-status.txt"
          fi

      - name: Sync Google kernel sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          repo sync \
            -c \
            -j"$(nproc)" \
            --no-clone-bundle \
            --no-tags

      - name: Pin kernel/common to the installed Pixel kernel commit
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE/aosp"
          KERNEL_COMMON_COMMIT="164ae0b804dd"
          echo "Requested stock kernel commit: $KERNEL_COMMON_COMMIT"
          echo "Remote: $(git remote get-url origin)"
          git fetch --no-tags origin "$KERNEL_COMMON_COMMIT"
          git checkout --detach FETCH_HEAD
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          case "$ACTUAL_COMMIT" in
            "$KERNEL_COMMON_COMMIT"*) ;;
            *)
              echo "ERROR: fetched commit does not match requested stock kernel commit"
              echo "Actual: $ACTUAL_COMMIT"
              exit 1
              ;;
          esac
          echo "Pinned kernel/common commit: $ACTUAL_COMMIT"
          echo "KERNEL_COMMON_COMMIT=$ACTUAL_COMMIT" >> "$GITHUB_ENV"
          echo "KERNEL_COMMON_COMMIT=$ACTUAL_COMMIT" >> "$GITHUB_OUTPUT"
          git log -1 --format=fuller
          printf '%s\n' "$ACTUAL_COMMIT" > "$REPORT_DIR/kernel-common-commit.txt"

      - name: Prepare build reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "Build started: $(date -u)"
            echo "Target: //private/devices/google/shusky:zuma_shusky_dist"
            echo "Build type: Native FIPS integration"
            echo "Pixel KMI: strict"
            echo "FIPS ABI: supplemental"
            echo "FIPS module: native in-tree"
            echo "FIPS HMAC postlink: required"
            echo "KernelSU Inline: disabled"
            echo "RTL8187: excluded"
            echo "MT76: excluded"
            echo "Phone flash: disabled"
            echo "Repo source cache: enabled"
            echo "Bazel output cache: not enabled pending validation"
          } | tee "$REPORT_DIR/build-info.txt"

      - name: Verify native FIPS sources and ABI files
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          echo "=== Native FIPS sources ==="
          for FILE in \
            aosp/crypto/Kconfig \
            aosp/crypto/Makefile \
            aosp/crypto/fips140-module.c \
            aosp/crypto/fips140_gen_hmac.c \
            aosp/arch/arm64/Makefile.postlink
          do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing source: $FILE"
              exit 1
            fi
            echo "FOUND: $FILE"
          done
          echo
          echo "=== ABI files ==="
          PIXEL_ABI="aosp/android/abi_gki_aarch64_pixel"
          FIPS_ABI="aosp/android/abi_gki_aarch64_fips140"
          test -f "$PIXEL_ABI"
          test -f "$FIPS_ABI"
          echo "Pixel ABI: $PIXEL_ABI"
          echo "FIPS ABI: $FIPS_ABI"
          echo "PIXEL_ABI=$PIXEL_ABI" >> "$GITHUB_ENV"
          echo "FIPS_ABI=$FIPS_ABI" >> "$GITHUB_ENV"
          {
            echo "Pixel ABI: PASS"
            echo "FIPS ABI: PASS"
            echo "Native FIPS sources: PASS"
          } | tee "$REPORT_DIR/fips-source-verification.txt"

      - name: Verify FIPS Kconfig and HMAC postlink
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          grep -n -B5 -A15 \
            'CRYPTO_FIPS140_MOD' \
            aosp/crypto/Kconfig \
            | tee "$REPORT_DIR/fips-kconfig.txt"
          grep -n -B5 -A8 \
            'fips140' \
            aosp/crypto/Makefile \
            | tee "$REPORT_DIR/fips-crypto-makefile.txt"
          grep -n -B8 -A18 \
            'CMD_FIPS140_GEN_HMAC\|cmd_gen_hmac\|fips140.ko' \
            aosp/arch/arm64/Makefile.postlink \
            | tee "$REPORT_DIR/fips-hmac-postlink-source.txt"
          grep -q 'CMD_FIPS140_GEN_HMAC' \
            aosp/arch/arm64/Makefile.postlink
          grep -q 'cmd_gen_hmac' \
            aosp/arch/arm64/Makefile.postlink
          echo "FIPS source and postlink checks: PASS"

      - name: Resolve and export FIPS ABI Bazel target
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          ABI_FILE="abi_gki_aarch64_fips140"
          echo "=== AOSP BUILD files ==="
          find aosp -maxdepth 3 \
            \( -name BUILD -o -name BUILD.bazel \) \
            -print \
            | tee "$REPORT_DIR/aosp-build-files.txt"
          if [ -f aosp/android/BUILD.bazel ]; then
            ABI_BUILD="aosp/android/BUILD.bazel"
            ABI_LABEL="//aosp/android:${ABI_FILE}"
            ABI_RELATIVE="$ABI_FILE"
          elif [ -f aosp/android/BUILD ]; then
            ABI_BUILD="aosp/android/BUILD"
            ABI_LABEL="//aosp/android:${ABI_FILE}"
            ABI_RELATIVE="$ABI_FILE"
          elif [ -f aosp/BUILD.bazel ]; then
            ABI_BUILD="aosp/BUILD.bazel"
            ABI_LABEL="//aosp:android/${ABI_FILE}"
            ABI_RELATIVE="android/${ABI_FILE}"
          elif [ -f aosp/BUILD ]; then
            ABI_BUILD="aosp/BUILD"
            ABI_LABEL="//aosp:android/${ABI_FILE}"
            ABI_RELATIVE="android/${ABI_FILE}"
          else
            echo "ERROR: No AOSP root Bazel package found."
            exit 1
          fi
          echo "ABI BUILD file: $ABI_BUILD"
          echo "ABI label: $ABI_LABEL"
          if ! grep -Fq "$ABI_RELATIVE" "$ABI_BUILD"; then
            cat >> "$ABI_BUILD" <<EOF
          # Export Google native FIPS ABI for Shusky.
          exports_files([
              "$ABI_RELATIVE",
          ])
          EOF
          fi
          bazel query "$ABI_LABEL" \
            --output=label \
            | tee "$REPORT_DIR/fips-abi-bazel-query.txt"
          echo "FIPS_ABI_LABEL=$ABI_LABEL" >> "$GITHUB_ENV"

      - name: Verify Shusky and Zuma build definitions
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          SHUSKY_BUILD="private/devices/google/shusky/BUILD.bazel"
          ZUMA_RAMDISK="private/devices/google/zuma/vendor_ramdisk.modules.zuma"
          SHUSKY_RAMDISK="private/devices/google/shusky/vendor_ramdisk.modules.shusky"
          test -f "$SHUSKY_BUILD"
          test -f "$ZUMA_RAMDISK"
          test -f "$SHUSKY_RAMDISK"
          echo "=== Shusky BUILD ==="
          grep -n -B5 -A12 \
            'shusky_defconfig\|kmi_symbol_list\|module_outs\|vendor_ramdisk' \
            "$SHUSKY_BUILD"
          echo
          echo "=== Zuma ramdisk module list ==="
          sed -n '1,100p' "$ZUMA_RAMDISK"
          echo
          echo "=== Shusky ramdisk module list ==="
          sed -n '1,100p' "$SHUSKY_RAMDISK"

      - name: Create native FIPS defconfig fragment
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          cat > \
            private/devices/google/shusky/nethunter_fips_defconfig <<'EOF'
          CONFIG_CRYPTO_FIPS140_MOD=m
          EOF
          echo "=== FIPS defconfig ==="
          cat \
            private/devices/google/shusky/nethunter_fips_defconfig

      - name: Integrate native FIPS into Shusky and Zuma ramdisk
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          python3 <<'PY'
          import os
          from pathlib import Path
          build = Path(
              "private/devices/google/shusky/BUILD.bazel"
          )
          zuma_ramdisk = Path(
              "private/devices/google/zuma/vendor_ramdisk.modules.zuma"
          )
          shusky_ramdisk = Path(
              "private/devices/google/shusky/vendor_ramdisk.modules.shusky"
          )
          text = build.read_text()
          fips_label = os.environ["FIPS_ABI_LABEL"]
          if "nethunter_fips_defconfig" not in text:
              old = '"shusky_defconfig"'
              if old not in text:
                  raise SystemExit(
                      "ERROR: shusky_defconfig not found"
                  )
              text = text.replace(
                  old,
                  old + ',\n        "nethunter_fips_defconfig"',
                  1
              )
          if "additional_kmi_symbol_lists" not in text:
              old = (
                  'kmi_symbol_list = '
                  '"//common:android/abi_gki_aarch64_pixel",'
              )
              if old not in text:
                  raise SystemExit(
                      "ERROR: Strict Pixel ABI declaration not found"
                  )
              text = text.replace(
                  old,
                  old + f'''
              additional_kmi_symbol_lists = [
                  "{fips_label}",
              ],''',
                  1
              )
          elif fips_label not in text:
              raise SystemExit(
                  "ERROR: Existing additional_kmi_symbol_lists "
                  "does not contain the FIPS ABI label."
              )
          if '"crypto/fips140.ko"' not in text:
              old = "module_outs = ZUMA_MODULE_OUTS,"
              if old not in text:
                  raise SystemExit(
                      "ERROR: module_outs = ZUMA_MODULE_OUTS not found"
                  )
              text = text.replace(
                  old,
                  'module_outs = ZUMA_MODULE_OUTS + '
                  '["crypto/fips140.ko"],',
                  1
              )
          build.write_text(text)
          fips_entry = "kernel/crypto/fips140.ko"
          zuma_lines = zuma_ramdisk.read_text().splitlines()
          if fips_entry not in zuma_lines:
              # Preserve Google's existing module ordering.
              # Do not assume FIPS must be the first module.
              zuma_lines.append(fips_entry)
              zuma_ramdisk.write_text(
                  "\n".join(zuma_lines) + "\n"
              )
          shusky_lines = shusky_ramdisk.read_text().splitlines()
          if fips_entry in shusky_lines:
              raise SystemExit(
                  "ERROR: FIPS entry already exists in Shusky list; "
                  "review the existing integration before continuing."
              )
          print("Shusky BUILD updated.")
          print("FIPS ABI:", fips_label)
          print("FIPS module added to module_outs.")
          print("FIPS added to Zuma ramdisk list.")
          print("Existing Zuma module ordering preserved.")
          PY
          echo "=== Verify FIPS entry in Zuma ramdisk list ==="
          grep -n -F \
            'kernel/crypto/fips140.ko' \
            private/devices/google/zuma/vendor_ramdisk.modules.zuma
          echo
          echo "=== First entries (ordering retained for diagnosis) ==="
          sed -n '1,12p' \
            private/devices/google/zuma/vendor_ramdisk.modules.zuma

      - name: Verify Bazel targets before compilation
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          bazel query "$FIPS_ABI_LABEL" \
            --output=label
          bazel query \
            '//private/devices/google/shusky:zuma_shusky_dist' \
            --output=label
          grep -n \
            'abi_gki_aarch64_pixel' \
            private/devices/google/shusky/BUILD.bazel
          grep -n \
            "$FIPS_ABI_LABEL" \
            private/devices/google/shusky/BUILD.bazel
          grep -n \
            'crypto/fips140.ko' \
            private/devices/google/shusky/BUILD.bazel
          echo "Pre-build verification: PASS" \
            | tee "$REPORT_DIR/pre-build-verification.txt"

      - name: Build Shusky Native FIPS kernel
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          ./private/devices/google/shusky/build_shusky.sh \
            --kernel_package=@//aosp \
            --//build/kernel/kleaf:use_prebuilt_gki=false \
            --no//private/devices/google/common:download_prebuilt_gki_fips140 \
            --verbose_failures \
            --sandbox_debug \
            2>&1 | tee "$REPORT_DIR/build.log"

      - name: Preserve generated vendor_kernel_boot image
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          mkdir -p out/shusky/dist
          mapfile -t VENDOR_KERNEL_BOOT_CANDIDATES < <(
            find out/bazel/output_user_root \
              -type f \
              -path '*/out/android14-6.1/dist/vendor_kernel_boot.img' \
              -print 2>/dev/null
          )
          if [ "${#VENDOR_KERNEL_BOOT_CANDIDATES[@]}" -ne 1 ]; then
            printf 'Expected exactly one generated vendor_kernel_boot.img; found %s\\n' "${#VENDOR_KERNEL_BOOT_CANDIDATES[@]}"
            printf '%s\\n' "${VENDOR_KERNEL_BOOT_CANDIDATES[@]}"
            exit 1
          fi
          cp "${VENDOR_KERNEL_BOOT_CANDIDATES[0]}" out/shusky/dist/vendor_kernel_boot.img
          test "$(dd if=out/shusky/dist/vendor_kernel_boot.img bs=8 count=1 2>/dev/null)" = "VNDRBOOT"
          sha256sum out/shusky/dist/vendor_kernel_boot.img \
            | tee "$REPORT_DIR/vendor-kernel-boot-sha256.txt"
          stat -c 'vendor_kernel_boot.img bytes: %s' out/shusky/dist/vendor_kernel_boot.img \
            | tee "$REPORT_DIR/vendor-kernel-boot-size.txt"

      - name: Verify final FIPS kernel configuration
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          mkdir -p "$REPORT_DIR"
          REPORT="$REPORT_DIR/fips-config.txt"
          CONFIG_LIST="$REPORT_DIR/shusky-config-files.txt"
          : > "$REPORT"
          : > "$CONFIG_LIST"
          echo "=== Find the actual Shusky kernel configuration ==="
          mapfile -t CONFIGS < <(
            find out/bazel \
              -type f \
              -path '*/private/devices/google/shusky/kernel/.config' \
              -print
          )
          if [ "${#CONFIGS[@]}" -eq 0 ]; then
            echo "ERROR: Shusky kernel .config not found."
            echo "Available .config files:"
            find out -type f -name .config -print
            exit 1
          fi
          if [ "${#CONFIGS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one Shusky kernel config."
            echo "Found: ${#CONFIGS[@]}"
            printf '%s\n' "${CONFIGS[@]}"
            exit 1
          fi
          CONFIG="${CONFIGS[0]}"
          printf '%s\n' "$CONFIG" | tee "$CONFIG_LIST"
          echo
          echo "Selected Shusky config: $CONFIG"
          {
            echo "Selected config: $CONFIG"
            echo
            echo "=== FIPS settings ==="
            grep -E \
              '^(CONFIG_CRYPTO_FIPS140_MOD=|# CONFIG_CRYPTO_FIPS140_MOD is not set|CONFIG_CRYPTO_FIPS140_MERGE_MOD_SECTIONS=)' \
              "$CONFIG" || true
          } | tee "$REPORT"
          if ! grep -q '^CONFIG_CRYPTO_FIPS140_MOD=m$' "$CONFIG"; then
            echo "ERROR: CONFIG_CRYPTO_FIPS140_MOD=m is missing."
            exit 1
          fi
          echo "CONFIG_CRYPTO_FIPS140_MOD=m" >> "$REPORT"
          echo
          echo "=== Distribution config comparison ==="
          if [ -f out/shusky/dist/.config ]; then
            if grep -q '^CONFIG_CRYPTO_FIPS140_MOD=m$' \
              out/shusky/dist/.config; then
              echo "Distribution config: FIPS enabled."
            else
              echo "WARNING: FIPS setting not present in dist/.config."
              echo "The Shusky kernel config itself passed."
            fi
          else
            echo "Distribution .config not available."
          fi
          echo "FIPS_CONFIG=$CONFIG" >> "$GITHUB_ENV"
          echo
          echo "Native Shusky FIPS configuration: PASS"

      - name: Verify generated native FIPS module
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          MODULE="$(find . -type f \
            -path '*/crypto/fips140.ko' \
            -not -path './build-report/*' \
            -print -quit)"
          if [ -z "$MODULE" ]; then
            echo "ERROR: Native crypto/fips140.ko not found."
            exit 1
          fi
          echo "FIPS module: $MODULE"
          sha256sum "$MODULE" \
            | tee "$REPORT_DIR/fips140-sha256.txt"
          file "$MODULE" \
            | tee "$REPORT_DIR/fips140-file.txt"
          readelf -S "$MODULE" \
            | tee "$REPORT_DIR/fips140-sections.txt"
          grep -q '\.init\.rela\.text' \
            "$REPORT_DIR/fips140-sections.txt"
          grep -q '\.init\.rela\.rodata' \
            "$REPORT_DIR/fips140-sections.txt"
          echo "FIPS relocation sections: PASS"

      - name: Collect FIPS HMAC execution evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          grep -n -B8 -A18 \
            'CMD_FIPS140_GEN_HMAC\|cmd_gen_hmac\|fips140.ko' \
            aosp/arch/arm64/Makefile.postlink \
            | tee "$REPORT_DIR/fips-hmac-rule.txt"
          grep -niE \
            'fips140_gen_hmac|cmd_gen_hmac|gen_hmac' \
            "$REPORT_DIR/build.log" \
            | tee "$REPORT_DIR/fips-hmac-build-log.txt" || true
          find . -type f \
            \( -name '*.cmd' -o -name '*.log' \) \
            -not -path './build-report/*' \
            -print0 \
            | xargs -0 -r grep -niE \
              'fips140_gen_hmac|cmd_gen_hmac|gen_hmac' \
              2>/dev/null \
            | tee "$REPORT_DIR/fips-hmac-command-evidence.txt" || true
          echo "HMAC evidence collected."
          echo "Evidence must be reviewed; this step alone does not prove execution."

      - name: Verify generated vendor ramdisk modules.load
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          find . -type f \
            -name modules.load \
            -not -path './build-report/*' \
            -print \
            | sort \
            | tee "$REPORT_DIR/modules-load-files.txt"
          FOUND=0
          INDEX=0
          while IFS= read -r MODULES_LOAD; do
            [ -f "$MODULES_LOAD" ] || continue
            INDEX=$((INDEX + 1))
            echo
            echo "=== modules.load: $MODULES_LOAD ==="
            sed -n '1,35p' "$MODULES_LOAD"
            if grep -q 'fips140\.ko' "$MODULES_LOAD"; then
              FOUND=$((FOUND + 1))
              echo "FIPS entry found."
              cp "$MODULES_LOAD" \
                "$REPORT_DIR/modules-load-${INDEX}.txt"
              grep -n -B3 -A5 \
                'fips140\.ko' \
                "$MODULES_LOAD" \
                >> "$REPORT_DIR/fips-modules-load-position.txt"
            fi
          done < "$REPORT_DIR/modules-load-files.txt"
          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: No generated modules.load contains fips140.ko."
            exit 1
          fi
          {
            echo "modules.load files containing FIPS: $FOUND"
            echo "FIPS module entry: present"
            echo "Load order: recorded, not assumed"
          } | tee "$REPORT_DIR/modules-load-verification.txt"
          echo "FIPS modules.load presence verification: PASS"

      - name: Collect ramdisk and module dependency diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          cd "$WORKSPACE" || exit 0
          mkdir -p "$REPORT_DIR"
          echo "=== modules.load files ===" \
            | tee "$REPORT_DIR/ramdisk-diagnostics.txt"
          find out -type f \
            -name modules.load \
            -print 2>/dev/null \
            | sort \
            | tee "$REPORT_DIR/ramdisk-modules-load-paths.txt"
          echo \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          echo "=== FIPS-related module dependency entries ===" \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          find out -type f \
            \( -name modules.dep -o -name modules.softdep \) \
            -print0 2>/dev/null \
            | while IFS= read -r -d '' DEPFILE; do
                if grep -qE 'fips140|zsmalloc' "$DEPFILE"; then
                  echo \
                    | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
                  echo "FILE: $DEPFILE" \
                    | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
                  grep -n -B2 -A3 \
                    -E 'fips140|zsmalloc' \
                    "$DEPFILE" \
                    | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
                fi
              done
          echo \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          echo "=== Relevant ramdisk and boot image candidates ===" \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          find out/shusky out/bazel \
            -type f \
            \( -iname '*vendor*ramdisk*' \
            -o -iname '*initramfs*' \
            -o -name vendor_boot.img \
            -o -name boot.img \
            -o -name modules.load \
            -o -name modules.dep \
            -o -name modules.softdep \) \
            -print 2>/dev/null \
            | sort -u \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          echo \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          echo "=== Final distribution modules.load ===" \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          if [ -f out/shusky/dist/modules.load ]; then
            sed -n '1,100p' out/shusky/dist/modules.load \
              | tee "$REPORT_DIR/final-dist-modules.load"
            if grep -q 'fips140\.ko' out/shusky/dist/modules.load; then
              echo "FIPS is present in final dist/modules.load." \
                | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
            else
              echo "FIPS is NOT present in final dist/modules.load." \
                | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
            fi
          else
            echo "Final dist/modules.load does not exist." \
              | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          fi
          echo \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          echo "=== Image file types ===" \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          find out/shusky/dist \
            -type f \
            \( -name '*.img' -o -name '*ramdisk*' \) \
            -print0 2>/dev/null \
            | while IFS= read -r -d '' IMAGE_FILE; do
                file "$IMAGE_FILE"
              done \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          echo "Ramdisk diagnostics collected."

      - name: Verify excluded Wi-Fi modules
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          if find . -type f \
            \( -name '*rtl8187*.ko' \
            -o -name '*mt76*.ko' \) \
            -not -path './build-report/*' \
            | grep .; then
            echo "ERROR: RTL8187 or MT76 module found."
            exit 1
          fi
          echo "RTL8187: excluded"
          echo "MT76: excluded"

      - name: Collect build outputs and reports
        if: always()
        shell: bash
        run: |
          set +e
          cd "$WORKSPACE" || exit 0
          mkdir -p "$REPORT_DIR"
          {
            echo "Build report generated: $(date -u)"
            echo
            echo "=== FIPS module candidates ==="
            find . -type f \
              -path '*/crypto/fips140.ko' \
              -not -path './build-report/*' \
              -exec sha256sum {} \;
            echo
            echo "=== Kernel images ==="
            find . -type f \
              \( -name Image \
              -o -name Image.lz4 \
              -o -name boot.img \
              -o -name vendor_boot.img \
              -o -name vendor_kernel_boot.img \
              -o -name vendor_dlkm.img \
              -o -name system_dlkm.img \
              -o -name dtbo.img \) \
              -print
          } | tee "$REPORT_DIR/build-summary.txt"

      - name: Package Native FIPS build artifacts
        if: always()
        shell: bash
        run: |
          set +e
          cd "$WORKSPACE" || exit 0
          mkdir -p "$REPORT_DIR/package"
          find . -type f \
            \( -name Image \
            -o -name Image.lz4 \
            -o -name boot.img \
            -o -name vendor_boot.img \
            -o -name vendor_kernel_boot.img \
            -o -name vendor_dlkm.img \
            -o -name system_dlkm.img \
            -o -name dtbo.img \
            -o -name fips140.ko \
            -o -name modules.load \
            -o -name modules.dep \
            -o -name modules.softdep \) \
            -not -path './build-report/package/*' \
            -not -path './build-report/*' \
            -exec cp --parents {} "$REPORT_DIR/package/" \;
          zip -qr \
            shiba-nethunter-native-fips-build-test.zip \
            build-report \
            2>/dev/null || true

      - name: Upload Native FIPS build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiba-nethunter-native-fips-build-test
          path: |
            workspace/build-report/
            workspace/shiba-nethunter-native-fips-build-test.zip
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14

  # audit-only route: keep the native kernel build job skipped for audit commits.
  audit-existing-build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'audit-only')) }}
    name: Audit completed Native FIPS build #79
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download completed build #73 artifact
        uses: actions/download-artifact@v4
        with:
          name: shiba-nethunter-native-fips-build-test
          repository: ${{ github.repository }}
          run-id: 44181178426
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: audit-input

      - name: Install image inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cpio lz4 e2fsprogs file python3 curl unzip zstd

      - name: Unpack and audit vendor_kernel_boot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-report unpacked
          # The artifact contains intermediate Bazel copies as well as the final dist image.
          # Audit only the final image copied into out/shusky/dist.
          mapfile -t IMAGES < <(find audit-input -type f \
            -path '*/build-report/package/out/shusky/dist/vendor_kernel_boot.img' \
            -print)
          if [ "${#IMAGES[@]}" -ne 1 ]; then
            echo "Expected exactly one packaged final-dist vendor_kernel_boot.img; found ${#IMAGES[@]}"
            printf '%s\\n' "${IMAGES[@]}"
            exit 1
          fi
          IMAGE="${IMAGES[0]}"
          {
            echo "Source: $IMAGE"
            stat -c 'Size: %s bytes' "$IMAGE"
            sha256sum "$IMAGE"
            file "$IMAGE"
            test "$(dd if="$IMAGE" bs=8 count=1 2>/dev/null)" = "VNDRBOOT"
            echo "VNDRBOOT header: PASS"
          } | tee audit-report/vendor-kernel-boot-image.txt

          curl -fsSL             'https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main/unpack_bootimg.py?format=TEXT'             | base64 -d > unpack_bootimg.py
          python3 unpack_bootimg.py --boot_img "$IMAGE" --out unpacked             2>&1 | tee audit-report/unpack-bootimg.txt

          find unpacked -maxdepth 2 -type f -printf '%p %s bytes\n'             | sort | tee audit-report/unpacked-files.txt

          mkdir -p ramdisk-extracted
          INDEX=0
          while IFS= read -r -d '' PART; do
            INDEX=$((INDEX + 1))
            DEST="ramdisk-extracted/part-$INDEX"
            mkdir -p "$DEST"
            echo "=== $PART ===" | tee -a audit-report/ramdisk-extraction.txt
            file "$PART" | tee -a audit-report/ramdisk-extraction.txt
            if lz4 -t "$PART" >/dev/null 2>&1; then
              lz4 -dc "$PART" | (cd "$DEST" && cpio -idm --quiet)
            elif gzip -t "$PART" >/dev/null 2>&1; then
              gzip -dc "$PART" | (cd "$DEST" && cpio -idm --quiet)
            elif zstd -t "$PART" >/dev/null 2>&1; then
              zstd -dc "$PART" | (cd "$DEST" && cpio -idm --quiet)
            else
              (cd "$DEST" && cpio -idm --quiet < "$GITHUB_WORKSPACE/$PART")                 || echo "Could not unpack as uncompressed cpio: $PART"                   | tee -a audit-report/ramdisk-extraction.txt
            fi
            find "$DEST" -type f \( -name modules.load -o -name modules.dep               -o -name modules.softdep -o -name fips140.ko               -o -name ufs-pixel-fips140.ko -o -name iovad-vendor-hooks.ko \)               -printf '%p %s bytes\n'               | tee -a audit-report/ramdisk-relevant-files.txt
          done < <(find unpacked -maxdepth 1 -type f -name 'vendor_ramdisk*' -print0 | sort -z)

          find ramdisk-extracted -type f -name modules.load -print0             | while IFS= read -r -d '' F; do
                echo "=== $F ==="
                nl -ba "$F"
              done > audit-report/all-modules-load.txt
          find ramdisk-extracted -type f \( -name modules.dep -o -name modules.softdep \) -print0             | while IFS= read -r -d '' F; do
                echo "=== $F ==="
                grep -n -E 'fips140|ufs-pixel-fips140|iovad-vendor-hooks' "$F" || true
              done > audit-report/fips-module-dependencies.txt

          {
            echo "=== Required module presence ==="
            for M in fips140.ko ufs-pixel-fips140.ko; do
              if find ramdisk-extracted -type f -name "$M" | grep -q .; then
                echo "$M: PRESENT"
              else
                echo "$M: MISSING"
              fi
            done
            echo
            echo "=== Load order references ==="
            grep -n -E 'fips140|ufs-pixel-fips140' audit-report/all-modules-load.txt || true
          } | tee audit-report/fips-presence-and-order.txt

          # Record hashes and sizes of all key packaged images.
          find audit-input -type f \( -name boot.img -o -name dtbo.img             -o -name system_dlkm.img -o -name vendor_dlkm.img             -o -name vendor_kernel_boot.img \) -print0             | sort -z | xargs -0 -r sha256sum             > audit-report/key-image-sha256.txt
          find audit-input -type f \( -name boot.img -o -name dtbo.img             -o -name system_dlkm.img -o -name vendor_dlkm.img             -o -name vendor_kernel_boot.img \) -printf '%f %s bytes\n'             | sort > audit-report/key-image-sizes.txt

          zip -qr shiba-native-fips-audit-report.zip audit-report
      - name: Upload focused audit report
        uses: actions/upload-artifact@v4
        with:
          name: shiba-native-fips-audit-run73
          path: |
            audit-report/
            shiba-native-fips-audit-report.zip
          if-no-files-found: error
          retention-days: 14
