
name: Build Pixel 8 Shiba - NetHunter Native FIPS Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shiba-nethunter-native-fips
  cancel-in-progress: false

jobs:
  build-kernel:
    name: Build and verify Shiba Native FIPS kernel
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEVICE: shiba
      KERNEL_DEVICE: shusky
      CUSTOM_KERNEL_VERSION: "1.33"
      WORKSPACE: ${{ github.workspace }}/workspace
      REPORT_DIR: ${{ github.workspace }}/workspace/build-report

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker image prune -af || true

          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            cmake \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            lz4 \
            make \
            openssl \
            pahole \
            python3 \
            python3-pip \
            python3-venv \
            rsync \
            unzip \
            zip \
            zstd

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod a+x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" version

      - name: Initialize Google kernel workspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-shusky-6.1-android16 \
            --depth=1

      - name: Sync Google kernel sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          repo sync \
            -c \
            -j"$(nproc)" \
            --no-clone-bundle \
            --no-tags

      - name: Prepare build reports
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$REPORT_DIR"

          {
            echo "Build started: $(date -u)"
            echo "Target: //private/devices/google/shusky:zuma_shusky_dist"
            echo "Build type: Native FIPS integration test"
            echo "Pixel KMI: strict"
            echo "FIPS ABI: supplemental"
            echo "FIPS module: native in-tree"
            echo "FIPS HMAC postlink: required"
            echo "KernelSU Inline: disabled"
            echo "RTL8187: excluded"
            echo "MT76: excluded"
            echo "Phone flash: disabled"
          } | tee "$REPORT_DIR/build-info.txt"

      - name: Verify native FIPS sources and locate ABI files
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          echo "=== Native FIPS source files ==="

          for FILE in \
            aosp/crypto/Kconfig \
            aosp/crypto/Makefile \
            aosp/crypto/fips140-module.c \
            aosp/crypto/fips140_gen_hmac.c \
            aosp/arch/arm64/Makefile.postlink
          do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing native FIPS source: $FILE"
              exit 1
            fi

            echo "FOUND: $FILE"
          done

          echo
          echo "=== ABI files ==="

          PIXEL_ABI="aosp/android/abi_gki_aarch64_pixel"
          FIPS_ABI="aosp/android/abi_gki_aarch64_fips140"

          if [ ! -f "$PIXEL_ABI" ]; then
            echo "ERROR: Pixel ABI not found: $PIXEL_ABI"
            exit 1
          fi

          if [ ! -f "$FIPS_ABI" ]; then
            echo "ERROR: FIPS ABI not found: $FIPS_ABI"
            exit 1
          fi

          echo "Pixel ABI: $PIXEL_ABI"
          echo "FIPS ABI: $FIPS_ABI"

          echo "PIXEL_ABI=$PIXEL_ABI" >> "$GITHUB_ENV"
          echo "FIPS_ABI=$FIPS_ABI" >> "$GITHUB_ENV"

          {
            echo "Pixel ABI: PASS"
            echo "FIPS ABI: PASS"
            echo "Native FIPS sources: PASS"
          } | tee "$REPORT_DIR/fips-source-verification.txt"

      - name: Verify FIPS Kconfig and ARM64 HMAC postlink
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          echo "=== FIPS Kconfig ==="

          grep -n -B5 -A15 \
            'CRYPTO_FIPS140_MOD' \
            aosp/crypto/Kconfig \
            | tee "$REPORT_DIR/fips-kconfig.txt"

          echo
          echo "=== Crypto Makefile ==="

          grep -n -B5 -A8 \
            'fips140' \
            aosp/crypto/Makefile \
            | tee "$REPORT_DIR/fips-crypto-makefile.txt"

          echo
          echo "=== ARM64 postlink ==="

          grep -n -B8 -A18 \
            'CMD_FIPS140_GEN_HMAC\|cmd_gen_hmac\|fips140.ko' \
            aosp/arch/arm64/Makefile.postlink \
            | tee "$REPORT_DIR/fips-hmac-postlink-source.txt"

          if ! grep -q 'CMD_FIPS140_GEN_HMAC' \
            aosp/arch/arm64/Makefile.postlink; then
            echo "ERROR: FIPS HMAC postlink command not found."
            exit 1
          fi

          if ! grep -q 'cmd_gen_hmac' \
            aosp/arch/arm64/Makefile.postlink; then
            echo "ERROR: FIPS HMAC command definition not found."
            exit 1
          fi

          echo "FIPS source and postlink checks: PASS"

      - name: Resolve and export FIPS ABI Bazel target
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          ABI_FILE="abi_gki_aarch64_fips140"
          ABI_LABEL=""

          echo "=== Bazel package layout ==="

          find aosp -maxdepth 3 \
            \( -name BUILD -o -name BUILD.bazel \) \
            -print \
            | tee "$REPORT_DIR/aosp-build-files.txt"

          if [ -f "aosp/android/BUILD.bazel" ]; then
            ABI_PACKAGE_FILE="aosp/android/BUILD.bazel"
            ABI_LABEL="//aosp/android:${ABI_FILE}"
            ABI_RELATIVE="$ABI_FILE"

          elif [ -f "aosp/android/BUILD" ]; then
            ABI_PACKAGE_FILE="aosp/android/BUILD"
            ABI_LABEL="//aosp/android:${ABI_FILE}"
            ABI_RELATIVE="$ABI_FILE"

          elif [ -f "aosp/BUILD.bazel" ]; then
            ABI_PACKAGE_FILE="aosp/BUILD.bazel"
            ABI_LABEL="//aosp:android/${ABI_FILE}"
            ABI_RELATIVE="android/${ABI_FILE}"

          elif [ -f "aosp/BUILD" ]; then
            ABI_PACKAGE_FILE="aosp/BUILD"
            ABI_LABEL="//aosp:android/${ABI_FILE}"
            ABI_RELATIVE="android/${ABI_FILE}"

          else
            echo "No AOSP root BUILD file found."
            echo "Creating a dedicated aosp/BUILD.bazel export package."

            ABI_PACKAGE_FILE="aosp/BUILD.bazel"
            ABI_LABEL="//aosp:android/${ABI_FILE}"
            ABI_RELATIVE="android/${ABI_FILE}"

            cat > "$ABI_PACKAGE_FILE" <<'EOF'
          exports_files([
              "android/abi_gki_aarch64_pixel",
              "android/abi_gki_aarch64_fips140",
          ])
          EOF
          fi

          echo "ABI package file: $ABI_PACKAGE_FILE"
          echo "ABI label: $ABI_LABEL"

          if ! grep -Fq "$ABI_RELATIVE" "$ABI_PACKAGE_FILE"; then
            cat >> "$ABI_PACKAGE_FILE" <<EOF

          # Export Google native FIPS ABI for Shusky.
          exports_files([
              "$ABI_RELATIVE",
          ])
          EOF
          fi

          echo "=== Verify FIPS ABI Bazel target ==="

          bazel query "$ABI_LABEL" \
            --output=label \
            | tee "$REPORT_DIR/fips-abi-bazel-query.txt"

          echo "FIPS_ABI_LABEL=$ABI_LABEL" >> "$GITHUB_ENV"

      - name: Verify Shusky build definitions
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          BUILD_FILE="private/devices/google/shusky/BUILD.bazel"

          test -f "$BUILD_FILE"
          test -f private/devices/google/shusky/build_shusky.sh
          test -f private/devices/google/zuma/constants.bzl

          echo "=== Shusky BUILD ==="
          sed -n '1,240p' "$BUILD_FILE"

          echo
          echo "=== Relevant module and ramdisk definitions ==="

          grep -n -B5 -A12 \
            'ZUMA_MODULE_OUTS\|vendor_ramdisk.modules.zuma\|shusky_defconfig\|kmi_symbol_list' \
            "$BUILD_FILE"

      - name: Integrate native FIPS into Shusky BUILD
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          python3 <<'PY'
          import os
          from pathlib import Path

          build = Path(
              "private/devices/google/shusky/BUILD.bazel"
          )

          text = build.read_text()
          fips_label = os.environ["FIPS_ABI_LABEL"]

          # Add FIPS config fragment to the existing Shusky fragments.
          if "nethunter_fips_defconfig" not in text:
              old = '"shusky_defconfig"'

              if old not in text:
                  raise SystemExit(
                      "ERROR: shusky_defconfig entry not found"
                  )

              text = text.replace(
                  old,
                  old + ',\n        "nethunter_fips_defconfig"',
                  1
              )

          # Preserve strict Pixel ABI and add native FIPS ABI.
          if "additional_kmi_symbol_lists" not in text:
              old = (
                  'kmi_symbol_list = '
                  '"//common:android/abi_gki_aarch64_pixel",'
              )

              if old not in text:
                  raise SystemExit(
                      "ERROR: Strict Pixel KMI declaration not found"
                  )

              text = text.replace(
                  old,
                  old + f'''
              additional_kmi_symbol_lists = [
                  "{fips_label}",
              ],''',
                  1
              )

          else:
              if fips_label not in text:
                  raise SystemExit(
                      "ERROR: additional_kmi_symbol_lists already exists "
                      "but does not contain the resolved FIPS ABI label. "
                      "Manual merge is required."
                  )

          # Include the native FIPS module in the kernel build outputs.
          if '"crypto/fips140.ko"' not in text:
              old = "module_outs = ZUMA_MODULE_OUTS,"

              if old not in text:
                  raise SystemExit(
                      "ERROR: module_outs = ZUMA_MODULE_OUTS not found"
                  )

              text = text.replace(
                  old,
                  'module_outs = ZUMA_MODULE_OUTS + '
                  '["crypto/fips140.ko"],',
                  1
              )

          # Add the FIPS ramdisk list before the Zuma ramdisk list.
          if "vendor_ramdisk.modules.fips140" not in text:
              old = (
                  '"//private/devices/google/zuma:'
                  'vendor_ramdisk.modules.zuma"'
              )

              if old not in text:
                  raise SystemExit(
                      "ERROR: Zuma vendor ramdisk list reference not found"
                  )

              text = text.replace(
                  old,
                  '"//private/devices/google/shusky:'
                  'vendor_ramdisk.modules.fips140",\n        ' + old,
                  1
              )

          build.write_text(text)

          print("Shusky BUILD updated.")
          print("FIPS ABI label:", fips_label)
          PY

          echo "=== Verify Shusky FIPS integration ==="

          grep -n -B4 -A8 \
            'nethunter_fips_defconfig\|abi_gki_aarch64_fips140\|crypto/fips140.ko\|vendor_ramdisk.modules.fips140' \
            private/devices/google/shusky/BUILD.bazel

      - name: Create FIPS config fragment and ramdisk module list
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          cat > \
            private/devices/google/shusky/nethunter_fips_defconfig <<'EOF'
          CONFIG_CRYPTO_FIPS140_MOD=m
          EOF

          cat > \
            private/devices/google/shusky/vendor_ramdisk.modules.fips140 <<'EOF'
          kernel/crypto/fips140.ko
          EOF

          echo "=== FIPS config fragment ==="

          cat \
            private/devices/google/shusky/nethunter_fips_defconfig

          echo
          echo "=== FIPS ramdisk module list ==="

          cat \
            private/devices/google/shusky/vendor_ramdisk.modules.fips140

      - name: Verify Bazel targets before compilation
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          echo "=== FIPS ABI target ==="

          bazel query "$FIPS_ABI_LABEL" \
            --output=label

          echo
          echo "=== Shusky distribution target ==="

          bazel query \
            '//private/devices/google/shusky:zuma_shusky_dist' \
            --output=label

          echo
          echo "=== Verify strict Pixel ABI ==="

          grep -n \
            'abi_gki_aarch64_pixel' \
            private/devices/google/shusky/BUILD.bazel

          echo
          echo "=== Verify supplemental FIPS ABI ==="

          grep -n \
            "$FIPS_ABI_LABEL" \
            private/devices/google/shusky/BUILD.bazel

          echo
          echo "=== Verify FIPS module output ==="

          grep -n \
            'crypto/fips140.ko' \
            private/devices/google/shusky/BUILD.bazel

          echo
          echo "=== Verify excluded drivers ==="

          if grep -RniE \
            'rtl8187|mt76' \
            private/devices/google/shusky \
            private/devices/google/zuma/constants.bzl; then
            echo "ERROR: RTL8187 or MT76 reference found."
            exit 1
          fi

          echo "Pre-build checks: PASS" \
            | tee "$REPORT_DIR/pre-build-verification.txt"

      - name: Build Shusky Native FIPS kernel
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          ./private/devices/google/shusky/build_shusky.sh \
            --kernel_package=@//aosp \
            --//build/kernel/kleaf:use_prebuilt_gki=false \
            --no//private/devices/google/common:download_prebuilt_gki_fips140 \
            --verbose_failures \
            2>&1 | tee "$REPORT_DIR/build.log"

      - name: Locate final kernel configuration
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          find . -type f \
            -name .config \
            -print \
            | tee "$REPORT_DIR/config-files.txt"

          CONFIG="$(find . -type f \
            -name .config \
            -print -quit)"

          if [ -z "$CONFIG" ]; then
            echo "ERROR: Kernel .config not found."
            exit 1
          fi

          echo "Kernel config: $CONFIG"

          grep -E \
            'CONFIG_CRYPTO_FIPS140_MOD=|CONFIG_CRYPTO_FIPS140_MERGE_MOD_SECTIONS=' \
            "$CONFIG" \
            | tee "$REPORT_DIR/fips-config.txt" || true

          if ! grep -q \
            '^CONFIG_CRYPTO_FIPS140_MOD=m$' \
            "$CONFIG"; then
            echo "ERROR: FIPS module is not enabled as a module."
            exit 1
          fi

          echo "FIPS module config: PASS"

      - name: Verify native FIPS module
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          MODULE="$(find . -type f \
            -path '*/crypto/fips140.ko' \
            -print -quit)"

          if [ -z "$MODULE" ]; then
            echo "ERROR: Native crypto/fips140.ko not found."
            exit 1
          fi

          echo "FIPS module: $MODULE"

          sha256sum "$MODULE" \
            | tee "$REPORT_DIR/fips140-sha256.txt"

          file "$MODULE" \
            | tee "$REPORT_DIR/fips140-file.txt"

          readelf -S "$MODULE" \
            | tee "$REPORT_DIR/fips140-sections.txt"

          echo "=== Check relocation sections ==="

          grep -E \
            '\.init\.rela\.text|\.init\.rela\.rodata' \
            "$REPORT_DIR/fips140-sections.txt" \
            || true

          if ! grep -q '\.init\.rela\.text' \
            "$REPORT_DIR/fips140-sections.txt"; then
            echo "ERROR: .init.rela.text section missing."
            exit 1
          fi

          if ! grep -q '\.init\.rela\.rodata' \
            "$REPORT_DIR/fips140-sections.txt"; then
            echo "ERROR: .init.rela.rodata section missing."
            exit 1
          fi

          echo "FIPS module and relocation sections: PASS"

      - name: Collect FIPS HMAC execution evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          echo "=== HMAC generator source ==="

          test -f aosp/crypto/fips140_gen_hmac.c

          echo "=== Search build logs and command files ==="

          {
            grep -RniE \
              'fips140_gen_hmac|cmd_gen_hmac|gen_hmac' \
              "$REPORT_DIR/build.log" \
              2>/dev/null || true

            find . -type f \
              \( -name '*.cmd' -o -name '*.log' \) \
              -not -path './build-report/*' \
              -print0 \
              | xargs -0 -r grep -niE \
                'fips140_gen_hmac|cmd_gen_hmac|gen_hmac' \
                2>/dev/null || true
          } | tee "$REPORT_DIR/fips-hmac-execution-evidence.txt"

          echo
          echo "=== HMAC postlink rule ==="

          grep -n -B8 -A18 \
            'CMD_FIPS140_GEN_HMAC\|cmd_gen_hmac\|fips140.ko' \
            aosp/arch/arm64/Makefile.postlink \
            | tee "$REPORT_DIR/fips-hmac-rule.txt"

          if [ ! -s "$REPORT_DIR/fips-hmac-execution-evidence.txt" ]; then
            echo "WARNING: No direct HMAC execution record found."
            echo "Do not treat the HMAC step as proven."
          fi

          echo "HMAC evidence collection completed."

      - name: Verify FIPS module in generated ramdisk lists
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          find . -type f \
            -name modules.load \
            -print \
            | tee "$REPORT_DIR/modules-load-files.txt"

          FOUND=0

          while IFS= read -r MODULES_LOAD; do
            [ -f "$MODULES_LOAD" ] || continue

            if grep -q 'fips140.ko' "$MODULES_LOAD"; then
              FOUND=1

              echo "FIPS found in: $MODULES_LOAD"

              sed -n '1,25p' "$MODULES_LOAD"

              FIRST="$(
                grep -v '^[[:space:]]*$' "$MODULES_LOAD" \
                  | head -n 1
              )"

              case "$FIRST" in
                kernel/crypto/fips140.ko|crypto/fips140.ko|fips140.ko)
                  echo "FIPS is first in this modules.load."
                  ;;
                *)
                  echo "ERROR: FIPS is not first."
                  echo "First entry: $FIRST"
                  exit 1
                  ;;
              esac

              cp "$MODULES_LOAD" \
                "$REPORT_DIR/$(basename "$(dirname "$MODULES_LOAD")")-modules.load"
            fi
          done < "$REPORT_DIR/modules-load-files.txt"

          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: No generated modules.load contains fips140.ko."
            exit 1
          fi

          echo "FIPS modules.load check: PASS"

      - name: Verify excluded Wi-Fi modules
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          echo "=== Check generated modules ==="

          if find . -type f \
            \( -name '*rtl8187*.ko' \
            -o -name '*mt76*.ko' \) \
            -not -path './build-report/*' \
            | grep .; then
            echo "ERROR: RTL8187 or MT76 module found."
            exit 1
          fi

          echo "RTL8187: excluded"
          echo "MT76: excluded"

      - name: Collect build outputs and reports
        if: always()
        shell: bash
        run: |
          set +e
          cd "$WORKSPACE"

          mkdir -p "$REPORT_DIR"

          {
            echo "Build report generated: $(date -u)"
            echo
            echo "=== FIPS module candidates ==="

            find . -type f \
              -path '*/crypto/fips140.ko' \
              -exec sha256sum {} \;

            echo
            echo "=== Kernel images ==="

            find . -type f \
              \( -name Image \
              -o -name Image.lz4 \
              -o -name boot.img \
              -o -name vendor_boot.img \
              -o -name vendor_dlkm.img \
              -o -name system_dlkm.img \
              -o -name dtbo.img \) \
              -print
          } | tee "$REPORT_DIR/build-summary.txt"

      - name: Package Native FIPS build artifacts
        if: always()
        shell: bash
        run: |
          set +e
          cd "$WORKSPACE"

          mkdir -p "$REPORT_DIR/package"

          find . -type f \
            \( -name Image \
            -o -name Image.lz4 \
            -o -name boot.img \
            -o -name vendor_boot.img \
            -o -name vendor_dlkm.img \
            -o -name system_dlkm.img \
            -o -name dtbo.img \
            -o -name fips140.ko \) \
            -not -path './build-report/package/*' \
            -exec cp --parents {} "$REPORT_DIR/package/" \;

          cd "$WORKSPACE"

          zip -qr \
            shiba-nethunter-native-fips-build-test.zip \
            build-report \
            2>/dev/null || true

      - name: Upload Native FIPS build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiba-nethunter-native-fips-build-test
          path: |
            workspace/build-report/
            workspace/shiba-nethunter-native-fips-build-test.zip
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
