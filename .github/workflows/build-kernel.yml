name: Diagnose Bazel Exports and ABI Paths

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose-bazel:
    name: Diagnose Bazel exports and ABI paths
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python3-pip python-is-python3 \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves zip unzip rsync ccache file \
            kmod xz-utils zstd binutils

      - name: Install Android repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize Google kernel repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace
          cd workspace
          repo init \
            --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-shusky-6.1-android16

      - name: Sync Google kernel source
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          cd workspace
          repo sync \
            --current-branch \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2 \
            --fail-fast

      # ================================================
      # DIAGNOSTISCHE STAP (EXACT ZOALS DE EXPERT VROEG)
      # ================================================
      - name: Inspect common Bazel package
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/workspace"

          echo "=== COMMON BUILD SYMLINK ==="
          readlink -f "$ROOT/common/BUILD.bazel" || true

          echo
          echo "=== COMMON BUILD CONTENT ==="
          sed -n '1,240p' \
            "$ROOT/private/devices/google/common/kleaf/common.BUILD.bazel" || true

          echo
          echo "=== COMMON DIRECTORY CONTENTS ==="
          find "$ROOT/common" -maxdepth 3 \( -type f -o -type l \) || true

          echo
          echo "=== ABI EXPORT REFERENCES ==="
          grep -n -B5 -A10 \
            'exports_files\|abi_gki\|glob(' \
            "$ROOT/private/devices/google/common/kleaf/common.BUILD.bazel" \
            || true

          echo
          echo "=== COMPLETE ==="
          
          # Stop de workflow hier, we willen nog geen kernel bouwen.
          exit 1
      # ================================================