name: Diagnose ABI Paths and Bazel Labels

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose-paths:
    name: Diagnose Bazel and ABI paths
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python3-pip python-is-python3 \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves zip unzip rsync ccache file \
            kmod xz-utils zstd binutils

      - name: Install Android repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize Google kernel repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace
          cd workspace
          repo init \
            --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-shusky-6.1-android16

      - name: Sync Google kernel source
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          cd workspace
          repo sync \
            --current-branch \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2 \
            --fail-fast

      # ================================================
      # DIAGNOSTISCHE STAP (EXACT ZOALS DE EXPERT VROEG)
      # ================================================
      - name: Verify ABI paths and Bazel labels
        shell: bash
        run: |
          set -uo pipefail

          ROOT="$GITHUB_WORKSPACE/workspace"

          echo "=== COMMON DIRECTORY ==="
          ls -lad "$ROOT/common" "$ROOT/aosp"
          ls -la "$ROOT/common" | head -30

          echo
          echo "=== SHUSKY KMI LABELS ==="
          grep -n -B5 -A12 \
            'kmi_symbol_list\|additional_kmi_symbol_lists' \
            "$ROOT/private/devices/google/shusky/BUILD.bazel" || true

          echo
          echo "=== ABI FILES ==="
          ls -lh \
            "$ROOT/aosp/android/abi_gki_aarch64_pixel" \
            "$ROOT/aosp/android/abi_gki_aarch64_fips140"

          echo
          echo "=== BAZEL WORKSPACE REFERENCES ==="
          grep -RniE \
            'abi_gki_aarch64_pixel|abi_gki_aarch64_fips140|local_repository|repo_mapping' \
            "$ROOT/private/devices/google/shusky" \
            "$ROOT/private/devices/google/common" \
            --include='*.bzl' --include='BUILD*' --include='MODULE.bazel' \
            --include='WORKSPACE*' 2>/dev/null | head -100

          echo
          echo "=== DIAGNOSTICS COMPLETE ==="
          
          # Stop de workflow hier. We willen nog geen kernel bouwen.
          exit 1
      # ================================================