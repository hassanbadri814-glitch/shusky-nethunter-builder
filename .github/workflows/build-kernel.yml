
name: Build Pixel 8 Shiba - NetHunter Native FIPS Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shiba-nethunter-native-fips
  cancel-in-progress: false

jobs:
  build-kernel:
    name: Build and verify Shiba Native FIPS kernel
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEVICE: shiba
      KERNEL_DEVICE: shusky
      CUSTOM_KERNEL_VERSION: "1.33"
      WORKSPACE: ${{ github.workspace }}/workspace
      REPORT_DIR: ${{ github.workspace }}/workspace/build-report

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker image prune -af || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            cmake \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            lz4 \
            make \
            openssl \
            pahole \
            python3 \
            python3-pip \
            python3-venv \
            rsync \
            unzip \
            zip \
            zstd

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" version

      - name: Initialize Google kernel workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-shusky-6.1-android16 \
            --depth=1

      - name: Sync Google kernel sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          repo sync \
            -c \
            -j"$(nproc)" \
            --no-clone-bundle \
            --no-tags

      - name: Prepare build report directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "Build started: $(date -u)"
            echo "Target: //private/devices/google/shusky:zuma_shusky_dist"
            echo "Build type: Native FIPS integration test"
            echo "Pixel KMI: strict"
            echo "FIPS ABI: supplemental"
            echo "FIPS module: native in-tree"
            echo "FIPS HMAC postlink: required"
            echo "KernelSU Inline: disabled"
            echo "RTL8187: excluded"
            echo "MT76: excluded"
            echo "Phone flash: disabled"
          } | tee "$REPORT_DIR/build-info.txt"

      - name: Verify Google Shusky build files
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          test -f private/devices/google/shusky/BUILD.bazel
          test -f private/devices/google/shusky/build_shusky.sh
          test -f private/devices/google/zuma/constants.bzl
          test -f common/BUILD.bazel

          echo "=== Shusky BUILD ==="
          sed -n '1,240p' \
            private/devices/google/shusky/BUILD.bazel

          echo "=== Common BUILD ==="
          sed -n '1,220p' common/BUILD.bazel

      - name: Locate native FIPS sources and ABI files
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          echo "=== Native FIPS source files ==="

          find . -type f \
            \( -path '*/crypto/Kconfig' \
            -o -path '*/crypto/Makefile' \
            -o -path '*/arch/arm64/Makefile.postlink' \
            -o -name 'fips140-module.c' \
            -o -name 'fips140_gen_hmac.c' \) \
            -print | tee "$REPORT_DIR/fips-source-files.txt"

          echo
          echo "=== ABI files ==="

          find . -type f \
            \( -name 'abi_gki_aarch64_pixel' \
            -o -name 'abi_gki_aarch64_fips140' \) \
            -print | tee "$REPORT_DIR/abi-files.txt"

          PIXEL_ABI="$(find common -type f \
            -name abi_gki_aarch64_pixel -print -quit)"

          FIPS_ABI="$(find common -type f \
            -name abi_gki_aarch64_fips140 -print -quit)"

          if [ -z "$PIXEL_ABI" ]; then
            echo "ERROR: Pixel ABI file not found under common/"
            exit 1
          fi

          if [ -z "$FIPS_ABI" ]; then
            echo "ERROR: FIPS ABI file not found under common/"
            echo "The workflow will not invent or substitute an ABI file."
            exit 1
          fi

          echo "Pixel ABI: $PIXEL_ABI"
          echo "FIPS ABI: $FIPS_ABI"

          echo "PIXEL_ABI=$PIXEL_ABI" >> "$GITHUB_ENV"
          echo "FIPS_ABI=$FIPS_ABI" >> "$GITHUB_ENV"

      - name: Verify native FIPS implementation
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          COMMON_DIR="common"

          if [ ! -f "$COMMON_DIR/crypto/Kconfig" ]; then
            echo "ERROR: common/crypto/Kconfig not found."
            echo "Searching for actual kernel source root:"
            find . -type f -path '*/crypto/Kconfig' -print
            exit 1
          fi

          test -f "$COMMON_DIR/crypto/Makefile"
          test -f "$COMMON_DIR/arch/arm64/Makefile.postlink"

          grep -Rni \
            'CRYPTO_FIPS140_MOD' \
            "$COMMON_DIR/crypto/Kconfig"

          grep -n \
            'fips140' \
            "$COMMON_DIR/crypto/Makefile"

          grep -n -A12 -B5 \
            'CMD_FIPS140_GEN_HMAC\|cmd_gen_hmac\|fips140.ko' \
            "$COMMON_DIR/arch/arm64/Makefile.postlink"

          {
            echo "Native FIPS source verification: PASS"
            echo "Kconfig: present"
            echo "Crypto Makefile: present"
            echo "ARM64 postlink Makefile: present"
          } | tee "$REPORT_DIR/fips-source-verification.txt"

      - name: Export FIPS ABI from common Bazel package
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          ABI_RELATIVE="${FIPS_ABI#common/}"

          if [ "$ABI_RELATIVE" = "$FIPS_ABI" ]; then
            echo "ERROR: FIPS ABI is not inside common/."
            echo "Actual path: $FIPS_ABI"
            exit 1
          fi

          echo "FIPS ABI relative path: $ABI_RELATIVE"

          if ! grep -Fq \
            "$ABI_RELATIVE" \
            common/BUILD.bazel; then

            cat >> common/BUILD.bazel <<EOF

          # Export the native FIPS ABI file for the Shusky kernel target.
          exports_files([
              "$ABI_RELATIVE",
          ])
          EOF
          fi

          echo "=== Verify Bazel export ==="
          tail -40 common/BUILD.bazel

          bazel query \
            '//common:android/abi_gki_aarch64_fips140' \
            --output=label \
            | tee "$REPORT_DIR/fips-abi-bazel-query.txt"

      - name: Integrate native FIPS into Shusky BUILD
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          python3 <<'PY'
          from pathlib import Path

          build = Path(
              "private/devices/google/shusky/BUILD.bazel"
          )

          text = build.read_text()

          # Add the FIPS config fragment.
          if "nethunter_fips_defconfig" not in text:
              old = '"shusky_defconfig"'
              if old not in text:
                  raise SystemExit(
                      "ERROR: shusky_defconfig entry not found"
                  )
              text = text.replace(
                  old,
                  old + ',\n        "nethunter_fips_defconfig"',
                  1
              )

          # Keep strict Pixel ABI and add FIPS ABI as supplemental ABI.
          if "abi_gki_aarch64_fips140" not in text:
              old = (
                  'kmi_symbol_list = '
                  '"//common:android/abi_gki_aarch64_pixel",'
              )
              if old not in text:
                  raise SystemExit(
                      "ERROR: strict Pixel KMI declaration not found"
                  )

              text = text.replace(
                  old,
                  old + '''
              additional_kmi_symbol_lists = [
                  "//common:android/abi_gki_aarch64_fips140",
              ],''',
                  1
              )

          # Include the native FIPS module in the kernel module outputs.
          if '"crypto/fips140.ko"' not in text:
              old = "module_outs = ZUMA_MODULE_OUTS,"
              if old not in text:
                  raise SystemExit(
                      "ERROR: ZUMA_MODULE_OUTS declaration not found"
                  )
              text = text.replace(
                  old,
                  'module_outs = ZUMA_MODULE_OUTS + '
                  '["crypto/fips140.ko"],',
                  1
              )

          # Add the FIPS module list before the Zuma ramdisk list.
          if "vendor_ramdisk.modules.fips140" not in text:
              old = (
                  '"//private/devices/google/zuma:'
                  'vendor_ramdisk.modules.zuma"'
              )
              if old not in text:
                  raise SystemExit(
                      "ERROR: Zuma vendor ramdisk list not found"
                  )
              text = text.replace(
                  old,
                  '"//private/devices/google/shusky:'
                  'vendor_ramdisk.modules.fips140",\n        ' + old,
                  1
              )

          build.write_text(text)
          print("Shusky BUILD integration updated.")
          PY

          echo "=== Verify Shusky FIPS integration ==="
          grep -n -B4 -A8 \
            'nethunter_fips_defconfig\|abi_gki_aarch64_fips140\|crypto/fips140.ko\|vendor_ramdisk.modules.fips140' \
            private/devices/google/shusky/BUILD.bazel

      - name: Create FIPS config fragment and ramdisk module list
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          cat > \
            private/devices/google/shusky/nethunter_fips_defconfig <<'EOF'
          CONFIG_CRYPTO_FIPS140_MOD=m
          EOF

          cat > \
            private/devices/google/shusky/vendor_ramdisk.modules.fips140 <<'EOF'
          kernel/crypto/fips140.ko
          EOF

          echo "=== FIPS defconfig ==="
          cat \
            private/devices/google/shusky/nethunter_fips_defconfig

          echo "=== FIPS ramdisk module list ==="
          cat \
            private/devices/google/shusky/vendor_ramdisk.modules.fips140

      - name: Verify Bazel integration before compilation
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          echo "=== FIPS ABI target ==="
          bazel query \
            '//common:android/abi_gki_aarch64_fips140'

          echo
          echo "=== Shusky target ==="
          bazel query \
            '//private/devices/google/shusky:zuma_shusky_dist'

          echo
          echo "=== Verify strict Pixel ABI ==="
          grep -n \
            'abi_gki_aarch64_pixel' \
            private/devices/google/shusky/BUILD.bazel

          echo
          echo "=== Verify supplemental FIPS ABI ==="
          grep -n \
            'abi_gki_aarch64_fips140' \
            private/devices/google/shusky/BUILD.bazel

          echo
          echo "=== Verify module output ==="
          grep -n \
            'crypto/fips140.ko' \
            private/devices/google/shusky/BUILD.bazel

          echo
          echo "=== Verify no RTL8187 or MT76 additions ==="
          if grep -RniE \
            'rtl8187|mt76' \
            private/devices/google/shusky \
            private/devices/google/zuma/constants.bzl; then
            echo "ERROR: RTL8187 or MT76 reference found."
            exit 1
          fi

          echo "Pre-build integration checks: PASS" \
            | tee "$REPORT_DIR/pre-build-verification.txt"

      - name: Build Shusky Native FIPS kernel
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          set -o pipefail

          ./private/devices/google/shusky/build_shusky.sh \
            --kernel_package=@//aosp \
            --//build/kernel/kleaf:use_prebuilt_gki=false \
            --no//private/devices/google/common:download_prebuilt_gki_fips140 \
            --verbose_failures \
            2>&1 | tee "$REPORT_DIR/build.log"

      - name: Verify final kernel configuration
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          find . -type f \
            -name .config \
            -print \
            | tee "$REPORT_DIR/config-files.txt"

          CONFIG="$(find . -type f \
            -name .config \
            -print -quit)"

          if [ -z "$CONFIG" ]; then
            echo "ERROR: Kernel .config not found."
            exit 1
          fi

          echo "Using config: $CONFIG"

          grep -E \
            'CONFIG_CRYPTO_FIPS140_MOD=|CONFIG_CRYPTO_FIPS140_MERGE_MOD_SECTIONS=' \
            "$CONFIG" \
            | tee "$REPORT_DIR/fips-config.txt" || true

          grep -q \
            '^CONFIG_CRYPTO_FIPS140_MOD=m$' \
            "$CONFIG"

          if grep -q \
            '^CONFIG_CRYPTO_FIPS140_MERGE_MOD_SECTIONS=y$' \
            "$CONFIG"; then
            echo "FIPS merge-mod-sections: enabled"
          else
            echo "FIPS merge-mod-sections: not confirmed"
          fi

      - name: Verify native FIPS module and HMAC sections
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          MODULE="$(find . -type f \
            -path '*/crypto/fips140.ko' \
            -print -quit)"

          if [ -z "$MODULE" ]; then
            echo "ERROR: Native crypto/fips140.ko not found."
            exit 1
          fi

          echo "FIPS module: $MODULE"
          sha256sum "$MODULE" \
            | tee "$REPORT_DIR/fips140-sha256.txt"

          file "$MODULE" \
            | tee "$REPORT_DIR/fips140-file.txt"

          readelf -S "$MODULE" \
            | tee "$REPORT_DIR/fips140-sections.txt"

          grep -q '\.init\.rela\.text' \
            "$REPORT_DIR/fips140-sections.txt"

          grep -q '\.init\.rela\.rodata' \
            "$REPORT_DIR/fips140-sections.txt"

          echo "FIPS relocation sections: PASS"

          echo "=== HMAC generator source ==="
          grep -n -A15 -B5 \
            'CMD_FIPS140_GEN_HMAC\|cmd_gen_hmac' \
            common/arch/arm64/Makefile.postlink \
            | tee "$REPORT_DIR/fips-hmac-postlink-source.txt"

          echo "=== HMAC execution evidence ==="
          grep -RniE \
            'fips140_gen_hmac|cmd_gen_hmac|gen_hmac' \
            build-report \
            --exclude='fips-hmac-execution.txt' \
            | tee "$REPORT_DIR/fips-hmac-execution.txt" || true

          if ! grep -q \
            'fips140_gen_hmac\|cmd_gen_hmac\|gen_hmac' \
            "$REPORT_DIR/fips-hmac-execution.txt"; then
            echo "ERROR: HMAC execution evidence not found in build report."
            exit 1
          fi

          echo "Native FIPS module and HMAC checks completed."

      - name: Verify FIPS module in vendor ramdisk
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          find . -type f \
            -name modules.load \
            -print \
            | tee "$REPORT_DIR/modules-load-files.txt"

          FOUND=0

          while IFS= read -r MODULES_LOAD; do
            [ -f "$MODULES_LOAD" ] || continue

            if grep -q 'fips140.ko' "$MODULES_LOAD"; then
              FOUND=1
              echo "FIPS found in: $MODULES_LOAD"
              echo "=== First 20 entries ==="
              sed -n '1,20p' "$MODULES_LOAD"

              FIRST="$(grep -v '^[[:space:]]*$' \
                "$MODULES_LOAD" | head -n 1)"

              if [ "$FIRST" != "kernel/crypto/fips140.ko" ] \
                && [ "$FIRST" != "crypto/fips140.ko" ] \
                && [ "$FIRST" != "fips140.ko" ]; then
                echo "ERROR: FIPS is not the first non-empty module."
                exit 1
              fi

              cp "$MODULES_LOAD" \
                "$REPORT_DIR/$(basename "$(dirname "$MODULES_LOAD")")-modules.load"
            fi
          done < "$REPORT_DIR/modules-load-files.txt"

          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: No modules.load containing fips140.ko found."
            exit 1
          fi

          echo "FIPS ramdisk ordering check: PASS"

      - name: Verify NetHunter baseline exclusions
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          echo "=== Check excluded external Wi-Fi drivers ==="

          if find . -type f \
            \( -name '*rtl8187*.ko' \
            -o -name '*mt76*.ko' \) \
            | grep .; then
            echo "ERROR: RTL8187 or MT76 module found."
            exit 1
          fi

          echo "RTL8187 excluded."
          echo "MT76 excluded."

          echo "=== Check KernelSU Inline is not enabled ==="
          if grep -Rni \
            'CONFIG_KSU=y' \
            common/arch/arm64/configs \
            private/devices/google/shusky \
            2>/dev/null; then
            echo "WARNING: KSU config reference found; inspect manually."
          fi

          echo "No phone flash commands are part of this workflow."

      - name: Collect build outputs and reports
        if: always()
        shell: bash
        run: |
          set +e
          cd "$WORKSPACE"

          mkdir -p "$REPORT_DIR"

          echo "=== Build summary ===" \
            | tee "$REPORT_DIR/build-summary.txt"

          echo "Build completed at: $(date -u)" \
            | tee -a "$REPORT_DIR/build-summary.txt"

          echo "=== FIPS module candidates ===" \
            | tee -a "$REPORT_DIR/build-summary.txt"

          find . -type f \
            -path '*/crypto/fips140.ko' \
            -exec sha256sum {} \; \
            | tee -a "$REPORT_DIR/build-summary.txt"

          echo "=== Kernel images ===" \
            | tee -a "$REPORT_DIR/build-summary.txt"

          find . -type f \
            \( -name 'Image' \
            -o -name 'Image.lz4' \
            -o -name 'boot.img' \
            -o -name 'vendor_boot.img' \
            -o -name 'vendor_dlkm.img' \
            -o -name 'system_dlkm.img' \
            -o -name 'dtbo.img' \) \
            -print \
            | tee -a "$REPORT_DIR/build-summary.txt"

          echo "=== Build report files ===" \
            | tee -a "$REPORT_DIR/build-summary.txt"

          find "$REPORT_DIR" -maxdepth 1 -type f -print

      - name: Package Native FIPS build reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          mkdir -p "$REPORT_DIR/package"

          find . -type f \
            \( -name 'Image' \
            -o -name 'Image.lz4' \
            -o -name 'boot.img' \
            -o -name 'vendor_boot.img' \
            -o -name 'vendor_dlkm.img' \
            -o -name 'system_dlkm.img' \
            -o -name 'dtbo.img' \
            -o -name 'fips140.ko' \) \
            -exec cp --parents {} "$REPORT_DIR/package/" \;

          cp -a "$REPORT_DIR" \
            "$WORKSPACE/native-fips-reports" \
            2>/dev/null || true

          cd "$WORKSPACE"
          zip -qr shiba-nethunter-native-fips-build-test.zip \
            build-report \
            native-fips-reports \
            2>/dev/null || true

      - name: Upload Native FIPS build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiba-nethunter-native-fips-build-test
          path: |
            workspace/build-report/
            workspace/native-fips-reports/
            workspace/shiba-nethunter-native-fips-build-test.zip
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
