
name: Build Pixel 8 Shiba - NetHunter GKI Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shiba-nethunter-kernel-build
  cancel-in-progress: false

jobs:
  build-kernel:
    name: Build and verify Shiba NetHunter kernel
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEVICE: shiba
      KERNEL_DEVICE: shusky
      CUSTOM_KERNEL_VERSION: "1.33"
      BUILD_AOSP_KERNEL: "1"

    steps:
      # --------------------------------------------------
      # 1. Prepare runner
      # --------------------------------------------------

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            python3 \
            python3-pip \
            python-is-python3 \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            dwarves \
            zip \
            unzip \
            rsync \
            ccache \
            file \
            kmod \
            xz-utils \
            zstd

      - name: Install Android repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # --------------------------------------------------
      # 2. Download official Google kernel source
      # --------------------------------------------------

      - name: Initialize Google kernel repository
        run: |
          mkdir -p workspace
          cd workspace

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-shusky-6.1-android16

      - name: Sync Google kernel source
        run: |
          cd workspace
          repo sync -c -j2 --no-tags --fail-fast

      # --------------------------------------------------
      # 3. Create NetHunter configuration fragment
      # --------------------------------------------------

      - name: Create NetHunter defconfig
        run: |
          cd workspace

          cat > private/devices/google/shusky/nethunter_defconfig <<'EOF'
          # NetHunter external USB wireless support

          CONFIG_WLAN=y
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m

          CONFIG_USB=y

          # Realtek RTL8187 USB adapter
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_EEPROM_93CX6=m
          CONFIG_RTL8187=m

          # MediaTek MT76x2U USB adapter
          CONFIG_WLAN_VENDOR_MEDIATEK=y
          CONFIG_MT76x2U=m
          EOF

          echo "Created nethunter_defconfig:"
          cat private/devices/google/shusky/nethunter_defconfig

      # --------------------------------------------------
      # 4. Register defconfig in Shusky BUILD.bazel
      # --------------------------------------------------

      - name: Register NetHunter defconfig
        run: |
          cd workspace

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "private/devices/google/shusky/BUILD.bazel"
          )

          content = path.read_text()

          pattern = r'(?m)^(\s*)"shusky_defconfig",\s*$'
          matches = list(re.finditer(pattern, content))

          if len(matches) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one shusky_defconfig entry; "
                  f"found {len(matches)}"
              )

          if '"nethunter_defconfig"' in content:
              raise SystemExit(
                  "ERROR: nethunter_defconfig is already registered"
              )

          match = matches[0]
          indent = match.group(1)

          replacement = (
              f'{indent}"shusky_defconfig",\n'
              f'{indent}"nethunter_defconfig",'
          )

          content = (
              content[:match.start()]
              + replacement
              + content[match.end():]
          )

          path.write_text(content)

          print("Registered nethunter_defconfig successfully")
          PY

      # --------------------------------------------------
      # 5. Register wireless modules in ZUMA_MODULE_OUTS
      # --------------------------------------------------

      - name: Register NetHunter kernel modules
        run: |
          cd workspace

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "private/devices/google/zuma/constants.bzl"
          )

          content = path.read_text()

          marker = '    "net/wireless/cfg80211.ko",'

          if content.count(marker) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one cfg80211 module entry"
              )

          modules = [
              "drivers/misc/eeprom/eeprom_93cx6.ko",
              "drivers/net/wireless/realtek/rtl818x/rtl8187/rtl8187.ko",
              "drivers/net/wireless/mediatek/mt76/mt76.ko",
              "drivers/net/wireless/mediatek/mt76/mt76-usb.ko",
              "drivers/net/wireless/mediatek/mt76/mt76x02-lib.ko",
              "drivers/net/wireless/mediatek/mt76/mt76x02-usb.ko",
              "drivers/net/wireless/mediatek/mt76/mt76x2/mt76x2-common.ko",
              "drivers/net/wireless/mediatek/mt76/mt76x2/mt76x2u.ko",
          ]

          for module in modules:
              if f'"{module}"' in content:
                  raise SystemExit(
                      f"ERROR: Module already registered: {module}"
                  )

          addition = "\n".join(
              f'    "{module}",' for module in modules
          )

          content = content.replace(
              marker,
              marker + "\n" + addition,
              1
          )

          path.write_text(content)

          print("Registered additional modules:")
          for module in modules:
              print(" -", module)
          PY

      # --------------------------------------------------
      # 6. Validate source modifications
      # --------------------------------------------------

      - name: Validate source modifications
        run: |
          cd workspace

          git diff --check

          echo "=== Shusky BUILD.bazel ==="
          grep -n -A8 -B4 nethunter_defconfig \
            private/devices/google/shusky/BUILD.bazel

          echo "=== Zuma module outputs ==="
          grep -n -A15 -B3 cfg80211 \
            private/devices/google/zuma/constants.bzl

          echo "=== NetHunter defconfig ==="
          cat private/devices/google/shusky/nethunter_defconfig

      # --------------------------------------------------
      # 7. Build official Shusky target
      # --------------------------------------------------

      - name: Build Shusky NetHunter kernel
        run: |
          cd workspace

          mkdir -p build-report

          echo "Build started: $(date -u)" \
            | tee build-report/build-status.txt

          echo "Target: //private/devices/google/shusky:zuma_shusky_dist" \
            | tee -a build-report/build-status.txt

          echo "Device: shiba / shusky" \
            | tee -a build-report/build-status.txt

          echo "Kernel branch: android-gs-shusky-6.1-android16" \
            | tee -a build-report/build-status.txt

          ./private/devices/google/shusky/build_shusky.sh \
            --//build/kernel/kleaf:use_prebuilt_gki=false \
            --no//private/devices/google/common:download_prebuilt_gki_fips140 \
            --verbose_failures \
            2>&1 | tee build-report/build.log

      # --------------------------------------------------
      # 8. Verify final kernel configuration
      # --------------------------------------------------

      - name: Verify final kernel configuration
        if: success()
        run: |
          cd workspace

          DIST="out/shusky/dist"
          CONFIG="$DIST/.config"

          test -f "$CONFIG" || {
            echo "ERROR: Expected dist .config not found"
            find out/shusky -name .config -type f
            exit 1
          }

          cp "$CONFIG" build-report/final.config

          {
            echo "=== Required configuration ==="

            for option in \
              CONFIG_MODULES \
              CONFIG_MODVERSIONS \
              CONFIG_WLAN \
              CONFIG_CFG80211 \
              CONFIG_MAC80211 \
              CONFIG_USB \
              CONFIG_WLAN_VENDOR_REALTEK \
              CONFIG_EEPROM_93CX6 \
              CONFIG_RTL8187 \
              CONFIG_WLAN_VENDOR_MEDIATEK \
              CONFIG_MT76_CORE \
              CONFIG_MT76_USB \
              CONFIG_MT76x02_LIB \
              CONFIG_MT76x02_USB \
              CONFIG_MT76x2_COMMON \
              CONFIG_MT76x2U
            do
              grep -E "^${option}=" "$CONFIG" || true
            done

            echo
            echo "=== KernelSU configuration, if present ==="
            grep -E '^CONFIG_KSU=' "$CONFIG" || true
          } | tee build-report/config-check.txt

          check_config() {
            option="$1"
            expected="$2"

            if ! grep -qx "${option}=${expected}" "$CONFIG"; then
              echo "ERROR: ${option} is not ${expected}"
              exit 1
            fi
          }

          check_config CONFIG_MODULES y
          check_config CONFIG_MODVERSIONS y
          check_config CONFIG_WLAN y
          check_config CONFIG_CFG80211 m
          check_config CONFIG_MAC80211 m
          check_config CONFIG_USB y
          check_config CONFIG_WLAN_VENDOR_REALTEK y
          check_config CONFIG_RTL8187 m
          check_config CONFIG_WLAN_VENDOR_MEDIATEK y
          check_config CONFIG_MT76x2U m

          if grep -Eq '^CONFIG_KSU=(y|m)$' "$CONFIG"; then
            echo "ERROR: KernelSU is enabled in the kernel config"
            exit 1
          fi

          echo "Configuration checks passed."

      # --------------------------------------------------
      # 9. Verify kernel image and module outputs
      # --------------------------------------------------

      - name: Verify kernel image and modules
        if: success()
        run: |
          cd workspace

          DIST="out/shusky/dist"

          test -f "$DIST/Image.lz4" || {
            echo "ERROR: Image.lz4 not found"
            find "$DIST" -maxdepth 3 -type f
            exit 1
          }

          MODULES=(
            eeprom_93cx6.ko
            rtl8187.ko
            mt76.ko
            mt76-usb.ko
            mt76x02-lib.ko
            mt76x02-usb.ko
            mt76x2-common.ko
            mt76x2u.ko
            cfg80211.ko
            mac80211.ko
          )

          mkdir -p build-report/modules

          : > build-report/module-list.txt

          for module in "${MODULES[@]}"; do
            echo "Checking $module"

            found="$(find "$DIST" -type f -name "$module" -print -quit)"

            if [ -z "$found" ]; then
              echo "ERROR: Missing module: $module"
              exit 1
            fi

            echo "$found" | tee -a build-report/module-list.txt

            cp "$found" "build-report/modules/$module"
          done

          echo "All expected modules found."

      # --------------------------------------------------
      # 10. Collect module metadata
      # --------------------------------------------------

      - name: Collect module metadata
        if: success()
        run: |
          cd workspace

          mkdir -p build-report

          {
            echo "=== Kernel image ==="
            file out/shusky/dist/Image.lz4
            sha256sum out/shusky/dist/Image.lz4

            echo
            echo "=== Module metadata ==="

            for module in build-report/modules/*.ko; do
              echo
              echo "--------------------------------"
              echo "FILE: $module"
              echo "--------------------------------"

              modinfo "$module" || true

              echo "VERMAGIC:"
              modinfo -F vermagic "$module" || true

              echo "DEPENDS:"
              modinfo -F depends "$module" || true

              echo "NAME:"
              modinfo -F name "$module" || true

              echo "IMPORT_NS:"
              modinfo -F import_ns "$module" || true

              echo "SHA256:"
              sha256sum "$module"
            done
          } | tee build-report/module-metadata.txt

          echo "=== Module vermagic comparison ===" \
            | tee build-report/vermagic-check.txt

          for module in build-report/modules/*.ko; do
            printf '%s: ' "$(basename "$module")"
            modinfo -F vermagic "$module" || true
          done | tee -a build-report/vermagic-check.txt

      # --------------------------------------------------
      # 11. Collect Module.symvers and ABI information
      # --------------------------------------------------

      - name: Collect symbol and ABI information
        if: success()
        run: |
          cd workspace

          mkdir -p build-report/symbols

          find out -type f -name Module.symvers \
            -print > build-report/symbols/module-symvers-files.txt

          while IFS= read -r symvers; do
            [ -n "$symvers" ] || continue

            name="$(echo "$symvers" | sed 's#/#_#g')"

            cp "$symvers" \
              "build-report/symbols/${name}"

            echo "Collected: $symvers"
          done < build-report/symbols/module-symvers-files.txt

          if [ ! -s build-report/symbols/module-symvers-files.txt ]; then
            echo "WARNING: No Module.symvers files found"
          fi

          find out/shusky -type f \
            \( -name '*abi*' -o -name '*kmi*' -o -name '*symvers*' \) \
            -print > build-report/symbols/abi-files.txt || true

          echo "Symbol collection completed."

      # --------------------------------------------------
      # 12. Inspect vendor_dlkm output
      # --------------------------------------------------

      - name: Inspect vendor_dlkm output
        if: success()
        run: |
          cd workspace

          mkdir -p build-report/vendor_dlkm

          find out/shusky/dist -type f \
            \( -name 'vendor_dlkm.img' \
            -o -name '*vendor_dlkm*' \
            -o -name '*modules*' \) \
            -print > build-report/vendor_dlkm/files.txt

          echo "=== vendor_dlkm-related files ==="
          cat build-report/vendor_dlkm/files.txt

          while IFS= read -r image; do
            [ -f "$image" ] || continue

            cp "$image" build-report/vendor_dlkm/

            echo
            echo "=== File information: $image ==="
            file "$image"
            sha256sum "$image"
          done < build-report/vendor_dlkm/files.txt

          if ! grep -q 'vendor_dlkm.img' \
            build-report/vendor_dlkm/files.txt; then
            echo "NOTE: vendor_dlkm.img was not present in dist."
            echo "This must be investigated before any flash decision."
          fi

      # --------------------------------------------------
      # 13. Create complete dist listing
      # --------------------------------------------------

      - name: Create build report
        if: always()
        run: |
          cd workspace

          mkdir -p build-report

          {
            echo "=== Build information ==="
            date -u
            echo
            echo "=== Dist contents ==="

            if [ -d out/shusky/dist ]; then
              find out/shusky/dist -type f -print
            else
              echo "Dist directory not found"
            fi

            echo
            echo "=== Disk space ==="
            df -h
          } > build-report/build-report.txt

      # --------------------------------------------------
      # 14. Upload build artifacts
      # --------------------------------------------------

      - name: Upload Shiba NetHunter build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiba-twk-v1.33-verified-build
          path: |
            workspace/out/shusky/dist/
            workspace/build-report/
          if-no-files-found: warn
          retention-days: 14
