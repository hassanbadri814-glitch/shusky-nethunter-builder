      - name: Verify exact Native FIPS HMAC postlink execution and digest
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          python3 <<'PY'
          from pathlib import Path
          import re

          postlink = Path("aosp/arch/arm64/Makefile.postlink").read_text()
          generator = Path("aosp/crypto/fips140_gen_hmac.c").read_text()
          required = (
              "CMD_FIPS140_GEN_HMAC = crypto/fips140_gen_hmac",
              "quiet_cmd_gen_hmac = HMAC",
              "$(objtree)/crypto/fips140.ko: FORCE",
              "$(call cmd,gen_hmac)",
              "$(CMD_FIPS140_GEN_HMAC) $@",
          )
          for fragment in required:
              if fragment not in postlink:
                  raise SystemExit(f"ERROR: pinned Makefile.postlink lacks: {fragment}")
          if not re.search(r"(?m)^quiet_cmd_gen_hmac\s*=\s*HMAC\s+\$@", postlink):
              raise SystemExit("ERROR: HMAC log label is not bound to Kbuild target $@")
          generator_tokens = (
              "fips140_integ_hmac_key", "fips140_integ_hmac_digest",
              "__fips140_text_start", "__fips140_text_end",
              "__fips140_rodata_start", "__fips140_rodata_end",
              "HMAC_Init_ex", "EVP_sha256()", "HMAC_Update", "HMAC_Final",
          )
          for token in generator_tokens:
              if token not in generator:
                  raise SystemExit(f"ERROR: pinned HMAC generator lacks: {token}")
          print("Pinned Kbuild target rule and SHA-256 generator implementation: PASS")
          PY

          python3 - "$REPORT_DIR/build.log" "$REPORT_DIR/fips-hmac-target-log.txt" <<'PY'
          from pathlib import Path
          import re
          import sys
          log = Path(sys.argv[1]).read_text(errors="replace")
          pattern = re.compile(r"(^|[ \t])HMAC[ \t]+(?:\S*/)?crypto/fips140\.ko(?:[ \t]|$)")
          matches = [line for line in log.splitlines() if pattern.search(line)]
          if matches:
              Path(sys.argv[2]).write_text("\n".join(matches) + "\n")
              print(f"Kbuild exposed the exact fips140.ko HMAC target line(s): {len(matches)}")
              print("\n".join(matches))
          else:
              Path(sys.argv[2]).write_text(
                  "Bazel did not expose successful action stdout in build.log. "
                  "The pinned target rule and embedded digest are independently verified below.\n"
              )
              print("INFO: Bazel did not expose the successful Kbuild action's quiet log line.")
              print("The exact source target rule and resulting embedded HMAC are verified independently.")
          PY

          # Verify only authoritative final outputs. Bazel sandbox action trees
          # also contain transient pre-strip/unstripped copies; comparing those
          # byte-for-byte with the stripped final module creates false conflicts.
          : > "$REPORT_DIR/fips-hmac-module-candidates.txt"
          test -f out/shusky/dist/fips140.ko && \
            printf '%s\n' out/shusky/dist/fips140.ko \
              >> "$REPORT_DIR/fips-hmac-module-candidates.txt"
          find out/bazel -type f \
            \( -path '*/execroot/__main__/bazel-out/k8-fastbuild/bin/private/devices/google/shusky/kernel/crypto/fips140.ko' \
               -o -path '*/execroot/__main__/bazel-out/k8-fastbuild/bin/private/devices/google/shusky/kernel_modules_install/staging/lib/modules/*/kernel/crypto/fips140.ko' \) \
            -not -path '*/sandbox/*' -print \
            >> "$REPORT_DIR/fips-hmac-module-candidates.txt"
          sort -u -o "$REPORT_DIR/fips-hmac-module-candidates.txt" \
            "$REPORT_DIR/fips-hmac-module-candidates.txt"
          if ! grep -qx 'out/shusky/dist/fips140.ko' \
            "$REPORT_DIR/fips-hmac-module-candidates.txt"; then
            echo "ERROR: authoritative final dist fips140.ko is missing."
            exit 1
          fi
          if [ "$(wc -l < "$REPORT_DIR/fips-hmac-module-candidates.txt")" -lt 2 ]; then
            echo "ERROR: expected final dist plus Bazel/staging FIPS module for cross-verification."
            exit 1
          fi

          python3 - "$REPORT_DIR" "$REPORT_DIR/fips-hmac-module-candidates.txt" <<'PY'
          import hashlib, hmac, struct, sys
          from pathlib import Path

          report = Path(sys.argv[1])
          candidates = [Path(p) for p in Path(sys.argv[2]).read_text().splitlines() if p]
          verified, rejected = [], []

          def cstr(table, offset):
              if offset < 0 or offset >= len(table):
                  raise ValueError("string-table offset out of bounds")
              end = table.find(b"\0", offset)
              if end < 0:
                  raise ValueError("unterminated ELF string")
              return table[offset:end].decode("utf-8", "replace")

          def verify(path):
              blob = path.read_bytes()
              if len(blob) < 64 or blob[:4] != b"\x7fELF" or blob[4:6] != b"\x02\x01":
                  raise ValueError("not ELF64 little-endian")
              hdr = struct.unpack_from("<16sHHIQQQIHHHHHH", blob, 0)
              if hdr[1] != 1 or hdr[2] != 183:
                  raise ValueError("not relocatable AArch64 ELF")
              shoff, shentsize, shnum, shstrndx = hdr[6], hdr[11], hdr[12], hdr[13]
              if shentsize < 64 or not shnum or shstrndx >= shnum:
                  raise ValueError("invalid section-header table")
              secs = []
              for i in range(shnum):
                  v = struct.unpack_from("<IIQQQQIIQQ", blob, shoff + i * shentsize)
                  secs.append({"nameoff":v[0],"type":v[1],"off":v[4],"size":v[5],
                               "link":v[6],"entsize":v[9]})
              st = secs[shstrndx]
              names = blob[st["off"]:st["off"]+st["size"]]
              for s in secs:
                  s["name"] = cstr(names, s["nameoff"])
              byname = {s["name"]:s for s in secs}
              for name in (".init.rela.text", ".init.rela.rodata"):
                  s = byname.get(name)
                  if not s or not s["size"] or s["size"] % 24:
                      raise ValueError(f"missing/invalid {name}")

              syms = {}
              for s in secs:
                  if s["type"] != 2:
                      continue
                  if s["link"] >= len(secs):
                      raise ValueError("bad symtab string-table link")
                  strings_sec = secs[s["link"]]
                  strings = blob[strings_sec["off"]:strings_sec["off"]+strings_sec["size"]]
                  ent = s["entsize"] or 24
                  if ent < 24:
                      raise ValueError("bad ELF64 symbol entry size")
                  for i in range(s["size"] // ent):
                      nameoff, info, other, ndx, value, size = struct.unpack_from(
                          "<IBBHQQ", blob, s["off"]+i*ent)
                      if nameoff and ndx < len(secs):
                          name = cstr(strings, nameoff)
                          syms.setdefault(name, set()).add((ndx,value,size))

              def sym(name):
                  found = syms.get(name, set())
                  if len(found) != 1:
                      raise ValueError(f"expected one defined {name}; found {len(found)}")
                  ndx,value,size = next(iter(found))
                  return ndx,value,size

              def span(first,last):
                  a, av, _ = sym(first)
                  b, bv, _ = sym(last)
                  if a != b or not 0 <= av < bv <= secs[a]["size"]:
                      raise ValueError(f"invalid symbol range {first}..{last}")
                  s = secs[a]
                  return blob[s["off"]+av:s["off"]+bv]

              kn, kv, ks = sym("fips140_integ_hmac_key")
              keysec = secs[kn]
              ko = keysec["off"] + kv
              kend = ko + ks if ks else keysec["off"] + keysec["size"]
              kb = blob[ko:kend]
              if b"\0" not in kb or not kb.split(b"\0",1)[0]:
                  raise ValueError("HMAC key is empty or not NUL-terminated")
              key = kb.split(b"\0",1)[0]

              dn, dv, ds = sym("fips140_integ_hmac_digest")
              if ds < 32:
                  raise ValueError("digest symbol is smaller than SHA-256")
              digestsec = secs[dn]
              stored = blob[digestsec["off"]+dv:digestsec["off"]+dv+32]
              textdata = span("__fips140_text_start","__fips140_text_end")
              rodata = span("__fips140_rodata_start","__fips140_rodata_end")
              calculated = hmac.new(key,textdata+rodata,hashlib.sha256).digest()
              if not hmac.compare_digest(stored,calculated):
                  raise ValueError("embedded digest differs from independently recomputed HMAC-SHA256")
              return {
                  "path":str(path),"sha256":hashlib.sha256(blob).hexdigest(),
                  "hmac":calculated.hex(),"key_bytes":len(key),
                  "key_sha256":hashlib.sha256(key).hexdigest(),
                  "text_sha256":hashlib.sha256(textdata).hexdigest(),
                  "rodata_sha256":hashlib.sha256(rodata).hexdigest(),
                  "text_bytes":len(textdata),"rodata_bytes":len(rodata),
                  "rela_text":byname[".init.rela.text"]["size"],
                  "rela_rodata":byname[".init.rela.rodata"]["size"],
              }

          for p in candidates:
              try:
                  verified.append(verify(p))
              except Exception as e:
                  rejected.append(f"{p}: {e}")
          if not verified:
              raise SystemExit("ERROR: no module passed independent HMAC verification:\n"+"\n".join(rejected[:30]))
          # Final dist, canonical Bazel target and installed staging copy must
          # be byte-identical, and each must independently pass embedded HMAC.
          if len({x["sha256"] for x in verified}) != 1:
              details = "\\n".join(
                  f'{x["path"]}: sha256={x["sha256"]} hmac={x["hmac"]}'
                  for x in verified
              )
              raise SystemExit(
                  "ERROR: authoritative final FIPS module outputs are not byte-identical:\\n" + details
              )
          fingerprints = {
              (x["hmac"], x["key_sha256"], x["text_sha256"], x["rodata_sha256"])
              for x in verified
          }
          if len(fingerprints) != 1:
              raise SystemExit(
                  "ERROR: authoritative final FIPS outputs disagree in HMAC key or authenticated text/rodata"
              )
          v = verified[0]
          lines = [
              "Kbuild target binding: PASS (pinned Makefile.postlink rule is scoped to crypto/fips140.ko)",
              "Independent embedded HMAC-SHA256 recomputation: PASS",
              f"Verified module candidates: {len(verified)}",
              f"Module SHA-256: {v['sha256']}",
              f"Embedded HMAC-SHA256: {v['hmac']}",
              f"HMAC key SHA-256: {v['key_sha256']}",
              f"Authenticated .text SHA-256: {v['text_sha256']}",
              f"Authenticated .rodata SHA-256: {v['rodata_sha256']}",
              f"HMAC key length: {v['key_bytes']} bytes",
              f"Covered .text bytes: {v['text_bytes']}",
              f"Covered .rodata bytes: {v['rodata_bytes']}",
              f".init.rela.text bytes: {v['rela_text']}",
              f".init.rela.rodata bytes: {v['rela_rodata']}",
              "Verified module paths:",
          ]
          lines.extend("  "+x["path"] for x in verified)
          if rejected:
              lines.append("Non-final or non-verifiable candidates skipped:")
              lines.extend("  "+x for x in rejected[:30])
          (report/"fips-hmac-execution-verification.txt").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
      - name: Verify generated vendor ramdisk modules.load
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          find . -type f \
            -name modules.load \
            -not -path './build-report/*' \
            -print \
            | sort \
            | tee "$REPORT_DIR/modules-load-files.txt"
          FOUND=0
          INDEX=0
          while IFS= read -r MODULES_LOAD; do
            [ -f "$MODULES_LOAD" ] || continue
            INDEX=$((INDEX + 1))
            echo
            echo "=== modules.load: $MODULES_LOAD ==="
            sed -n '1,35p' "$MODULES_LOAD"
            if grep -q 'fips140\.ko' "$MODULES_LOAD"; then
              FOUND=$((FOUND + 1))
              echo "FIPS entry found."
              python3 - "$MODULES_LOAD" <<'PY'
          import sys
          lines = [line.strip() for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
          def position(name):
              matches = [i for i, line in enumerate(lines) if line.rsplit("/", 1)[-1] == name]
              if len(matches) != 1:
                  raise SystemExit(f"ERROR: expected exactly one {name} entry in modules.load; found {len(matches)}")
              return matches[0]
          fips = position("fips140.ko")
          pixel = position("ufs-pixel-fips140.ko")
          ufs = position("ufs-exynos-gs.ko")
          if not (fips < pixel < ufs):
              raise SystemExit(f"ERROR: unsafe FIPS/UFS modules.load order: fips={fips}, pixel={pixel}, ufs={ufs}")
          print(f"FIPS/UFS load order PASS: fips140({fips}) < ufs-pixel-fips140({pixel}) < ufs-exynos-gs({ufs})")
          PY
              cp "$MODULES_LOAD" \
                "$REPORT_DIR/modules-load-${INDEX}.txt"
              grep -n -B3 -A5 \
                'fips140\.ko' \
                "$MODULES_LOAD" \
                >> "$REPORT_DIR/fips-modules-load-position.txt"
            fi
          done < "$REPORT_DIR/modules-load-files.txt"
          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: No generated modules.load contains fips140.ko."
            exit 1
          fi
          {
            echo "modules.load files containing FIPS: $FOUND"
            echo "FIPS module entry: present"
            echo "Load order: recorded, not assumed"
          } | tee "$REPORT_DIR/modules-load-verification.txt"
          echo "FIPS modules.load presence verification: PASS"

      - name: Collect ramdisk and module dependency diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          cd "$WORKSPACE" || exit 0
          mkdir -p "$REPORT_DIR"
          echo "=== modules.load files ===" \
            | tee "$REPORT_DIR/ramdisk-diagnostics.txt"
          find out -type f \
            -name modules.load \
            -print 2>/dev/null \
            | sort \
            | tee "$REPORT_DIR/ramdisk-modules-load-paths.txt"
          echo \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          echo "=== FIPS-related module dependency entries ===" \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          find out -type f \
            \( -name modules.dep -o -name modules.softdep \) \
            -print0 2>/dev/null \
            | while IFS= read -r -d '' DEPFILE; do
                if grep -qE 'fips140|zsmalloc' "$DEPFILE"; then
                  echo \
                    | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
                  echo "FILE: $DEPFILE" \
                    | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
                  grep -n -B2 -A3 \
                    -E 'fips140|zsmalloc' \
                    "$DEPFILE" \
                    | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
                fi
              done
          echo \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          echo "=== Relevant ramdisk and boot image candidates ===" \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          find out/shusky out/bazel \
            -type f \
            \( -iname '*vendor*ramdisk*' \
            -o -iname '*initramfs*' \
            -o -name vendor_boot.img \
            -o -name boot.img \
            -o -name modules.load \
            -o -name modules.dep \
            -o -name modules.softdep \) \
            -print 2>/dev/null \
            | sort -u \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          echo \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          echo "=== Final distribution modules.load ===" \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          if [ -f out/shusky/dist/modules.load ]; then
            sed -n '1,100p' out/shusky/dist/modules.load \
              | tee "$REPORT_DIR/final-dist-modules.load"
            if grep -q 'fips140\.ko' out/shusky/dist/modules.load; then
              echo "FIPS is present in final dist/modules.load." \
                | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
            else
              echo "FIPS is NOT present in final dist/modules.load." \
                | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
            fi
          else
            echo "Final dist/modules.load does not exist." \
              | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          fi
          echo \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          echo "=== Image file types ===" \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          find out/shusky/dist \
            -type f \
            \( -name '*.img' -o -name '*ramdisk*' \) \
            -print0 2>/dev/null \
            | while IFS= read -r -d '' IMAGE_FILE; do
                file "$IMAGE_FILE"
              done \
            | tee -a "$REPORT_DIR/ramdisk-diagnostics.txt"
          echo "Ramdisk diagnostics collected."

      - name: Verify enabled Wi-Fi modules and KernelSU exclusion
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          if find . -type f -name '*mt76*.ko' -not -path './build-report/*' | grep -q .; then
            echo "ERROR: MT76 module unexpectedly present."
            exit 1
          fi
          echo "MT76: excluded"
          for MODULE in cfg80211.ko mac80211.ko rtl8187.ko eeprom_93cx6.ko; do
            if ! find . -type f -name "$MODULE" -not -path './build-report/*' | grep -q .; then
              echo "ERROR: Required wireless module missing: $MODULE"
              exit 1
            fi
            echo "$MODULE: present"
          done
          if find . -type f -name 'ksu.ko' -not -path './build-report/*' | grep -q .; then
            echo "ERROR: Unexpected KernelSU module found."
            exit 1
          fi
          echo "KernelSU module: absent"

      - name: Audit RTL8187 module and dependency compatibility
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/audit-rtl8187.sh" \
            "$WORKSPACE" "$EXPECTED_KERNEL_RELEASE" "$REPORT_DIR" "$FIPS_CONFIG" "14691759"

      - name: Verify RTL8187 and EEPROM inside final DLKM images
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$WORKSPACE"
          mapfile -t RTL_MODULES < <(
            find out/bazel -type f \
              -path '*/kernel_images_*/staging/lib/modules/*/kernel/drivers/net/wireless/realtek/rtl818x/rtl8187/rtl8187.ko' \
              -print | sort -u
          )
          mapfile -t EEPROM_MODULES < <(
            find out/bazel -type f \
              -path '*/kernel_images_*/staging/lib/modules/*/kernel/drivers/misc/eeprom/eeprom_93cx6.ko' \
              -print | sort -u
          )
          test "${#RTL_MODULES[@]}" -ge 1
          test "${#EEPROM_MODULES[@]}" -ge 1
          test -s out/shusky/dist/vendor_dlkm.img
          test -s out/shusky/dist/system_dlkm.img
          bash "$GITHUB_WORKSPACE/scripts/audit-dlkm-images.sh" \
            out/shusky/dist/vendor_dlkm.img \
            out/shusky/dist/system_dlkm.img \
            "${RTL_MODULES[0]}" "${EEPROM_MODULES[0]}" \
            "$EXPECTED_KERNEL_RELEASE" "$REPORT_DIR"

      - name: Collect build outputs and reports
        if: always()
        shell: bash
        run: |
          set +e
          cd "$WORKSPACE" || exit 0
          mkdir -p "$REPORT_DIR"
          {
            echo "Build report generated: $(date -u)"
            echo
            echo "=== FIPS module candidates ==="
            find . -type f \
              -path '*/crypto/fips140.ko' \
              -not -path './build-report/*' \
              -exec sha256sum {} \;
            echo
            echo "=== Kernel images ==="
            find . -type f \
              \( -name Image \
              -o -name Image.lz4 \
              -o -name boot.img \
              -o -name vendor_boot.img \
              -o -name vendor_kernel_boot.img \
              -o -name vendor_dlkm.img \
              -o -name system_dlkm.img \
              -o -name dtbo.img \) \
              -print
          } | tee "$REPORT_DIR/build-summary.txt"

      - name: Package verified Native FIPS and RTL8187 artifacts
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$WORKSPACE"
          DIST="out/shusky/dist"
          PACKAGE="$REPORT_DIR/package"
          mkdir -p "$PACKAGE/dist"
          for FILE in Image boot.img vendor_kernel_boot.img dtbo.img system_dlkm.img vendor_dlkm.img fips140.ko rtl8187.ko eeprom_93cx6.ko modules.load modules.dep modules.softdep; do
            test -s "$DIST/$FILE" || { echo "ERROR: required final dist file missing: $FILE"; exit 1; }
            cp -a "$DIST/$FILE" "$PACKAGE/dist/$FILE"
          done
          cp -a "$REPORT_DIR/rtl8187-module-verification.txt" "$PACKAGE/"
          cp -a "$REPORT_DIR/rtl8187-kmi-crc-audit.txt" "$PACKAGE/"
          cp -a "$REPORT_DIR/rtl8187-kmi-source-patch.txt" "$PACKAGE/"
          cp -a "$REPORT_DIR/rtl8187-gki-virtual-device-abi.txt" "$PACKAGE/"
          cp -a "$REPORT_DIR/rtl8187-dlkm-image-verification.txt" "$PACKAGE/"
          cp -a "$REPORT_DIR/fips-gki-crc-audit.txt" "$PACKAGE/"
          cp -a "$REPORT_DIR/fips-hmac-execution-verification.txt" "$PACKAGE/"
          cp -a "$REPORT_DIR/kernel-module-compatibility.txt" "$PACKAGE/"
          cp -a "$GITHUB_WORKSPACE/scripts/audit-rtl8187.sh" "$PACKAGE/"
          cp -a "$GITHUB_WORKSPACE/scripts/audit-dlkm-images.sh" "$PACKAGE/"
          cp -a "$GITHUB_WORKSPACE/scripts/patch-rtl8187-kmi.sh" "$PACKAGE/"
          cp -a "$GITHUB_WORKSPACE/scripts/audit-rtl8187-kmi-base.sh" "$PACKAGE/"
          {
            echo "builder_commit=$GITHUB_SHA"
            echo "kernel_common_commit=$KERNEL_COMMON_COMMIT"
            echo "expected_kernel_release=$EXPECTED_KERNEL_RELEASE"
            echo "gki_build_id=14691759"
            echo "pixel_flash_performed=no"
          } > "$PACKAGE/BUILD-IDENTITY.txt"
          (
            cd "$PACKAGE"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          zip -qr "$WORKSPACE/shiba-nethunter-native-fips-build-test.zip" build-report
          unzip -t "$WORKSPACE/shiba-nethunter-native-fips-build-test.zip"
          unzip -Z1 "$WORKSPACE/shiba-nethunter-native-fips-build-test.zip" > "$REPORT_DIR/archive-files.txt"
          grep -Fxq 'build-report/package/dist/rtl8187.ko' "$REPORT_DIR/archive-files.txt"
          grep -Fxq 'build-report/package/dist/eeprom_93cx6.ko' "$REPORT_DIR/archive-files.txt"
          grep -Fxq 'build-report/package/rtl8187-kmi-source-patch.txt' "$REPORT_DIR/archive-files.txt"
          grep -Fxq 'build-report/package/rtl8187-gki-virtual-device-abi.txt' "$REPORT_DIR/archive-files.txt"
          grep -Fxq 'build-report/package/patch-rtl8187-kmi.sh' "$REPORT_DIR/archive-files.txt"
          grep -Fxq 'build-report/package/audit-rtl8187-kmi-base.sh' "$REPORT_DIR/archive-files.txt"
          grep -Fxq 'build-report/package/SHA256SUMS' "$REPORT_DIR/archive-files.txt"
          sha256sum "$WORKSPACE/shiba-nethunter-native-fips-build-test.zip" | tee "$REPORT_DIR/final-artifact-sha256.txt"

      - name: Audit flash image sizes against Pixel 8 stock partition capacities
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          python3 <<'PY'
          from pathlib import Path
          import hashlib

          dist = Path("out/shusky/dist")
          capacities = {
              "boot.img": 67108864,
              "vendor_kernel_boot.img": 67108864,
              "dtbo.img": 16777216,
              "system_dlkm.img": 11714560,
              "vendor_dlkm.img": 25559040,
          }
          report = []
          report.append("Pixel 8 Shiba partition-fit audit")
          report.append("Capacities are from the user's saved stock partition measurements.")
          report.append("")
          failed = False
          for name, capacity in capacities.items():
              path = dist / name
              if not path.is_file():
                  report.append(f"MISSING: {name}")
                  failed = True
                  continue
              size = path.stat().st_size
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              status = "PASS" if size <= capacity else "OVERSIZE - DO NOT FLASH"
              if size > capacity:
                  failed = True
              report.append(
                  f"{name}: size={size} capacity={capacity} "
                  f"remaining={capacity-size} status={status} sha256={digest}"
              )
          for name in ("Image", "fips140.ko", "modules.load", "modules.dep"):
              path = dist / name
              if path.is_file():
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  report.append(f"{name}: size={path.stat().st_size} sha256={digest}")
              else:
                  report.append(f"{name}: not present in dist (may be packaged elsewhere)")
          output = "\n".join(report) + "\n"
          print(output, end="")
          Path("build-report/image-size-audit.txt").write_text(output)
          PY

