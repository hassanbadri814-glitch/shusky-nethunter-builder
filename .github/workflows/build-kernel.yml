name: Diagnose AOSP ABI Exports

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose-abi:
    name: Verify AOSP ABI package exports
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python3-pip python-is-python3 \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves zip unzip rsync ccache file \
            kmod xz-utils zstd binutils

      - name: Install Android repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize Google kernel repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace
          cd workspace
          repo init \
            --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-shusky-6.1-android16

      - name: Sync Google kernel source
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          cd workspace
          repo sync \
            --current-branch \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2 \
            --fail-fast

      - name: Verify AOSP ABI package exports
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/workspace"

          echo "=== AOSP BUILD FILES ==="
          find "$ROOT/aosp" -maxdepth 2 \
            \( -name BUILD -o -name BUILD.bazel \) -print

          echo
          echo "=== AOSP ABI EXPORTS ==="
          grep -Rni -B5 -A12 \
            'abi_gki_aarch64_pixel\|abi_gki_aarch64_fips140\|exports_files' \
            "$ROOT/aosp/BUILD" \
            "$ROOT/aosp/BUILD.bazel" \
            "$ROOT/aosp/android" \
            2>/dev/null | head -160

          echo
          echo "=== FIPS FILE ==="
          test -f "$ROOT/aosp/android/abi_gki_aarch64_fips140" \
            && echo "FIPS ABI FILE EXISTS" \
            || echo "FIPS ABI FILE MISSING"

          echo
          echo "=== DIAGNOSTICS COMPLETE ==="
          exit 1