
      - name: Verify final FIPS kernel configuration
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          echo "=== Find all generated kernel configurations ==="

          find . -type f \
            -name .config \
            -not -path './build-report/*' \
            -print \
            | tee "$REPORT_DIR/config-files.txt"

          echo
          echo "=== Inspect FIPS setting in every configuration ==="

          FOUND=0
          MATCHED_CONFIG=""

          while IFS= read -r CONFIG; do
            [ -f "$CONFIG" ] || continue

            echo
            echo "----------------------------------------"
            echo "CONFIG: $CONFIG"
            echo "----------------------------------------"

            grep -E \
              '^(CONFIG_CRYPTO_FIPS140_MOD=|# CONFIG_CRYPTO_FIPS140_MOD is not set|CONFIG_CRYPTO_FIPS140_MERGE_MOD_SECTIONS=)' \
              "$CONFIG" || echo "FIPS setting not present"

            if grep -q \
              '^CONFIG_CRYPTO_FIPS140_MOD=m$' \
              "$CONFIG"; then

              FOUND=1
              MATCHED_CONFIG="$CONFIG"

              echo "RESULT: FIPS MODULE ENABLED"
            fi

          done < "$REPORT_DIR/config-files.txt"

          echo

          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: No generated .config contains:"
            echo "CONFIG_CRYPTO_FIPS140_MOD=m"
            echo
            echo "The FIPS defconfig fragment may not have"
            echo "been applied to the Shusky kernel configuration."
            exit 1
          fi

          echo "FIPS_CONFIG=$MATCHED_CONFIG" >> "$GITHUB_ENV"

          {
            echo "Native FIPS config: PASS"
            echo "Verified config: $MATCHED_CONFIG"
            echo "CONFIG_CRYPTO_FIPS140_MOD=m"
          } | tee "$REPORT_DIR/fips-config.txt"

          echo
          echo "Native FIPS configuration verification: PASS"
