
name: Build Pixel 8 Shiba - NetHunter GKI Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shiba-kernel-build
  cancel-in-progress: false

jobs:
  build-kernel:
    name: Build and verify Shiba kernel
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEVICE: shusky
      DEVICE_CODENAME: shiba
      KERNEL_BRANCH: android-gs-shusky-6.1-android16
      CUSTOM_KERNEL_VERSION: "1.33"
      WORKSPACE: workspace
      BUILD_AOSP_KERNEL: "1"

    steps:
      # 1. Prepare runner

      - name: Free runner disk space
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ca-certificates curl \
            flex git kmod libelf-dev libncurses5-dev \
            libssl-dev python3 repo unzip wget zip zstd

          git --version
          python3 --version
          repo version

      - name: Configure Git
        run: |
          git config --global user.name "Kernel Builder"
          git config --global user.email "kernel-builder@localhost"
          git config --global advice.detachedHead false

      # 2. Sync official Google source

      - name: Initialize Google kernel source
        run: |
          set -eux

          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "$KERNEL_BRANCH" \
            --depth=1

          repo sync \
            -c \
            -j"$(nproc)" \
            --no-tags \
            --no-clone-bundle

          test -f build_shusky.sh
          test -f private/devices/google/shusky/BUILD.bazel
          test -f private/devices/google/shusky/shusky_defconfig
          test -f private/devices/google/zuma/constants.bzl
          test -f private/devices/google/zuma/BUILD.bazel
          test -f aosp/BUILD.bazel

      - name: Record source revisions
        run: |
          set -eux
          cd "$WORKSPACE"

          mkdir -p build-report

          repo manifest -r > build-report/manifest.xml

          {
            echo "Device: $DEVICE_CODENAME"
            echo "Branch: $KERNEL_BRANCH"
            echo "Kernel label: $CUSTOM_KERNEL_VERSION"
            echo "Build date UTC: $(date -u)"
            echo
            repo forall -c \
              'echo "$REPO_PATH $REPO_LREV $REPO_RREV"'
          } > build-report/source-info.txt

      # 3. Create NetHunter configuration fragment

      - name: Add NetHunter defconfig fragment
        run: |
          set -eux
          cd "$WORKSPACE"

          cat > private/devices/google/shusky/nethunter_defconfig <<'EOF'
          # NetHunter external USB wireless support

          CONFIG_WLAN=y
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_USB=y

          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_EEPROM_93CX6=m
          CONFIG_RTL8187=m

          CONFIG_WLAN_VENDOR_MEDIATEK=y
          CONFIG_MT76x2U=m
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("private/devices/google/shusky/BUILD.bazel")
          s = p.read_text()

          marker = '"shusky_defconfig",'
          addition = '"nethunter_defconfig",'

          if addition not in s:
              assert s.count(marker) == 1, (
                  "Cannot uniquely locate shusky_defconfig "
                  "in Shusky BUILD.bazel"
              )
              s = s.replace(
                  marker,
                  marker + "\n        " + addition,
                  1
              )

          p.write_text(s)
          print("Shusky NetHunter defconfig registered.")
          PY

      # 4. Register additional device module outputs

      - name: Register NetHunter modules
        run: |
          set -eux
          cd "$WORKSPACE"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("private/devices/google/zuma/constants.bzl")
          s = p.read_text()

          marker = '    "net/wireless/cfg80211.ko",'

          modules = [
              "drivers/misc/eeprom/eeprom_93cx6.ko",
              "drivers/net/wireless/realtek/rtl818x/rtl8187/rtl8187.ko",
              "drivers/net/wireless/mediatek/mt76/mt76.ko",
              "drivers/net/wireless/mediatek/mt76/mt76-usb.ko",
              "drivers/net/wireless/mediatek/mt76/mt76x02-lib.ko",
              "drivers/net/wireless/mediatek/mt76/mt76x02-usb.ko",
              "drivers/net/wireless/mediatek/mt76/mt76x2/mt76x2-common.ko",
              "drivers/net/wireless/mediatek/mt76/mt76x2/mt76x2u.ko",
          ]

          assert s.count(marker) == 1, (
              "Cannot uniquely locate cfg80211 in ZUMA_MODULE_OUTS"
          )

          missing = [
              m for m in modules
              if f'"{m}"' not in s
          ]

          if missing:
              addition = "".join(
                  f'    "{m}",\n' for m in missing
              )
              s = s.replace(
                  marker,
                  marker + "\n" + addition.rstrip(),
                  1
              )

          p.write_text(s)

          print("Registered additional module outputs:")
          for m in modules:
              print(m)
          PY

      # 5. Build official Google Shusky target

      - name: Compile Pixel 8 kernel with Kleaf
        run: |
          set -eux
          cd "$WORKSPACE"

          ./build_shusky.sh \
            --//build/kernel/kleaf:use_prebuilt_gki=false \
            --verbose_failures

      # 6. Verify kernel distribution

      - name: Verify kernel image and config
        run: |
          set -eux
          cd "$WORKSPACE"

          DIST="out/$DEVICE/dist"

          test -d "$DIST"
          test -s "$DIST/Image.lz4"
          test -s "$DIST/.config"

          mkdir -p build-report

          ls -lh "$DIST/Image.lz4"

          sha256sum "$DIST/Image.lz4" \
            | tee build-report/kernel-image.sha256

      - name: Verify final kernel configuration
        run: |
          set -eux
          cd "$WORKSPACE"

          python3 - <<'PY'
          from pathlib import Path

          config = Path("out/shusky/dist/.config")

          if not config.is_file():
              raise SystemExit("Missing Shusky distribution .config")

          values = {}

          for line in config.read_text().splitlines():
              if line.startswith("CONFIG_") and "=" in line:
                  key, value = line.split("=", 1)
                  values[key] = value
              elif line.startswith("# CONFIG_") and line.endswith(" is not set"):
                  values[line.split()[1]] = "n"

          required = {
              "CONFIG_MODULES": "y",
              "CONFIG_MODVERSIONS": "y",
              "CONFIG_WLAN": "y",
              "CONFIG_CFG80211": "m",
              "CONFIG_MAC80211": "m",
              "CONFIG_USB": "y",
              "CONFIG_WLAN_VENDOR_REALTEK": "y",
              "CONFIG_EEPROM_93CX6": "m",
              "CONFIG_RTL8187": "m",
              "CONFIG_WLAN_VENDOR_MEDIATEK": "y",
              "CONFIG_MT76_CORE": "m",
              "CONFIG_MT76_USB": "m",
              "CONFIG_MT76x02_LIB": "m",
              "CONFIG_MT76x02_USB": "m",
              "CONFIG_MT76x2_COMMON": "m",
              "CONFIG_MT76x2U": "m",
          }

          errors = []

          for key, expected in required.items():
              actual = values.get(key, "n")
              print(f"{key}: {actual} (expected {expected})")

              if actual != expected:
                  errors.append(
                      f"{key}: expected {expected}, got {actual}"
                  )

          ksu = values.get("CONFIG_KSU", "n")
          print(f"CONFIG_KSU: {ksu}")

          if ksu in ("y", "m"):
              errors.append("KernelSU is enabled in the kernel config")

          if errors:
              raise SystemExit("\n".join(errors))

          Path("build-report").mkdir(exist_ok=True)
          Path("build-report/final.config").write_text(
              config.read_text()
          )

          print("Kernel configuration checks passed.")
          PY

      # 7. Verify required modules

      - name: Verify required wireless modules
        run: |
          set -eux
          cd "$WORKSPACE"

          DIST="out/$DEVICE/dist"
          mkdir -p build-report

          MODULES=(
            eeprom_93cx6.ko
            rtl8187.ko
            mt76.ko
            mt76-usb.ko
            mt76x02-lib.ko
            mt76x02-usb.ko
            mt76x2-common.ko
            mt76x2u.ko
            cfg80211.ko
            mac80211.ko
          )

          : > build-report/modules.txt

          for module in "${MODULES[@]}"; do
            mapfile -t matches < <(
              find "$DIST" -type f -name "$module"
            )

            if [ "${#matches[@]}" -ne 1 ]; then
              echo "ERROR: Expected exactly one $module"
              printf '%s\n' "${matches[@]}"
              exit 1
            fi

            FILE="${matches[0]}"
            test -s "$FILE"

            echo "$FILE" >> build-report/modules.txt
            echo "Found: $FILE"
            ls -lh "$FILE"
          done

      # 8. Verify module metadata

      - name: Check module metadata
        run: |
          set -eux
          cd "$WORKSPACE"

          : > build-report/module-metadata.txt
          REFERENCE_VERMAGIC=""

          while IFS= read -r FILE; do
            echo "------------------------------" \
              >> build-report/module-metadata.txt

            echo "$FILE" >> build-report/module-metadata.txt
            modinfo "$FILE" >> build-report/module-metadata.txt

            VERMAGIC="$(modinfo -F vermagic "$FILE")"

            if [ -z "$VERMAGIC" ]; then
              echo "ERROR: Missing vermagic: $FILE"
              exit 1
            fi

            if [ -z "$REFERENCE_VERMAGIC" ]; then
              REFERENCE_VERMAGIC="$VERMAGIC"
            elif [ "$VERMAGIC" != "$REFERENCE_VERMAGIC" ]; then
              echo "ERROR: Inconsistent module vermagic"
              exit 1
            fi

          done < build-report/modules.txt

          echo "$REFERENCE_VERMAGIC" \
            > build-report/module-vermagic.txt

      # 9. Collect build information

      - name: Collect build information
        if: always()
        run: |
          set +e
          cd "$WORKSPACE"

          mkdir -p build-report

          {
            echo "Device: $DEVICE_CODENAME"
            echo "Branch: $KERNEL_BRANCH"
            echo "Kernel label: $CUSTOM_KERNEL_VERSION"
            echo "Build date UTC: $(date -u)"
            echo
            echo "Distribution:"
            ls -lah out/shusky/dist
            echo
            echo "Kernel image hash:"
            sha256sum out/shusky/dist/Image.lz4
          } > build-report/build-summary.txt 2>&1

          find out -type f \
            \( -name "Module.symvers" \
            -o -name "modules.order" \
            -o -name "modules.builtin" \
            -o -name "kernel.release" \) \
            -print > build-report/kernel-build-files.txt

      # 10. Upload artifacts

      - name: Upload verified kernel build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shiba-twk-v${{ env.CUSTOM_KERNEL_VERSION }}-verified-build
          path: |
            workspace/out/shusky/dist/
            workspace/build-report/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      - name: Upload diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shiba-twk-v${{ env.CUSTOM_KERNEL_VERSION }}-build-diagnostics
          path: |
            workspace/build-report/
            workspace/out/shusky/dist/
          if-no-files-found: ignore
          retention-days: 7
